<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panorama Viewer</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #viewer {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: grab;
      overflow: hidden;
      background: #000;
      touch-action: none;
      user-select: none;
    }

    #viewer.dragging {
      cursor: grabbing;
    }

    #scenePlane {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform: none;
      pointer-events: none;
    }

    #scenePlane .hotspot {
      pointer-events: auto;
    }

    #panoramaStrip {
      position: absolute;
      left: 0;
      top: var(--pano-strip-top, 0px);
      height: var(--pano-frame-height, 100vh);
      display: flex;
      filter: brightness(var(--pano-brightness, 1));
      will-change: transform, filter;
    }

    .panoFrame {
      position: relative;
      height: var(--pano-frame-height, 100vh);
      flex: 0 0 var(--pano-frame-width, calc(100vh * 16 / 9));
      background-position: center center;
      background-size: 100% 100%;
      background-repeat: no-repeat;
    }

    .hotspot {
      position: absolute;
      width: 37.8px;
      height: 37.8px;
      border-radius: 50%;
      background: rgba(128, 128, 128, 0.3);
      border: none;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transform: translate(-50%, -50%) scale(var(--hotspot-scale, 0.42));
      transform-origin: center center;
      cursor: pointer;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0;
      line-height: 1;
      user-select: none;
      transition: opacity 0.22s ease, background 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease;
      will-change: transform, opacity;
      overflow: visible;
    }


    .hotspot::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 37.8px;
      height: 37.8px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.18);
      transform: translate(-50%, -50%) scale(0.82);
      opacity: 0.7;
      pointer-events: none;
      z-index: 1;
      animation: hotspotPulse 2.85s ease-out infinite;
    }

    @keyframes hotspotPulse {
      0% {
        transform: translate(-50%, -50%) scale(0.82);
        opacity: 0.7;
      }

      45% {
        transform: translate(-50%, -50%) scale(2.0);
        opacity: 0;
      }

      100% {
        transform: translate(-50%, -50%) scale(2.0);
        opacity: 0;
      }
    }

    .hotspot::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 17px;
      height: 17px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.5);
      box-shadow: 0 2px 9px rgba(0, 0, 0, 0.28);
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 2;
    }

    .hotspotLabel {
      position: absolute;
      left: 50%;
      top: 50%;
      transform:
        translate(-50%, calc(-50% - var(--label-distance, 52px))) scale(var(--label-counter-scale, 1));
      transform-origin: center center;
      color: #fff;
      font-size: 13px;
      font-weight: 800;
      line-height: 1;
      white-space: nowrap;
      opacity: var(--hotspot-label-opacity, 0);
      pointer-events: none;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.65);
      transition: opacity 0.16s ease;
      will-change: transform, opacity;
      z-index: 3;
    }

    .hotspot:hover,
    .hotspot.is-over {
      background: rgba(255, 255, 255, 0.42);
      border-color: rgba(255, 255, 255, 0.94);
      box-shadow: 0 0 18px rgba(255, 255, 255, 0.28), 0 10px 28px rgba(0, 0, 0, 0.24);
    }

    .hotspot:hover::after,
    .hotspot.is-over::after {
      background: #fff;
      box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.28), 0 0 18px rgba(255, 255, 255, 0.38), 0 5px 16px rgba(0, 0, 0, 0.34);
    }

    #frameButtons {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      z-index: 15;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 4px 22px;
      width: max-content;
      max-width: min(1180px, calc(100vw - 40px));
      padding: 12px 22px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.20);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      opacity: 1;
      pointer-events: auto;
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    #frameButtons.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%) translateY(12px);
    }

    .frameButton {
      position: relative;
      min-width: 0;
      height: 34px;
      padding: 0 0 7px;
      border: none;
      outline: none;
      border-radius: 0;
      background: transparent;
      color: rgba(255, 255, 255, 0.66);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.055em;
      cursor: pointer;
      white-space: nowrap;
      opacity: 0.72;
      transition:
        color 0.32s ease-in-out,
        opacity 0.32s ease-in-out,
        transform 0.32s ease-in-out,
        text-shadow 0.32s ease-in-out;
    }

    .frameButton::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 100%;
      height: 2px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.98);
      opacity: 0;
      transform: translateX(-50%) scaleX(0);
      transform-origin: center center;
      transition:
        transform 0.42s cubic-bezier(0.65, 0, 0.35, 1),
        opacity 0.22s ease-in-out;
    }

    .frameButton:hover,
    .frameButton:focus-visible {
      color: #fff;
      opacity: 0.92;
      transform: translateY(-1px);
    }

    .frameButton.active {
      color: #fff;
      opacity: 1;
      transform: translateY(-2px);
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.45);
    }

    .frameButton.active::after {
      opacity: 1;
      transform: translateX(-50%) scaleX(1);
    }



    /*
      Holds sequence frame 00 over the viewer while the matching panorama
      frame is restored underneath, then gently fades away. This prevents
      the brief black flash and softens compression differences.
    */
    #sequenceReturnOverlay {
      position: fixed;
      left: 0;
      top: var(--pano-strip-top, 0px);
      width: var(--pano-frame-width, calc(100vh * 16 / 9));
      height: var(--pano-frame-height, 100vh);
      z-index: 13;
      display: block;
      background-position: center center;
      background-size: 100% 100%;
      background-repeat: no-repeat;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      will-change: opacity;
    }

    #sequenceReturnOverlay.is-visible {
      opacity: 1;
      visibility: visible;
      transition: none;
    }

    #sequenceReturnOverlay.is-fading {
      opacity: 0;
      visibility: visible;
      transition: opacity 0.68s ease-in-out;
    }

    /*
      Sequence frames are drawn from fully decoded image elements onto one
      canvas. This avoids repeatedly asking the browser to repaint CSS
      background images, which can flash on slower GPUs or under memory load.
    */
    #sequencePlaybackCanvas {
      position: fixed;
      left: 0;
      top: var(--pano-strip-top, 0px);
      width: var(--pano-frame-width, calc(100vh * 16 / 9));
      height: var(--pano-frame-height, 100vh);
      z-index: 12;
      display: none;
      pointer-events: none;
      image-rendering: auto;
    }

    /*
      Keep the selected sequence's decoded source images attached to the DOM.
      Some browsers are more aggressive about discarding decoded data from
      detached Image objects, which can cause frames to flash during playback.
    */
    #sequenceFramePreloader {
      position: fixed;
      left: -10000px;
      top: -10000px;
      width: 2px;
      height: 2px;
      overflow: hidden;
      pointer-events: none;
      opacity: 0.001;
    }

    #sequenceFramePreloader img {
      display: block;
      width: 2px;
      height: 2px;
    }

    #infoBox {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(420px, 86vw);
      padding: 28px;
      background: rgba(255, 255, 255, 0.95);
      color: #111;
      border-radius: 18px;
      z-index: 20;
      display: none;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      text-align: center;
    }

    #closeInfo {
      margin-top: 20px;
      padding: 10px 18px;
      border: none;
      border-radius: 999px;
      background: #111;
      color: white;
      cursor: pointer;
    }


    #sequenceLottiePanel {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 19;
      display: none;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    #sequenceLottieCard {
      position: relative;
      isolation: isolate;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 22px 28px 26px;
      border-radius: 28px;
      background: transparent;
      pointer-events: none;
      transform: scale(0.16);
      transform-origin: center center;
      transition: transform 1.15s cubic-bezier(0.65, 0, 0.35, 1);
      will-change: transform;
    }

    #sequenceLottieCard.is-chrome-visible {
      transform: scale(1);
    }

    #sequenceLottieCard::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      border-radius: inherit;
      background: rgba(0, 0, 0, 0.42);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 18px 55px rgba(0, 0, 0, 0.28);
      opacity: 0;
      transition: opacity 1.15s cubic-bezier(0.65, 0, 0.35, 1);
      will-change: opacity;
    }

    #sequenceLottieCard.is-chrome-visible::before {
      opacity: 1;
    }

    #sequenceVisualGroup {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 0;
      flex: 0 1 auto;
    }

    #sequenceLottie {
      position: relative;
      width: min(1040px, 88vw);
      height: min(600px, 68vh);
      pointer-events: none;
      opacity: 0;
      overflow: hidden;
      transform: translateY(10px) scale(0.975);
      transform-origin: center center;
      transition:
        opacity 0.34s ease-in-out,
        transform 0.34s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: opacity, transform;
    }

    #sequenceLottieCard.is-content-visible #sequenceLottie {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .sequenceLottieLayer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 1;
      visibility: visible;
      pointer-events: none;
      z-index: 1;
      transition:
        opacity 0.28s ease-in-out,
        visibility 0.28s ease-in-out;
      will-change: opacity;
    }

    .sequenceLottieLayer.is-incoming {
      opacity: 0;
      visibility: hidden;
      z-index: 2;
    }

    .sequenceLottieLayer.is-fading-out {
      opacity: 0;
      visibility: visible;
      z-index: 1;
    }

    .sequenceLottieLayer svg,
    .sequenceLottieLayer canvas {
      width: 100% !important;
      height: 100% !important;
    }

    /*
      METAL CRAFT and SOFFIT use profile-page navigation with multiple Lottie options.
      The outer dots stay at 30% white; the smaller center dot animates
      between positions to show the currently selected option.
    */
    #metalCraftPagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      min-height: 12px;
      /* Pull the dots closer to the bottom edge of the Lottie. */
      margin-top: -18px;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition:
        opacity 1.15s cubic-bezier(0.65, 0, 0.35, 1),
        visibility 1.15s linear;
    }

    #sequenceLottieCard.is-multi-lottie.is-chrome-visible #metalCraftPagination {
      opacity: 1;
      visibility: visible;
    }

    .metalCraftDot {
      position: relative;
      width: 10px;
      height: 10px;
      flex: 0 0 10px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.30);
    }

    .metalCraftDot::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      /* The active white dot grows to exactly cover the 30%-opacity dot. */
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: rgba(255, 255, 255, 1);
      opacity: 0;
      transform: translate(-50%, -50%) scale(0);
      transition:
        opacity 0.75s ease-in-out,
        transform 0.75s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .metalCraftDot.is-active::after {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .metalCraftNavButton {
      position: absolute;
      top: calc(50% - 4px);
      z-index: 5;
      width: 56px;
      height: 56px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 7px 20px rgba(0, 0, 0, 0.26);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateY(-50%);
      transition:
        opacity 1.15s cubic-bezier(0.65, 0, 0.35, 1),
        visibility 1.15s linear,
        background 0.22s ease;
    }

    #metalCraftPrevButton {
      left: clamp(18px, 5.4vw, 76px);
    }

    #metalCraftNextButton {
      right: clamp(18px, 5.4vw, 76px);
    }

    .metalCraftNavButton svg {
      width: 29px;
      height: 29px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.15;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }

    #sequenceLottieCard.is-multi-lottie.is-chrome-visible .metalCraftNavButton:not(.is-hidden) {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translateY(-50%);
    }

    #sequenceLottieCard.is-multi-lottie.is-chrome-visible .metalCraftNavButton:not(.is-hidden):hover,
    #sequenceLottieCard.is-multi-lottie.is-chrome-visible .metalCraftNavButton:not(.is-hidden):focus-visible {
      transform: translateY(-50%) scale(1.07);
      background: rgba(0, 0, 0, 0.46);
      outline: none;
    }

    .metalCraftNavButton.is-hidden {
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
      transform: translateY(-50%) scale(0.72) !important;
    }

    .metalCraftNavButton.is-busy {
      pointer-events: none !important;
      opacity: 0.48 !important;
    }

    #sequenceContextText {
      display: none;
      max-width: min(620px, 78vw);
      margin: 10px 22px 0;
      color: rgba(255, 255, 255, 0.92);
      font-size: 14px;
      font-weight: 500;
      line-height: 1.45;
      letter-spacing: 0.01em;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.15s cubic-bezier(0.65, 0, 0.35, 1);
    }

    #sequenceLottieCard.is-neo-lumber #sequenceContextText {
      display: block;
    }

    #sequenceLottieCard.is-neo-lumber.is-chrome-visible #sequenceContextText {
      opacity: 1;
    }

    #sequenceLearnMore {
      position: relative;
      margin-top: 12px;
      padding: 12px 24px;
      border: 1px solid rgba(255, 255, 255, 0.10);
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.24);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.14);
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      cursor: pointer;
      pointer-events: none;
      opacity: 0;
      overflow: hidden;
      transition:
        opacity 1.15s cubic-bezier(0.65, 0, 0.35, 1),
        background 0.22s ease,
        border-color 0.22s ease,
        box-shadow 0.22s ease;
    }

    /* CONTINUE uses a clean fill with no simulated glass-edge highlight. */
    #sequenceLearnMore::before,
    #sequenceLearnMore::after {
      content: none;
    }

    #sequenceLottieCard.is-chrome-visible #sequenceLearnMore {
      opacity: 1;
      pointer-events: auto;
    }

    #sequenceLottieCard.is-chrome-visible #sequenceLearnMore:hover {
      transform: scale(1.05);
      background: rgba(0, 0, 0, 0.32);
      border-color: rgba(255, 255, 255, 0.14);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.17);
    }

    /* Give multi-profile page indicators a clear visual break before CONTINUE. */
    #sequenceLottieCard.is-multi-lottie #sequenceLearnMore {
      margin-top: 42px;
    }


    #sequenceLoadingOverlay {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 18px 22px;
      border-radius: 18px;
      background: rgba(0, 0, 0, 0.30);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.09em;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition:
        opacity 0.24s ease,
        visibility 0.24s ease;
    }

    #sequenceLoadingOverlay.is-visible {
      opacity: 1;
      visibility: visible;
    }

    #sequenceLoadingSpinner {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.25);
      border-top-color: #fff;
      animation: sequenceLoadingSpin 0.9s linear infinite;
    }

    @keyframes sequenceLoadingSpin {
      to {
        transform: rotate(360deg);
      }
    }

    #panToggleButton {
      position: fixed;
      left: 50%;
      top: 18px;
      bottom: auto;
      transform: translateX(-50%);
      z-index: 18;
      width: 44px;
      height: 44px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.20);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    #panToggleButton:hover {
      background: rgba(0, 0, 0, 0.32);
      transform: translateX(-50%) scale(1.05);
    }

    #panToggleButton svg {
      width: 19px;
      height: 19px;
      fill: currentColor;
      pointer-events: none;
    }

    #hotspotConnectorOverlay {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 14;
      pointer-events: none;
      overflow: visible;
    }

    .hotspotConnectorLine {
      stroke: rgba(255, 255, 255, 0.95);
      stroke-width: 1.5;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
      opacity: 0;
    }

    .hotspotConnectorDot {
      fill: #fff;
      opacity: 0;
    }

    /*
      The center dot never changes size. A separate translucent halo expands
      outward once after the connector reaches the hotspot, matching the
      visual language of the hotspot pulse.
    */
    .hotspotConnectorPulse {
      fill: rgba(255, 255, 255, 0.34);
      opacity: 0;
      filter: drop-shadow(0 0 7px rgba(255, 255, 255, 0.72));
      transform-box: fill-box;
      transform-origin: center center;
      pointer-events: none;
    }

    .hotspotConnectorPulse.is-arrived-pulse {
      animation: connectorHaloArrivalPulse 1.35s ease-out 1;
    }

    @keyframes connectorHaloArrivalPulse {
      0% {
        transform: scale(0.10);
        opacity: 0.95;
      }

      72% {
        transform: scale(2);
        opacity: 0;
      }

      100% {
        transform: scale(2);
        opacity: 0;
      }
    }

    #hotspotFocusCircle {
      position: fixed;
      left: 50%;
      bottom: 104px;
      transform: translateX(-50%) scale(1);
      transform-origin: center center;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: none;
      background: rgba(0, 0, 0, 0.20);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 15;
      pointer-events: none;
      box-sizing: border-box;
      overflow: visible;
      transition:
        opacity 0.48s ease-out,
        visibility 0.48s ease-out,
        transform 0.48s cubic-bezier(0.22, 1, 0.36, 1),
        background 0.25s ease,
        border-color 0.25s ease,
        backdrop-filter 0.25s ease;
    }


    #hotspotFocusCircle.startup-hidden {
      opacity: 0;
      visibility: hidden;
      transform: translateX(-50%) scale(0.78);
    }

    #hotspotThumbnailStage {
      position: absolute;
      left: 13px;
      right: 13px;
      bottom: 10px;
      height: calc(190% - 15.6px);
      z-index: 2;
      pointer-events: auto;
      cursor: pointer;
      overflow: hidden;
      /*
        This creates the blue-mask shape from your sketch:
        straight vertical sides, open above the circle, and a rounded bottom
        that sits just inside the circle.
      */
      border-radius: 0 0 999px 999px;
      perspective: 900px;
      transform-style: preserve-3d;
    }

    .hotspotFocusThumbnail {
      position: absolute;
      left: 50%;
      bottom: -10px;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center bottom;
      transform: translateX(-50%) rotateY(0deg) scale(0.95);
      transform-origin: center bottom;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      backface-visibility: hidden;
      will-change: transform;
      transition-property: transform;
      transition-duration: 0.95s;
    }


    .hotspotFocusThumbnail.startup-thumbnail {
      opacity: 0;
      visibility: visible;
      transform: translateX(-50%) rotateY(0deg) scale(0.74);
      transition: none;
    }

    .hotspotFocusThumbnail.startup-thumbnail.startup-thumbnail-show {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) rotateY(0deg) scale(0.95);

       a compact top-right hamburger button and dropdown panel.
       ================================================================ */
    #mobileMenuButton {
      position: fixed;
      right: 18px;
      top: 18px;
      z-index: 18;
      width: 44px;
      height: 44px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.20);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #fff;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      transition:
        opacity 0.25s ease,
        visibility 0.25s ease,
        background 0.2s ease,
        transform 0.2s ease;
    }

    #mobileMenuButton svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      pointer-events: none;
    }

    #mobileMenuButton:hover,
    #mobileMenuButton:focus-visible,
    #mobileMenuButton.is-open {
      background: rgba(0, 0, 0, 0.38);
      transform: scale(1.05);
      outline: none;
    }

    #mobileMenuButton.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: scale(0.82);
    }

    @media (hover: none) and (pointer: coarse),
    (max-width: 700px),
    (max-height: 600px) and (orientation: landscape) {
      #mobileMenuButton {
        display: flex;
        right: max(10px, env(safe-area-inset-right));
        top: max(10px, env(safe-area-inset-top));
        width: 40px;
        height: 40px;
      }

      /* The old bottom row becomes a closed dropdown by default. */
      #frameButtons {
        left: auto;
        right: max(10px, env(safe-area-inset-right));
        top: calc(max(10px, env(safe-area-inset-top)) + 48px);
        bottom: auto;
        width: min(232px, calc(100vw - 20px));
        max-width: min(232px, calc(100vw - 20px));
        max-height: min(72vh, 520px);
        max-height: min(72dvh, 520px);
        overflow-y: auto;
        transform: translateY(-8px) scale(0.96);
        transform-origin: top right;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        justify-content: flex-start;
        gap: 2px;
        padding: 8px;
        box-sizing: border-box;
        border-radius: 18px;
        background: rgba(0, 0, 0, 0.42);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        box-shadow: 0 14px 34px rgba(0, 0, 0, 0.28);
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition:
          opacity 0.24s ease,
          visibility 0.24s ease,
          transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
      }

      #frameButtons.mobile-open:not(.hidden) {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        transform: translateY(0) scale(1);
      }

      #frameButtons.hidden {
        opacity: 0 !important;
        visibility: hidden !important;
        pointer-events: none !important;
        transform: translateY(-8px) scale(0.96) !important;
      }

      #frameButtons .frameButton {
        width: 100%;
        min-width: 0;
        height: 36px;
        padding: 0 12px 2px;
        border-radius: 11px;
        color: rgba(255, 255, 255, 0.78);
        font-size: 10px;
        letter-spacing: 0.045em;
        text-align: left;
        overflow: visible;
        white-space: nowrap;
      }

      #frameButtons .frameButton::after {
        left: 12px;
        right: 12px;
        bottom: 4px;
        width: auto;
        transform: scaleX(0);
        transform-origin: left center;
      }

      #frameButtons .frameButton.active,
      #frameButtons .frameButton:hover,
      #frameButtons .frameButton:focus-visible {
        background: rgba(255, 255, 255, 0.08);
        transform: none;
      }

      #frameButtons .frameButton.active::after {
        transform: scaleX(1);
      }

      /* Move the thumbnail focus control into the space recovered by removing
         the bottom button row and reduce it continuously for phone screens. */
      #hotspotFocusCircle {
        width: clamp(86px, 23vw, 108px);
        height: clamp(86px, 23vw, 108px);
        bottom: max(12px, calc(env(safe-area-inset-bottom) + 8px));
      }

      #hotspotThumbnailStage {
        left: 10px;
        right: 10px;
        bottom: 7px;
      }

      #hotspotFocusClose {
        width: 28px;
        height: 28px;
        /* Keep the small control outside the circle instead of letting the
           two circular shapes collide as the focus element scales down. */
        right: -20px;
        bottom: -4px;
      }

      #hotspotFocusClose svg {
        width: 15px;
        height: 15px;
      }

      #hotspotFocusCircle.is-disabled #hotspotFocusClose {
        width: 126px;
        height: 32px;
        bottom: 0;
        font-size: 9px;
      }

      /* Whenever the mobile dropdown control replaces the desktop button row,
         the pause/play control occupies the matching top-left position. It no
         longer waits for the dropdown to be opened before moving. */
      #panToggleButton {
        left: max(10px, env(safe-area-inset-left));
        transform: none;
        transition:
          background 0.2s ease,
          transform 0.2s ease;
      }

      #panToggleButton:hover,
      #panToggleButton:focus-visible {
        transform: scale(1.05);
      }
    }

    @media (hover: none) and (pointer: coarse) and (orientation: landscape),
    (max-height: 600px) and (orientation: landscape) {
      #mobileMenuButton {
        right: max(8px, env(safe-area-inset-right));
        top: max(8px, env(safe-area-inset-top));
        width: 36px;
        height: 36px;
      }

      #mobileMenuButton svg {
        width: 18px;
        height: 18px;
      }

      #frameButtons {
        right: max(8px, env(safe-area-inset-right));
        top: calc(max(8px, env(safe-area-inset-top)) + 43px);
        width: min(218px, calc(100vw - 16px));
        max-width: min(218px, calc(100vw - 16px));
        max-height: min(76vh, 330px);
        max-height: min(76dvh, 330px);
        padding: 7px;
        border-radius: 15px;
      }

      #frameButtons .frameButton {
        height: 31px;
        padding-inline: 10px;
        font-size: 9px;
      }

      #hotspotFocusCircle {
        width: clamp(66px, 18vh, 82px);
        height: clamp(66px, 18vh, 82px);
        bottom: max(8px, calc(env(safe-area-inset-bottom) + 5px));
      }

      #hotspotThumbnailStage {
        left: 8px;
        right: 8px;
        bottom: 5px;
      }

      #hotspotFocusClose {
        width: 24px;
        height: 24px;
        right: -18px;
        bottom: -4px;
      }

      #hotspotFocusCircle.is-disabled #hotspotFocusClose {
        width: 112px;
        height: 28px;
        font-size: 8px;
      }

      #panToggleButton {
        left: max(8px, env(safe-area-inset-left));
      }
    }

  </style>
</head>

<body>

    <button id="closeInfo">Close</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
  <script>
    const container = document.getElementById("viewer");
    const scenePlane = document.getElementById("scenePlane");
    const panoramaStrip = document.getElementById("panoramaStrip");
    const frameButtonsWrapper = document.getElementById("frameButtons");
    let frameButtons = [];
    const sequenceBackButton = document.getElementById("sequenceBackButton");
    const sequenceReturnOverlay = document.getElementById("sequenceReturnOverlay");
    const sequencePlaybackCanvas = document.getElementById("sequencePlaybackCanvas");
    const sequencePlaybackContext = sequencePlaybackCanvas.getContext("2d", { alpha: false });
    const sequenceFramePreloader = document.getElementById("sequenceFramePreloader");
    const sequenceLottiePanel = document.getElementById("sequenceLottiePanel");
    const sequenceLottieContainer = document.getElementById("sequenceLottie");
    const sequenceLottieCard = document.getElementById("sequenceLottieCard");
    const sequenceContextText = document.getElementById("sequenceContextText");
    const sequenceLearnMore = document.getElementById("sequenceLearnMore");
    const metalCraftPrevButton = document.getElementById("metalCraftPrevButton");
    const metalCraftNextButton = document.getElementById("metalCraftNextButton");
    const metalCraftPagination = document.getElementById("metalCraftPagination");
    const metalCraftDots = Array.from(document.querySelectorAll(".metalCraftDot"));
    const sequenceLoadingOverlay = document.getElementById("sequenceLoadingOverlay");
    const infoBox = document.getElementById("infoBox");
    const panToggleButton = document.getElementById("panToggleButton");
    const mobileMenuButton = document.getElementById("mobileMenuButton");
    const compactHotspotMenuMediaQuery = window.matchMedia(
      "(hover: none) and (pointer: coarse), (max-width: 700px), (max-height: 600px) and (orientation: landscape)"
    );
    let compactHotspotMenuLayoutActive = compactHotspotMenuMediaQuery.matches;
    const hotspotConnectorLineA = document.getElementById("hotspotConnectorLineA");
    const hotspotConnectorPulseA = document.getElementById("hotspotConnectorPulseA");
    const hotspotConnectorDotA = document.getElementById("hotspotConnectorDotA");
    const hotspotConnectorLineB = document.getElementById("hotspotConnectorLineB");
    const hotspotConnectorPulseB = document.getElementById("hotspotConnectorPulseB");
    const hotspotConnectorDotB = document.getElementById("hotspotConnectorDotB");
    const hotspotFocusCircle = document.getElementById("hotspotFocusCircle");
    const hotspotFocusThumbnailA = document.getElementById("hotspotFocusThumbnailA");
    const hotspotFocusThumbnailB = document.getElementById("hotspotFocusThumbnailB");
    const hotspotFocusClose = document.getElementById("hotspotFocusClose");
    const hotspotFocusArcBlur = document.getElementById("hotspotFocusArcBlur");
    const hotspotFocusArcSegment = document.getElementById("hotspotFocusArcSegment");

    let hotspotConnectorEnabled = true;
    let thumbnailsWereOpenBeforeSequence = false;
    let currentThumbnailKey = "";
    let activeThumbnailElement = hotspotFocusThumbnailA;
    let inactiveThumbnailElement = hotspotFocusThumbnailB;
    let thumbnailSwapToken = 0;
    let recentThumbnailPanSpeed = 0;
    let connectorActiveHotspot = null;
    let connectorOutgoingHotspot = null;
    let connectorTransitionStart = 0;
    let connectorTransitioning = false;
    const connectorTransitionDuration = 850;

    const frameFolder = "180";
    const frameCount = 3;
    const panoFrameAspectRatio = 16 / 9;

    /*
      Hotspot adjustments were originally measured against the 1920 × 1080
      panorama artwork. Keep those nudges in source-image space and scale them
      with the rendered panorama so hotspots stay attached to the same object
      at every browser and device aspect ratio.
    */
    const panoSourceWidth = 1920;
    const panoSourceHeight = 1080;

    const frames = Array.from({ length: frameCount }, (_, i) => {
      return `${frameFolder}/frame${String(i).padStart(4, "0")}.jpg`;
    });

    /*
      Sequence setup.
      Button numbers are one higher than frame indexes:
      - Button 1 = frame index 0 = RANDOM PLANK sequence
      - Button 2 = frame index 1 = BOARD + BATTEN sequence
      - Button 3 = frame index 2 = NEO LUMBER sequence

      To add more later, add another object here with:
      frame, hotspotText, folder, prefix, count
    */
    /*
      Sequence frame counts are defined per hotspot below.

      Folder: hotspot title
      Files:  hotspot title + a two-digit frame number

      Examples:
      METAL CRAFT/METAL CRAFT00.jpg
      METAL CRAFT/METAL CRAFT29.jpg
    */
    // Each selected sequence must fully load and decode before either direction plays.
    const sequenceConfigs = [
      { key: "customCut", frame: 0, hotspotText: "CUSTOM CUT", folder: "CUSTOM CUT", prefix: "CUSTOM CUT", count: 40, pad: 2, extension: "jpg", fps: 24, learnMoreUrl: "https://luxarpro.com/v-groove-steel-siding/" },
      { key: "randomPlank", frame: 0, hotspotText: "RANDOM PLANK", folder: "RANDOM PLANK", prefix: "RANDOM PLANK", count: 40, pad: 2, extension: "jpg", fps: 24, learnMoreUrl: "https://luxarpro.com/random-plank/" },
      { key: "metalCraft", frame: 0, hotspotText: "METAL CRAFT", folder: "METAL CRAFT", prefix: "METAL CRAFT", count: 30, pad: 2, extension: "jpg", fps: 24, sourceOffsetX: 281, sourceCanvasWidth: 1920, learnMoreUrl: "https://luxarpro.com/metal-craft-series/" },
      { key: "boardBatten", frame: 1, hotspotText: "BOARD + BATTEN", folder: "BOARD + BATTEN", prefix: "BOARD + BATTEN", count: 40, pad: 2, extension: "jpg", fps: 24, learnMoreUrl: "https://luxarpro.com/board-and-batten/" },
      { key: "boardBatten02", frame: 1, hotspotText: "BOARD + BATTEN", folder: "BOARD + BATTEN 02", prefix: "BOARD + BATTEN", count: 40, pad: 2, extension: "jpg", fps: 24, learnMoreUrl: "https://luxarpro.com/board-and-batten/" },
      { key: "soffit", frame: 1, hotspotText: "SOFFIT", folder: "SOFFIT", prefix: "SOFFIT", count: 48, pad: 2, extension: "jpg", fps: 24, learnMoreUrl: "https://luxarpro.com/soffit/" },
      { key: "luxLap", frame: 1, hotspotText: "LUX LAP", folder: "LUX LAP", prefix: "LUX LAP", count: 32, pad: 2, extension: "jpg", fps: 24, learnMoreUrl: "https://luxarpro.com/lux-lap-cladding-panel/" },
      { key: "channelSiding", frame: 2, hotspotText: "CHANNEL SIDING", folder: "CHANNEL SIDING", prefix: "CHANNEL SIDING", count: 40, pad: 2, extension: "jpg", fps: 24, learnMoreUrl: "https://luxarpro.com/channel-siding/" },
      { key: "neoLumber", frame: 2, hotspotText: "NEO LUMBER", folder: "NEO LUMBER", prefix: "NEO LUMBER", count: 40, pad: 2, extension: "jpg", fps: 24, learnMoreUrl: "https://luxarpro.com/neo-lumber/" }
    ];

    const sequenceByFrame = new Map();
    const sequenceByKey = new Map();
    const sequenceByHotspotText = new Map();

    function normalizeHotspotKey(value) {
      return String(value || "")
        .trim()
        .toUpperCase()
        .replace(/[^A-Z0-9]/g, "");
    }

    sequenceConfigs.forEach((config) => {
      config.frames = Array.from({ length: config.count }, (_, i) => {
        return `${config.folder}/${config.prefix}${String(i).padStart(config.pad, "0")}.${config.extension}`;
      });

      /*
        Every hotspot now uses its own matching Lottie folder and JSON file.
        Example:
        lottie/LUX LAP/LUX LAP.json

        lottieFolder/lottieName can still be set on an individual config later
        if one animation ever needs a different path or filename.
      */
      config.lottieFolder = config.lottieFolder || config.hotspotText;
      config.lottieName = config.lottieName || config.hotspotText;
      config.lottiePath = `lottie/${encodeURIComponent(config.lottieFolder)}/${encodeURIComponent(config.lottieName)}.json`;

      config.imagesReady = false;
      config.imagesLoading = false;
      config.imageElements = [];

      sequenceByFrame.set(config.frame, config);
      sequenceByKey.set(config.key, config);

      /*
        Keep the first matching title as the default for ordinary hotspots.
        Duplicate titles can select a different sequence explicitly with
        hotspot.sequenceKey without changing their visible product name.
      */
      const normalizedHotspotText = normalizeHotspotKey(config.hotspotText);
      if (!sequenceByHotspotText.has(normalizedHotspotText)) {
        sequenceByHotspotText.set(normalizedHotspotText, config);
      }
    });

    let autoRotate = true;
    let userPausedAutoRotate = false;
    let autoRotateDirection = 1;
    let isDragging = false;
    let hotspotsVisible = true;

    let currentOffset = 0;
    let targetOffset = 0;
    let panVelocity = 0;

    let previousMouseX = 0;
    let dragStartX = 0;
    let dragStartY = 0;
    let hasDraggedThisGesture = false;

    let pointerX = -9999;
    let pointerY = -9999;
    let pointerInsideViewer = false;

    const parallaxMaxAngle = 4.5;
    const parallaxPerspective = 1400;
    const parallaxEase = 0.075;
    let parallaxCurrentAngle = 0;
    let parallaxTargetAngle = 0;
    let parallaxLockedToNeutral = false;
    let parallaxReturnActive = false;
    let parallaxReturnStartAngle = 0;
    let parallaxReturnStartTime = 0;
    let parallaxReturnDuration = 0;

    // Large click radius keeps small hotspots easy to activate.
    // The overstate radius only brightens the hotspot and no longer changes scale.
    const hotspotHitRadius = 290;
    const hotspotOverstateRadius = 70;

    let hoverPauseTarget = 0;
    let hoverPauseStrength = 0;
    let pendingHotspotHit = null;

    const cameraEase = 0.075;
    const dragFriction = 0.94;
    const dragSensitivity = 1.0;
    const autoRotateSpeed = 0.5;
    const autoRotateResumeDelay = 1500;

    /*
      Mobile landscape uses a height-fit panorama while browsing so Safari's
      visible viewport (including the state with the URL/tab bars open) never
      crops the upper or lower hotspot area. Before a sequence begins, this
      flag switches the panorama to the normal full-cover size while the camera
      pans and zooms in one continuous animation.
    */
    let sequenceCameraZoomed = false;

    let frameWidth = getPanoFrameSize().width;
    let frameHeight = getPanoFrameSize().height;
    let panoStripTop = getPanoFrameSize().top;
    let totalWidth = frameWidth * frameCount;

    /*
      Smooth ease-in/ease-out for button camera moves.
    */
    let buttonTweenActive = false;
    let buttonTweenStartOffset = 0;
    let buttonTweenEndOffset = 0;
    let buttonTweenStartTime = 0;
    let buttonTweenZoomActive = false;
    let buttonTweenStartFrameWidth = 0;
    let buttonTweenStartFrameHeight = 0;
    let buttonTweenStartFrameTop = 0;
    let buttonTweenEndFrameWidth = 0;
    let buttonTweenEndFrameHeight = 0;
    let buttonTweenEndFrameTop = 0;
    let buttonTweenStartCameraUnit = 0;
    let buttonTweenEndCameraUnit = 0;
    const buttonTweenDuration = 2400;
    const buttonSettleDelay = 250;
    /*
      Preloading still begins immediately, but the loading overlay is not
      permitted to appear until the camera pan has completely finished and an
      additional half-second has passed.
    */
    const sequenceLoadingDelayAfterPan = 500;
    /*
      The mobile-landscape return is intentionally slower than the entry move.
      It is a zoom-only release back to the browser-safe panorama composition.
    */
    const sequenceReturnZoomDuration = 2100;
    let buttonArrivalCallback = null;
    let buttonArrivalTimeout = null;

    /*
      Reusable sequence animation state.
    */
    let panoFrameCopies = Array.from({ length: frameCount }, () => []);
    let activeSequence = null;

    function getVisibleViewportSize() {
      /*
        visualViewport is essential on iOS Safari because its height changes
        when the URL/tab bars are shown or hidden. Fall back to innerWidth and
        innerHeight everywhere else.
      */
      const viewport = window.visualViewport;
      return {
        width: Math.max(1, Number(viewport?.width || window.innerWidth || 1)),
        height: Math.max(1, Number(viewport?.height || window.innerHeight || 1))
      };
    }

    function isMobileLandscapePanoramaLayout() {
      const viewport = getVisibleViewportSize();
      const touchLayout =
        window.matchMedia("(hover: none) and (pointer: coarse)").matches ||
        (navigator.maxTouchPoints > 0 &&
          Math.min(viewport.width, viewport.height) <= 900);
      const landscapeLayout =
        window.matchMedia("(orientation: landscape)").matches ||
        viewport.width > viewport.height;

      return touchLayout && landscapeLayout;
    }

    function shouldFitMobileLandscapeHeight() {
      if (!isMobileLandscapePanoramaLayout()) return false;

      const viewport = getVisibleViewportSize();
      const screenShortSide = Math.max(1, Math.min(
        Number(window.screen?.width || viewport.height),
        Number(window.screen?.height || viewport.height)
      ));
      const visibleHeightRatio = viewport.height / screenShortSide;
      const visibleAspectRatio = viewport.width / viewport.height;

      /*
        Preserve the existing cover composition in true fullscreen landscape.
        Switch to full-height fit only when browser chrome has materially
        reduced the visible height (or when the resulting viewport is extremely
        wide), which is the Safari URL/tab-bar case shown in the screenshot.
      */
      return visibleHeightRatio < 0.90 || visibleAspectRatio > 2.35;
    }

    function getCoverPanoFrameSize() {
      /* Normal 16:9 cover mode used by desktop, portrait, and every sequence. */
      const viewport = getVisibleViewportSize();
      const widthByHeight = viewport.height * panoFrameAspectRatio;
      const width = Math.max(viewport.width, widthByHeight);
      const height = width / panoFrameAspectRatio;
      const top = (viewport.height - height) / 2;

      return { width, height, top };
    }

    function getBrowsePanoFrameSize() {
      const viewport = getVisibleViewportSize();

      if (shouldFitMobileLandscapeHeight()) {
        /*
          Fit the complete 16:9 artwork to the currently visible Safari height.
          The panorama strip is continuous, so the extra-wide viewport simply
          reveals neighbouring panorama content at the sides rather than blank
          space. Most importantly, no hotspot or title is vertically cropped.
        */
        return {
          width: viewport.height * panoFrameAspectRatio,
          height: viewport.height,
          top: 0
        };
      }

      return getCoverPanoFrameSize();

      the matching number of CSS pixels at the panorama's current rendered

    */
    function getResponsiveSequenceOffsetX(config, renderedFrameWidth = frameWidth) {
      const sourceOffsetX = Number(config?.sourceOffsetX || 0);
      const sourceCanvasWidth = Number(config?.sourceCanvasWidth || 1920);

      if (!sourceOffsetX || !sourceCanvasWidth) return 0;

      return sourceOffsetX * (renderedFrameWidth / sourceCanvasWidth);

    function getHotspotLocalImageX(hotspot) {
      if (!hotspot) return frameWidth / 2;

      const responsiveHotspotOffsetX =
        Number(hotspot.offsetX || 0) * (frameWidth / panoSourceWidth);

      return (Number(hotspot.x || 50) / 100) * frameWidth + responsiveHotspotOffsetX;
    }

    function getPortraitSequenceViewportCropX(hotspot, config) {
      if (!isMobilePortraitSequenceLayout() || !hotspot || !config) return 0;

      /*
        The sequence image begins at config.sourceOffsetX within the panorama
        (zero for every ordinary sequence and the compensated value for METAL
        CRAFT). Centre the hotspot inside that sequence coordinate system.
      */
      const viewport = getVisibleViewportSize();
      const sequenceSourceStartX = getResponsiveSequenceOffsetX(config);
      const hotspotXInsideSequence = getHotspotLocalImageX(hotspot) - sequenceSourceStartX;
      const desiredCropX = hotspotXInsideSequence - viewport.width / 2;

      /*
        A negative crop would expose space to the left of frame 00. A crop
        larger than frameWidth - viewportWidth would expose space on the right.
        Clamping to this range keeps the first and every later sequence frame
        covering the complete visible screen.
      */
      const maximumCoveringCropX = Math.max(0, frameWidth - viewport.width);
      return Math.max(0, Math.min(desiredCropX, maximumCoveringCropX));
    }

    function easeInOutQuint(t) {
      return t < 0.5
        ? 16 * t * t * t * t * t
        : 1 - Math.pow(-2 * t + 2, 5) / 2;
    }

    function blueHotspotCurve(normalizedDistanceFromCenter) {
      /*
        Blue-curve hotspot scaling.
        normalizedDistanceFromCenter is 0 at the screen center and 1 at the screen edge.
        A Gaussian-style curve avoids the flat-topped / sudden red-curve feeling.
        Lower curveWidth = smaller/narrower center peak.
        Higher curveWidth = larger hotspots across more of the screen.
      */
      const d = Math.max(0, Math.min(normalizedDistanceFromCenter, 1));
      const curveWidth = 0.62;
      const edgeValue = Math.exp(-1 / (curveWidth * curveWidth));
      const value = Math.exp(-(d * d) / (curveWidth * curveWidth));

      return Math.max(0, Math.min((value - edgeValue) / (1 - edgeValue), 1));
    }

    function easeInOutSine(t) {
      const clamped = Math.max(0, Math.min(t, 1));
      return 0.5 - 0.5 * Math.cos(Math.PI * clamped);
    }

      const x = event.clientX;

      let nearestHotspot = null;

      hotspots.forEach((hotspot) => {
        if (!hotspot._visible) return;

        if (distance <= radius && distance < nearestDistance) {
          nearestHotspot = hotspot;
          nearestDistance = distance;
        }

      return nearestHotspot;

    function loadDecodedSequenceImage(src, attempt = 0) {
      const maxAttempts = 3;

      return new Promise((resolve, reject) => {
        const image = new Image();
        image.decoding = "sync";
        image.loading = "eager";

        const finishWithError = () => {
          image.onload = null;
          image.onerror = null;

          if (attempt + 1 < maxAttempts) {
            setTimeout(() => {
              loadDecodedSequenceImage(src, attempt + 1).then(resolve, reject);
            }, 180 * (attempt + 1));
          } else {
            reject(new Error(`Unable to load sequence frame: ${src}`));
          }
        };

        image.onload = async () => {
          image.onload = null;
          image.onerror = null;

          if (!image.naturalWidth || !image.naturalHeight) {
            finishWithError();
            return;
          }

          if (image.decode) {
            try {
              await image.decode();
            } catch (error) {
              /* The load event already confirms usable image data. */
            }
          }

          resolve(image);
        };

        image.onerror = finishWithError;
        image.src = src;

        if (image.complete) {
          if (image.naturalWidth && image.naturalHeight) {
            image.onload();
          } else {
            finishWithError();
          }
        }
      });
    }

    async function preloadSequence(config) {
      if (!config) return false;
      if (config.imagesReady && config.imageElements.length === config.frames.length) {
        return true;
      }
      if (config.imagesPromise) return config.imagesPromise;

      config.imagesLoading = true;
      config.imagesReady = false;

      config.imagesPromise = (async () => {
        removeRetainedSequenceImages(config);
        config.imageElements = [];

        const loadedImages = [];

        /*
          Load in small batches so a slower computer is not hit with forty
          simultaneous full-resolution decodes. Playback does not begin until
          every frame in both the forward and reverse path is ready.
        */
        const batchSize = 6;
        for (let startIndex = 0; startIndex < config.frames.length; startIndex += batchSize) {
          const batchSources = config.frames.slice(startIndex, startIndex + batchSize);
          const batchImages = await Promise.all(
            batchSources.map((src) => loadDecodedSequenceImage(src))
          );
          loadedImages.push(...batchImages);
        }

        loadedImages.forEach((image) => sequenceFramePreloader.appendChild(image));
        config.imageElements = loadedImages;
        config.imagesReady = true;
        config.imagesLoading = false;
        return true;
      })().catch((error) => {
        console.error(error);
        removeRetainedSequenceImages(config);
        config.imageElements = [];
        config.imagesReady = false;
        config.imagesLoading = false;
        config.imagesPromise = null;
        throw error;
      });

      return config.imagesPromise;
    }

      const desiredOffsetInMiddleCopy = totalWidth + frameIndex * frameWidth;

      let closestOffset = desiredOffsetInMiddleCopy;
      let closestDistance = Infinity;

      for (let repeatOffset = -totalWidth; repeatOffset <= totalWidth; repeatOffset += totalWidth) {

        const distance = Math.abs(candidateOffset - currentOffset);

        if (distance < closestDistance) {
          closestDistance = distance;
          closestOffset = candidateOffset;
        }
      }

      return closestOffset;
    }

    function getClosestCameraUnitForFrame(frameIndex, cameraUnit = currentOffset / frameWidth) {

        const distance = Math.abs(candidateUnit - cameraUnit);

        if (distance < closestDistance) {
          closestDistance = distance;
          closestUnit = candidateUnit;
        }
      }

      return closestUnit;
    }

    function moveToFrame(

      isDragging = false;

      container.classList.remove("dragging");

      buttonTweenActive = true;
      buttonTweenStartOffset = currentOffset;
      buttonTweenStartTime = performance.now();
      buttonArrivalCallback = onArrive;

      const hasZoomTarget =
        targetFrameSize &&
        (Math.abs(Number(targetFrameSize.width) - frameWidth) > 0.5 ||
          Math.abs(Number(targetFrameSize.height) - frameHeight) > 0.5 ||
          Math.abs(Number(targetFrameSize.top) - panoStripTop) > 0.5);

      if (hasZoomTarget) {
        /*
          Interpolate both the source-camera position and the rendered 16:9

          one camera move, and the final panorama pixels exactly match the
          sequence canvas before frame 00 appears.
