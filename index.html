    function getClosestOffsetForFrame(frameIndex) {
      const desiredOffsetInMiddleCopy = totalWidth + frameIndex * frameWidth;

      let closestOffset = desiredOffsetInMiddleCopy;
      let closestDistance = Infinity;

      for (let repeatOffset = -totalWidth; repeatOffset <= totalWidth; repeatOffset += totalWidth) {
        const candidateOffset = desiredOffsetInMiddleCopy + repeatOffset;
        const distance = Math.abs(candidateOffset - currentOffset);

        if (distance < closestDistance) {
          closestDistance = distance;
          closestOffset = candidateOffset;
        }
      }

      return closestOffset;
    }

    function moveToFrame(frameIndex, onArrive = null, returnPlaneToNeutral = false) {
      autoRotate = false;
      isDragging = false;
      panVelocity = 0;

      clearAutoRotateRestart();
      clearPendingArrivalCallback();

      container.classList.remove("dragging");

      buttonTweenActive = true;
      buttonTweenStartOffset = currentOffset;
      buttonTweenEndOffset = getClosestOffsetForFrame(frameIndex);
      buttonTweenStartTime = performance.now();
      buttonArrivalCallback = onArrive;

      if (returnPlaneToNeutral) {
        beginParallaxReturn(buttonTweenDuration);
      }

      setActiveFrameButton(frameIndex);
    }

    function updateButtonTween() {
      if (!buttonTweenActive) return;

      const elapsed = performance.now() - buttonTweenStartTime;
      const progress = Math.min(elapsed / buttonTweenDuration, 1);
      const easedProgress = easeInOutQuint(progress);

      currentOffset =
        buttonTweenStartOffset +
        (buttonTweenEndOffset - buttonTweenStartOffset) * easedProgress;

      targetOffset = currentOffset;

      if (progress >= 1) {
        buttonTweenActive = false;
        targetOffset = buttonTweenEndOffset;
        currentOffset = buttonTweenEndOffset;

        if (buttonArrivalCallback) {
          const callback = buttonArrivalCallback;
          buttonArrivalCallback = null;

          buttonArrivalTimeout = setTimeout(() => {
            buttonArrivalTimeout = null;
            callback();
          }, buttonSettleDelay);
        }
      }
    }

    function updatePanorama() {
      if (buttonTweenActive) {
        updateButtonTween();
      } else {
        currentOffset += (targetOffset - currentOffset) * cameraEase;
      }

      panoramaStrip.style.transform = `translate3d(${-currentOffset}px, 0, 0)`;
    }

    function updateHotspots() {
      let strongestHoverPause = 0;

      hotspots.forEach((hotspot) => {
        const hotspotBaseX =
          hotspot.frame * frameWidth +
          (hotspot.x / 100) * frameWidth +
          (hotspot.offsetX || 0);

        let bestScreenX = 0;
        let bestDistance = Infinity;

        for (let repeat = 0; repeat < 3; repeat++) {
          const worldX = hotspotBaseX + repeat * totalWidth;
          const screenX = worldX - currentOffset;
          const distance = Math.abs(screenX - window.innerWidth / 2);

          if (distance < bestDistance) {
            bestDistance = distance;
            bestScreenX = screenX;
          }
        }

        const screenY = panoStripTop + (hotspot.y / 100) * frameHeight + (hotspot.offsetY || 0);

        const visible =
          hotspotsVisible &&
          bestScreenX > -80 &&
          bestScreenX < window.innerWidth + 80 &&
          screenY > -80 &&
          screenY < window.innerHeight + 80;

        const maxDistance = window.innerWidth / 2;
        const normalizedDistance = Math.min(bestDistance / maxDistance, 1);
        const centerStrength = 1 - normalizedDistance;

        /*
          This follows the smoother blue curve from your sketch:
          small at the edges, gradually growing toward the center,
          with only a rounded peak instead of a flat plateau.
        */
        const scaleCurve = blueHotspotCurve(normalizedDistance);
        let scale = 0.36 + scaleCurve * 1.42;

        const distanceToPointer = Math.hypot(bestScreenX - pointerX, screenY - pointerY);
        const pointerOverStrength =
          visible &&
          pointerInsideViewer &&
          !isDragging &&
          !sequencePlaying &&
          !activeSequence
            ? easeInOutSine(1 - Math.min(distanceToPointer / hotspotOverstateRadius, 1))
            : 0;

        strongestHoverPause = Math.max(strongestHoverPause, pointerOverStrength);

        /*
          Hover/overstate no longer changes the hotspot scale.
          Scale is now controlled only by the center-of-screen blue curve,
          which prevents the rapid massive/small flickering near the cursor.
        */
        hotspot.element.classList.toggle("is-over", pointerOverStrength > 0.12);

        /*
          The label is attached to the hotspot's centre pivot.
          The parent hotspot still scales only from the center-of-screen curve.
          Counter-scale keeps the text size visually consistent.
        */
        const labelOpacity = Math.max(Math.pow(scaleCurve, 1.35), pointerOverStrength * 0.92);

        /*
          Let the title grow as the hotspot approaches the center, but only
          partially counter-scale it so the text growth stays controlled.
          Also pull the title closer to the hotspot near the peak so it does
          not drift too far away when the parent hotspot is largest.
        */
        const labelCounterScale = 1 / Math.pow(scale, 0.45);
        const labelDistance = 52 - scaleCurve * 22;

        hotspot._screenX = bestScreenX;
        hotspot._screenY = screenY;
        hotspot._visible = visible;

        if (!visible) {
          hotspot.element.classList.remove("is-over");
        }

        hotspot.element.style.left = `${bestScreenX}px`;
        hotspot.element.style.top = `${screenY}px`;
        hotspot.element.style.opacity = visible ? "1" : "0";
        hotspot.element.style.pointerEvents = visible ? "auto" : "none";
        hotspot.element.style.setProperty("--hotspot-scale", scale.toFixed(3));
        hotspot.element.style.setProperty("--hotspot-label-opacity", labelOpacity.toFixed(3));
        hotspot.element.style.setProperty("--label-counter-scale", labelCounterScale.toFixed(4));
        hotspot.element.style.setProperty("--label-distance", `${labelDistance}px`);
      });

      hoverPauseTarget = strongestHoverPause > 0.1 ? 1 : 0;
    }

    function preloadAllHotspotThumbnails() {
      const uniqueNames = Array.from(
        new Set(
          hotspots
            .map((hotspot) =>
              (hotspot.text || hotspot.label || hotspot.title || "").trim()
            )
            .filter(Boolean)
        )
      );

      return Promise.all(
        uniqueNames.map((name) => {
          const image = new Image();
          image.src = `Thumbnails/${encodeURIComponent(name)}.png`;

          if (image.complete) {
            return image.decode
              ? image.decode().catch(() => {})
              : Promise.resolve();
          }

          return new Promise((resolve) => {
            image.onload = async () => {
              if (image.decode) {
                try {
                  await image.decode();
                } catch (error) {}
              }
              resolve();
            };
            image.onerror = resolve;
          });
        })
      );
    }

    function waitForDelay(milliseconds) {
      return new Promise((resolve) => setTimeout(resolve, milliseconds));
    }

    function getClosestVisibleHotspotToCenter() {
      const centerX = window.innerWidth / 2;
      let closestHotspot = null;
      let closestDistance = Infinity;

      hotspots.forEach((hotspot) => {
        if (!hotspot._visible) return;

        const distance = Math.abs(hotspot._screenX - centerX);
        if (distance < closestDistance) {
          closestDistance = distance;
          closestHotspot = hotspot;
        }
      });

      return closestHotspot;
    }

    async function prepareStartupThumbnail(hotspot) {
      const thumbnailName = getHotspotThumbnailName(hotspot);
      if (!thumbnailName) return false;

      const element = hotspotFocusThumbnailA;

      resetThumbnailElement(hotspotFocusThumbnailA);
      resetThumbnailElement(hotspotFocusThumbnailB);

      activeThumbnailElement = hotspotFocusThumbnailA;
      inactiveThumbnailElement = hotspotFocusThumbnailB;
      currentThumbnailKey = thumbnailName;

      element.alt = thumbnailName;
      element.classList.add("startup-thumbnail");
      element.src = `Thumbnails/${encodeURIComponent(thumbnailName)}.png`;

      await new Promise((resolve) => {
        const finish = async () => {
          if (element.decode) {
            try {
              await element.decode();
            } catch (error) {}
          }
          resolve();
        };

        if (element.complete && element.naturalWidth > 0) {
          finish();
        } else {
          element.onload = finish;
          element.onerror = resolve;
        }
      });

      element.onload = null;
      element.onerror = null;
      return element.naturalWidth > 0;
    }

    async function revealInitialThumbnailFeature() {
      /*
        All PNGs are cached first. The actual first thumbnail element is then
        decoded before the circle is allowed to appear.
      */
      await preloadAllHotspotThumbnails();

      autoRotate = false;
      panVelocity = 0;
      targetOffset = currentOffset;
      setPanToggleVisible(false);

      updatePanorama();
      updateHotspots();

      const focusHotspot = getClosestVisibleHotspotToCenter();
      if (!focusHotspot) {
        hotspotFocusCircle.classList.remove("startup-hidden");
        setPanToggleVisible(true);
        return;
      }

      const thumbnailReady = await prepareStartupThumbnail(focusHotspot);

      /*
        A short paint buffer avoids exposing the circle during the same frame
        in which the browser finishes decoding the PNG.
      */
      await waitForDelay(280);

      connectorActiveHotspot = focusHotspot;
      connectorOutgoingHotspot = null;
      connectorTransitioning = false;
      setActiveHotspotButton(focusHotspot);

      // Stage 1: circle scales and fades in, then remains visible.
      hotspotFocusCircle.classList.remove("startup-hidden");
      await waitForDelay(540);

      // Stage 2: line extends from the circle to the correct hotspot.
      hotspotConnectorEnabled = true;
      connectorTransitionStart = performance.now();
      connectorTransitioning = true;
      await waitForDelay(connectorTransitionDuration + 90);

      // Stage 3: the fully decoded thumbnail scales and fades in.
      if (thumbnailReady) {
        void activeThumbnailElement.offsetWidth;
        activeThumbnailElement.classList.add("startup-thumbnail-show");
        await waitForDelay(520);

        /*
          Transfer to the normal persistent visible state without changing
          opacity or scale, so it cannot blink or disappear afterward.
        */
        activeThumbnailElement.classList.add("is-visible");
        activeThumbnailElement.classList.remove(
          "startup-thumbnail",
          "startup-thumbnail-show"
        );
      }

      setPanToggleVisible(true);

      if (!userPausedAutoRotate && !sequencePlaying && !sequencePreparing) {
        autoRotate = true;
      }
    }

    function getHotspotThumbnailName(hotspot) {
      return (hotspot?.text || hotspot?.label || hotspot?.title || "").trim();
    }

    function resetThumbnailElement(element) {
      element.classList.remove(
        "is-visible",
        "is-entering",
        "is-exiting",
        "is-flipping-in",
        "startup-thumbnail",
        "startup-thumbnail-show"
      );
      element.style.removeProperty("opacity");
      element.style.removeProperty("visibility");
      element.style.removeProperty("transition-duration");
      element.onload = null;
      element.onerror = null;
    }

    function hideAllThumbnails() {
      thumbnailSwapToken += 1;

      [hotspotFocusThumbnailA, hotspotFocusThumbnailB].forEach((element) => {
        resetThumbnailElement(element);
        element.style.opacity = "0";
      });
    }

    function getThumbnailHalfFlipDuration() {
      /*
        Faster manual panning shortens the flip. At normal automatic-pan speed,
        the animation remains slow enough to clearly read.
      */
      const effectiveSpeed = Math.max(
        recentThumbnailPanSpeed,
        Math.abs(panVelocity) * 5,
        autoRotate ? autoRotateSpeed : 0
      );

      return Math.round(
        Math.max(260, Math.min(950, 950 / (1 + effectiveSpeed * 0.06)))
      );
    }

    function updateHotspotThumbnail(hotspot, force = false) {
      if (!hotspot || !hotspotConnectorEnabled) return;

      const thumbnailName = getHotspotThumbnailName(hotspot);
      if (!thumbnailName) return;
      if (!force && thumbnailName === currentThumbnailKey) return;

      currentThumbnailKey = thumbnailName;
      const swapToken = ++thumbnailSwapToken;
      const nextElement = inactiveThumbnailElement;
      const previousElement = activeThumbnailElement;
      const encodedFilename = encodeURIComponent(thumbnailName) + ".png";

      resetThumbnailElement(nextElement);
      nextElement.alt = thumbnailName;
      nextElement.classList.add("is-entering");
      nextElement.src = `Thumbnails/${encodedFilename}`;

      const revealNext = () => {
        if (swapToken !== thumbnailSwapToken || !hotspotConnectorEnabled) return;

        const halfFlipDuration = getThumbnailHalfFlipDuration();

        /*
          OUTGOING HALF:
          The current PNG begins gently, then continues at speed with no
          ease-out until it is exactly edge-on. The right side rotates toward
          the viewer and the left side rotates away.
        */
        resetThumbnailElement(nextElement);
        nextElement.alt = thumbnailName;
        nextElement.src = `Thumbnails/${encodedFilename}`;

        previousElement.style.transitionDuration = `${halfFlipDuration}ms`;
        previousElement.classList.remove(
          "is-visible",
          "is-entering",
          "is-flipping-in"
        );
        previousElement.classList.add("is-exiting");

        setTimeout(() => {
          if (swapToken !== thumbnailSwapToken || !hotspotConnectorEnabled) return;

          /*
            At the exact edge-on point, completely remove the outgoing PNG.
            This guarantees that multiple thumbnails can never remain layered.
          */
          resetThumbnailElement(previousElement);

          /*
            INCOMING HALF:
            The new PNG appears only as an edge-on line, then continues rotating
            in the same direction into full view. It starts immediately with no
            ease-in and gently eases out as it faces the viewer.
          */
          resetThumbnailElement(nextElement);
          nextElement.style.transitionDuration = `${halfFlipDuration}ms`;
          nextElement.classList.add("is-entering");

          // Force the browser to commit the edge-on starting state.
          void nextElement.offsetWidth;

          requestAnimationFrame(() => {
            if (swapToken !== thumbnailSwapToken || !hotspotConnectorEnabled) return;
            nextElement.classList.add("is-flipping-in");
          });

          setTimeout(() => {
            if (swapToken !== thumbnailSwapToken || !hotspotConnectorEnabled) return;

            nextElement.classList.remove("is-entering", "is-flipping-in");
            nextElement.classList.add("is-visible");

            activeThumbnailElement = nextElement;
            inactiveThumbnailElement = previousElement;
          }, halfFlipDuration);
        }, halfFlipDuration);
      };

      nextElement.onload = revealNext;
      nextElement.onerror = () => {
        if (swapToken !== thumbnailSwapToken) return;
        resetThumbnailElement(nextElement);
      };

      if (nextElement.complete && nextElement.naturalWidth > 0) {
        revealNext();
      }
    }

    function easeInOutCubic(t) {
      return t < 0.5
        ? 4 * t * t * t
        : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    function hideConnectorPair(line, dot) {
      line.style.opacity = "0";
      dot.style.opacity = "0";
    }

    function drawConnectorPair(line, dot, hotspot, progress, circleCenterX, circleCenterY) {
      if (!hotspot || !hotspot._visible) {
        hideConnectorPair(line, dot);
        return;
      }

      const hotspotX = hotspot._screenX;
      const hotspotY = hotspot._screenY;
      const endX = circleCenterX + (hotspotX - circleCenterX) * progress;
      const endY = circleCenterY + (hotspotY - circleCenterY) * progress;

      line.setAttribute("x1", circleCenterX.toFixed(2));
      line.setAttribute("y1", circleCenterY.toFixed(2));
      line.setAttribute("x2", endX.toFixed(2));
      line.setAttribute("y2", endY.toFixed(2));

      /*
        Keep the small dot anchored to the hotspot itself while the line grows
        outward from the large circle toward it.
      */
      dot.setAttribute("cx", hotspotX.toFixed(2));
      dot.setAttribute("cy", hotspotY.toFixed(2));

      line.style.opacity = progress > 0.001 ? "1" : "0";
      dot.style.opacity = "1";
    }

    function updateHotspotConnector(now = performance.now()) {
      if (
        !hotspotConnectorEnabled ||
        !hotspotsVisible ||
        sequencePlaying ||
        activeSequence ||
        sequencePreparing
      ) {
        hideConnectorPair(hotspotConnectorLineA, hotspotConnectorDotA);
        hideConnectorPair(hotspotConnectorLineB, hotspotConnectorDotB);
        return;
      }

      const focusHotspot = getClosestVisibleHotspotToCenter();

      if (!focusHotspot) {
        hideConnectorPair(hotspotConnectorLineA, hotspotConnectorDotA);
        hideConnectorPair(hotspotConnectorLineB, hotspotConnectorDotB);
        return;
      }

      if (!connectorActiveHotspot) {
        connectorActiveHotspot = focusHotspot;
        connectorOutgoingHotspot = null;
        connectorTransitionStart = now;
        connectorTransitioning = true;
        setActiveHotspotButton(connectorActiveHotspot);
        updateHotspotThumbnail(connectorActiveHotspot);
      } else if (focusHotspot !== connectorActiveHotspot) {
        connectorOutgoingHotspot = connectorActiveHotspot;
        connectorActiveHotspot = focusHotspot;
        connectorTransitionStart = now;
        connectorTransitioning = true;
        setActiveHotspotButton(connectorActiveHotspot);
        updateHotspotThumbnail(connectorActiveHotspot);
      }

      const circleRect = hotspotFocusCircle.getBoundingClientRect();
      const circleCenterX = circleRect.left + circleRect.width / 2;
      const circleCenterY = circleRect.top + circleRect.height / 2;

      if (connectorTransitioning) {
        const rawProgress = Math.max(
          0,
          Math.min((now - connectorTransitionStart) / connectorTransitionDuration, 1)
        );
        const easedProgress = easeInOutCubic(rawProgress);

        /*
          Two independent lines animate at the same time:
          - The outgoing line retracts from its hotspot back into the large circle.
          - The incoming line extends from the large circle toward its hotspot.
          Their hotspot dots never jump or travel between hotspots.
        */
        if (connectorOutgoingHotspot) {
          drawConnectorPair(
            hotspotConnectorLineA,
            hotspotConnectorDotA,
            connectorOutgoingHotspot,
            1 - easedProgress,
            circleCenterX,
            circleCenterY
          );
        } else {
          hideConnectorPair(hotspotConnectorLineA, hotspotConnectorDotA);
        }

        drawConnectorPair(
          hotspotConnectorLineB,
          hotspotConnectorDotB,
          connectorActiveHotspot,
          easedProgress,
          circleCenterX,
          circleCenterY
        );

        if (rawProgress >= 1) {
          connectorTransitioning = false;
          connectorOutgoingHotspot = null;

          hideConnectorPair(hotspotConnectorLineA, hotspotConnectorDotA);
          drawConnectorPair(
            hotspotConnectorLineB,
            hotspotConnectorDotB,
            connectorActiveHotspot,
            1,
            circleCenterX,
            circleCenterY
          );
        }

        return;
      }

      hideConnectorPair(hotspotConnectorLineA, hotspotConnectorDotA);
      drawConnectorPair(
        hotspotConnectorLineB,
        hotspotConnectorDotB,
        connectorActiveHotspot,
        1,
        circleCenterX,
        circleCenterY
      );
    }

    function getCurrentFrameIndex() {
      const normalizedOffset =
        ((currentOffset % totalWidth) + totalWidth) % totalWidth;

      return Math.round(normalizedOffset / frameWidth) % frameCount;
    }

    function setActiveFrameButton(frameIndex) {
      /*
        Several hotspot titles can belong to the same panorama frame, so do not
        automatically mark every button on that frame as active.
      */
      const activeButton = frameButtons.find((button) => button.classList.contains("active"));

      if (activeButton && Number(activeButton.dataset.frame) !== frameIndex) {
        activeButton.classList.remove("active");
      }
    }

    function updateActiveFrameButton() {
      if (buttonTweenActive || isDragging || autoRotate || sequencePlaying) return;
      setActiveFrameButton(getCurrentFrameIndex());
    }

    function wrapOffsetsIfNeeded() {
      if (currentOffset > totalWidth * 2) {
        currentOffset -= totalWidth;
        targetOffset -= totalWidth;

        if (buttonTweenActive) {
          buttonTweenStartOffset -= totalWidth;
          buttonTweenEndOffset -= totalWidth;
        }
      }

      if (currentOffset < totalWidth * 0.5) {
        currentOffset += totalWidth;
        targetOffset += totalWidth;

        if (buttonTweenActive) {
          buttonTweenStartOffset += totalWidth;
          buttonTweenEndOffset += totalWidth;
        }
      }
    }

    function initializeSequenceLottie() {
      if (sequenceLottieReady && sequenceLottieAnimation) {
        return Promise.resolve(true);
      }

      if (sequenceLottieLoadPromise) {
        return sequenceLottieLoadPromise;
      }

      sequenceLottieLoadPromise = new Promise((resolve) => {
        if (!window.lottie) {
          console.error("Lottie library is unavailable.");
          resolve(false);
          return;
        }

        sequenceLottieAnimation = lottie.loadAnimation({
          container: sequenceLottieContainer,
          renderer: "svg",
          loop: false,
          autoplay: false,
          path: sequenceLottiePath,
          rendererSettings: {
            preserveAspectRatio: "xMidYMid meet",
            progressiveLoad: true
          }
        });

        sequenceLottieAnimation.addEventListener("DOMLoaded", () => {
          sequenceLottieReady = true;
          sequenceLottieLastFrame = -1;
          sequenceLottieAnimation.goToAndStop(0, true);
          resolve(true);
        });

        sequenceLottieAnimation.addEventListener("data_failed", () => {
          console.error("The sequence Lottie could not be loaded.");
          resolve(false);
        });
      });

      return sequenceLottieLoadPromise;
    }

    function setSequenceChromeVisible(visible) {
      sequenceLottieCard.classList.toggle("is-chrome-visible", visible);
    }

    function showSequenceLottie(show, showChrome = true) {
      if (show) {
        sequenceLottiePanel.style.display = "flex";
        sequenceLottiePanel.setAttribute("aria-hidden", "false");
        setSequenceChromeVisible(false);

        if (showChrome) {
          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              setSequenceChromeVisible(true);
            });
          });
        }
      } else {
        setSequenceChromeVisible(false);
        sequenceLottiePanel.style.display = "none";
        sequenceLottiePanel.setAttribute("aria-hidden", "true");
      }
    }

    function showSequenceLoading(show) {
      sequenceLoadingOverlay.classList.toggle("is-visible", show);
      sequenceLoadingOverlay.setAttribute("aria-hidden", show ? "false" : "true");
    }

    function prepareSequenceAssets(config) {
      if (sequenceLoadingTimer) {
        clearTimeout(sequenceLoadingTimer);
      }

      sequenceLoadingTimer = setTimeout(() => {
        if (sequencePreparing) {
          showSequenceLoading(true);
        }
      }, 220);

      return Promise.all([
        preloadSequence(config),
        initializeSequenceLottie()
      ]).finally(() => {
        if (sequenceLoadingTimer) {
          clearTimeout(sequenceLoadingTimer);
          sequenceLoadingTimer = null;
        }
      });
    }

    function syncSequenceLottie(config, index) {
      if (!sequenceLottieReady || !sequenceLottieAnimation || !config) return;

      const imageFrameCount = Math.max(1, config.frames.length - 1);
      const progress = Math.max(0, Math.min(index / imageFrameCount, 1));
      const totalLottieFrames = Math.max(
        1,
        Math.floor(sequenceLottieAnimation.totalFrames || 1)
      );
      const targetFrame = Math.round(progress * (totalLottieFrames - 1));

      if (targetFrame !== sequenceLottieLastFrame) {
        sequenceLottieLastFrame = targetFrame;
        sequenceLottieAnimation.goToAndStop(targetFrame, true);
      }
    }

    function applySequenceFrame(config, index) {
      const img = config.imageElements[index];
      const src = img ? img.src : config.frames[index];

      panoFrameCopies[config.frame].forEach((frameEl) => {
        frameEl.style.backgroundImage = `url("${src}")`;
      });

      syncSequenceLottie(config, index);
    }

    function resetSequenceFrameToDefault(config) {
      const src = frames[config.frame];

      panoFrameCopies[config.frame].forEach((frameEl) => {
        frameEl.style.backgroundImage = `url("${src}")`;
      });
    }

    function stopSequencePlayback() {
      sequencePlaying = false;

      if (sequenceRAF) {
        cancelAnimationFrame(sequenceRAF);
        sequenceRAF = null;
      }
    }

    function finishSequencePlayback() {
      stopSequencePlayback();

      if (!activeSequence) return;

      if (sequenceDirection === 1) {
        /*
          Forward animation finished:
          pause on the last frame, keep hotspots/buttons hidden, show only BACK.
        */
        showBackButton(true);
        setFrameButtonsVisible(false);
        setHotspotsVisible(false);
      } else {
        /*
          Reverse animation finished:
          restore the normal panorama frame, bring controls/hotspots back,
          wait 3 seconds, then continue the default pan.
        */
        const finishedSequence = activeSequence;
        activeSequence = null;

        showBackButton(false);
        setFrameButtonsVisible(true);
        resetSequenceFrameToDefault(finishedSequence);
        setHotspotsVisible(true);
        releaseParallax();
        restoreThumbnailFeatureAfterSequence();
        showSequenceLottie(false);

        if (sequenceLottieReady && sequenceLottieAnimation) {
          sequenceLottieLastFrame = 0;
          sequenceLottieAnimation.goToAndStop(0, true);
        }

        scheduleAutoRotateResume(1500);
      }
    }

    function sequenceStep(now) {
      if (!sequencePlaying || !activeSequence) return;

      if (!sequenceLastTime) {
        sequenceLastTime = now;
      }

      const frameDuration = 1000 / (activeSequence.fps || 24);
      let shouldFinish = false;

      while (now - sequenceLastTime >= frameDuration) {
        sequenceLastTime += frameDuration;

        const nextIndex = sequenceCurrentIndex + sequenceDirection;

        if (nextIndex < 0) {
          sequenceCurrentIndex = 0;
          applySequenceFrame(activeSequence, sequenceCurrentIndex);
          shouldFinish = true;
          break;
        }

        if (nextIndex >= activeSequence.frames.length) {
          sequenceCurrentIndex = activeSequence.frames.length - 1;
          applySequenceFrame(activeSequence, sequenceCurrentIndex);
          shouldFinish = true;
          break;
        }

        sequenceCurrentIndex = nextIndex;
        applySequenceFrame(activeSequence, sequenceCurrentIndex);
      }

      if (shouldFinish) {
        finishSequencePlayback();
        return;
      }

      sequenceRAF = requestAnimationFrame(sequenceStep);
    }

    async function playSequence(config, direction = 1) {
      if (!config || sequencePlaying) return;

      await Promise.all([
        preloadSequence(config),
        initializeSequenceLottie()
      ]);

      activeSequence = config;
      autoRotate = false;
      panVelocity = 0;
      forceParallaxNeutral();
      clearAutoRotateRestart();
      clearPendingArrivalCallback();

      sequenceDirection = direction;
      sequencePlaying = true;
      sequenceLastTime = 0;

      setFrameButtonsVisible(false);
      showBackButton(false);
      setHotspotsVisible(false);

      if (direction === 1) {
        showSequenceLottie(true, true);
      } else {
        showSequenceLottie(true, false);
      }

      if (direction === 1) {
        sequenceCurrentIndex = 0;
      } else {
        sequenceCurrentIndex = config.frames.length - 1;
      }

      applySequenceFrame(config, sequenceCurrentIndex);
      sequenceRAF = requestAnimationFrame(sequenceStep);
    }

    function startConfiguredSequence(config) {
      if (!config || sequencePlaying) return;

      infoBox.style.display = "none";
      showBackButton(false);
      clearAutoRotateRestart();
      clearPendingArrivalCallback();

      moveToFrame(config.frame, () => {
        forceParallaxNeutral();
        playSequence(config, 1);
      }, true);
    }

    function animate() {
      requestAnimationFrame(animate);

      hoverPauseStrength += (hoverPauseTarget - hoverPauseStrength) * 0.08;
      recentThumbnailPanSpeed *= 0.90;

      if (autoRotate && !isDragging && !buttonTweenActive && !sequencePlaying) {
        targetOffset += autoRotateSpeed * autoRotateDirection * (1 - hoverPauseStrength);
      }

      if (!isDragging && !buttonTweenActive && !sequencePlaying) {
        targetOffset += panVelocity;
        panVelocity *= dragFriction;

        if (Math.abs(panVelocity) < 0.001) {
          panVelocity = 0;
        }
      }

      updatePanorama();
      updateHotspots();
      updateHotspotConnector(performance.now());
      updateScenePlaneTransform();
      wrapOffsetsIfNeeded();
      updateActiveFrameButton();
    }

    container.addEventListener("pointerenter", (event) => {
      updatePointerPosition(event);
    });

    container.addEventListener("pointerleave", () => {
      clearPointerPosition();
      clearHotspotOverstates();
    });

    container.addEventListener("pointerdown", (event) => {
      updatePointerPosition(event);

      if (sequencePlaying || activeSequence) return;

      /*
        Important fix:
        Previously, if the pointer started inside the large invisible hotspot
        hit radius, this handler returned before starting a drag. That made
        panning feel frozen near hotspots. Now we still remember the possible
        hotspot click, but we always start the pan gesture. If the user moves
        more than a few pixels, it becomes a drag and the hotspot click is
        cancelled.
      */
      pendingHotspotHit = getNearestHotspotToPointer(event);

      isDragging = true;
      autoRotate = false;
      buttonTweenActive = false;

      clearAutoRotateRestart();
      clearPendingArrivalCallback();

      panVelocity = 0;
      hasDraggedThisGesture = false;
      dragStartX = event.clientX;
      dragStartY = event.clientY;
      previousMouseX = event.clientX;

      container.classList.add("dragging");

      if (container.setPointerCapture) {
        container.setPointerCapture(event.pointerId);
      }

      event.preventDefault();
    });

    container.addEventListener("pointermove", (event) => {
      updatePointerPosition(event);

      if (!isDragging || sequencePlaying || activeSequence) return;

      const deltaX = event.clientX - previousMouseX;
      recentThumbnailPanSpeed = Math.max(recentThumbnailPanSpeed, Math.abs(deltaX));

      const totalGestureDistance = Math.hypot(
        event.clientX - dragStartX,
        event.clientY - dragStartY
      );

      if (totalGestureDistance > 5) {
        hasDraggedThisGesture = true;
        pendingHotspotHit = null;
      }

      targetOffset -= deltaX * dragSensitivity;
      panVelocity = -deltaX * dragSensitivity * 0.18;

      if (Math.abs(deltaX) > 0.01) {
        autoRotateDirection = deltaX < 0 ? 1 : -1;
      }

      previousMouseX = event.clientX;
      event.preventDefault();
    });

    container.addEventListener("pointerup", (event) => {
      const hotspotToActivate = pendingHotspotHit;
      pendingHotspotHit = null;

      isDragging = false;
      container.classList.remove("dragging");

      if (container.hasPointerCapture && container.hasPointerCapture(event.pointerId)) {
        container.releasePointerCapture(event.pointerId);
      }

      if (hotspotToActivate && !hasDraggedThisGesture && !sequencePlaying && !activeSequence) {
        activateHotspot(hotspotToActivate);
        event.preventDefault();
        return;
      }

      if (hasDraggedThisGesture) {
        scheduleAutoRotateResume(1000);
      }

      event.preventDefault();
    });

    container.addEventListener("pointercancel", (event) => {
      pendingHotspotHit = null;
      isDragging = false;
      container.classList.remove("dragging");

      if (container.hasPointerCapture && container.hasPointerCapture(event.pointerId)) {
        container.releasePointerCapture(event.pointerId);
      }

      if (hasDraggedThisGesture) {
        scheduleAutoRotateResume(1000);
      }
    });

    window.addEventListener("resize", () => {
      const normalizedPosition = currentOffset / totalWidth;

      syncPanoFrameWidthCSS();

      currentOffset = normalizedPosition * totalWidth;
      targetOffset = currentOffset;

      buttonTweenActive = false;
      clearPendingArrivalCallback();

      updateHotspots();
      updateHotspotConnector();
      updateActiveFrameButton();
    });


    sequenceLearnMore.addEventListener("click", (event) => {
      event.stopPropagation();
      /*
        Placeholder for the future hotspot-specific Learn More action.
        The current sequence remains paused on its displayed frame.
      */
    });

    ["pointerdown", "pointermove", "pointerup"].forEach((eventName) => {
      sequenceLearnMore.addEventListener(eventName, (event) => {
        event.stopPropagation();
      });
    });

    sequenceBackButton.addEventListener("click", () => {
      if (sequencePlaying || !activeSequence) return;
      setSequenceChromeVisible(false);
      playSequence(activeSequence, -1);
    });

    function activateHotspot(hotspot) {
      if (sequencePlaying || activeSequence || sequencePreparing) return;

      const hotspotKey = normalizeHotspotKey(hotspot.text || hotspot.label || hotspot.title);
      const config = sequenceByHotspotText.get(hotspotKey);

      autoRotate = false;
      panVelocity = 0;

      clearAutoRotateRestart();
      clearPendingArrivalCallback();
      showBackButton(false);
      infoBox.style.display = "none";
      hideThumbnailFeatureForSequence();

      if (!config) {
        moveToFrame(hotspot.frame, () => {
          document.getElementById("infoTitle").textContent =
            hotspot.text || hotspot.title;
          document.getElementById("infoText").textContent =
            "Image sequence coming soon.";
          infoBox.style.display = "block";
        });
        return;
      }

      /*
        Start decoding the JPG sequence and preparing the Lottie immediately,
        while the panorama is still panning to the correct matching frame.
      */
      sequencePreparing = true;
      const preparationToken = ++sequencePreparationToken;
      const assetsPromise = prepareSequenceAssets(config);

      moveToFrame(hotspot.frame, async () => {
        await assetsPromise;

        if (preparationToken !== sequencePreparationToken) return;

        sequencePreparing = false;
        showSequenceLoading(false);
        forceParallaxNeutral();
        playSequence(config, 1);
      });
    }

    hotspots.forEach((hotspot) => {
      hotspot.element.addEventListener("click", (event) => {
        event.stopPropagation();
        activateHotspot(hotspot);
      });
    });

    document.getElementById("closeInfo").addEventListener("click", () => {
      infoBox.style.display = "none";
    });



    function updatePanToggleButton() {
      if (userPausedAutoRotate) {
        panToggleButton.setAttribute("aria-label", "Resume automatic panning");
        panToggleButton.setAttribute("title", "Resume automatic panning");
        panToggleButton.innerHTML =
          '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>';
      } else {
        panToggleButton.setAttribute("aria-label", "Pause automatic panning");
        panToggleButton.setAttribute("title", "Pause automatic panning");
        panToggleButton.innerHTML =
          '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>';
      }
    }

    panToggleButton.addEventListener("click", (event) => {
      event.stopPropagation();
      userPausedAutoRotate = !userPausedAutoRotate;

      if (userPausedAutoRotate) {
        autoRotate = false;
        clearAutoRotateRestart();
        panVelocity = 0;
      } else if (!isDragging && !buttonTweenActive && !sequencePlaying) {
        autoRotate = true;
      }

      updatePanToggleButton();
    });

    ["pointerdown", "pointermove", "pointerup"].forEach((eventName) => {
      panToggleButton.addEventListener(eventName, (event) => {
        event.stopPropagation();
      });
    });


    hotspotThumbnailStage.addEventListener("click", (event) => {
      event.stopPropagation();

      if (
        !hotspotConnectorEnabled ||
        !connectorActiveHotspot ||
        sequencePlaying ||
        activeSequence
      ) {
        return;
      }

      activateHotspot(connectorActiveHotspot);
    });

    ["pointerdown", "pointermove", "pointerup"].forEach((eventName) => {
      hotspotThumbnailStage.addEventListener(eventName, (event) => {
        event.stopPropagation();
      });
    });

    function setPanToggleVisible(visible) {
      panToggleButton.style.display = visible ? "flex" : "none";
    }

    function hideThumbnailFeatureForSequence() {
      thumbnailsWereOpenBeforeSequence = hotspotConnectorEnabled;

      setPanToggleVisible(false);
      setActiveHotspotButton(null);
      hotspotConnectorEnabled = false;
      hotspotFocusCircle.style.display = "none";
      hideConnectorPair(hotspotConnectorLineA, hotspotConnectorDotA);
      hideConnectorPair(hotspotConnectorLineB, hotspotConnectorDotB);
      hideAllThumbnails();
    }

    function restoreThumbnailFeatureAfterSequence() {
      setPanToggleVisible(true);
      hotspotFocusCircle.style.display = "";

      if (thumbnailsWereOpenBeforeSequence) {
        hotspotConnectorEnabled = true;
        hotspotFocusCircle.classList.remove("is-disabled");
        hotspotFocusClose.textContent = "×";
        hotspotFocusClose.setAttribute("aria-label", "Hide thumbnails");

        connectorTransitionStart = performance.now();
        connectorOutgoingHotspot = null;
        connectorTransitioning = true;

        if (connectorActiveHotspot) {
          [hotspotFocusThumbnailA, hotspotFocusThumbnailB].forEach((element) => {
            element.style.removeProperty("opacity");
          });

          currentThumbnailKey = "";
          setActiveHotspotButton(connectorActiveHotspot);
          updateHotspotThumbnail(connectorActiveHotspot, true);
        }
      } else {
        hotspotConnectorEnabled = false;
        hotspotFocusCircle.classList.add("is-disabled");
        hotspotFocusClose.textContent = "SHOW THUMBNAILS";
        hotspotFocusClose.setAttribute("aria-label", "Show thumbnails");
        hideConnectorPair(hotspotConnectorLineA, hotspotConnectorDotA);
        hideConnectorPair(hotspotConnectorLineB, hotspotConnectorDotB);
        hideAllThumbnails();
      }
    }

    hotspotFocusClose.addEventListener("click", (event) => {
      event.stopPropagation();
      hotspotConnectorEnabled = !hotspotConnectorEnabled;

      if (!hotspotConnectorEnabled) {
        hotspotFocusCircle.classList.add("is-disabled");
        hotspotFocusClose.textContent = "SHOW THUMBNAILS";
        hotspotFocusClose.setAttribute("aria-label", "Show thumbnails");
        hideConnectorPair(hotspotConnectorLineA, hotspotConnectorDotA);
        hideConnectorPair(hotspotConnectorLineB, hotspotConnectorDotB);
        hideAllThumbnails();
        setActiveHotspotButton(null);
      } else {
        hotspotFocusCircle.classList.remove("is-disabled");
        hotspotFocusClose.textContent = "×";
        hotspotFocusClose.setAttribute("aria-label", "Hide thumbnails");
        connectorTransitionStart = performance.now();
        connectorOutgoingHotspot = null;
        connectorTransitioning = true;

        if (connectorActiveHotspot) {
          [hotspotFocusThumbnailA, hotspotFocusThumbnailB].forEach((element) => {
            element.style.removeProperty("opacity");
          });

          currentThumbnailKey = "";
          setActiveHotspotButton(connectorActiveHotspot);
          updateHotspotThumbnail(connectorActiveHotspot, true);
        }
      }
    });

    hotspotConnectorEnabled = false;
    hotspotFocusCircle.classList.remove("is-disabled");
    hotspotFocusClose.textContent = "×";
    hotspotFocusClose.setAttribute("aria-label", "Hide thumbnails");

    buildPanoramaStrip();
    updatePanorama();
    updateHotspots();
    animate();

    revealInitialThumbnailFeature();
  </script>
</body>
</html>
