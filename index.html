<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panorama Viewer</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #viewer {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: grab;
      overflow: hidden;
      background: #000;
      touch-action: none;
      user-select: none;
    }

    #viewer.dragging {
      cursor: grabbing;
    }

    #scenePlane {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform: none;
      pointer-events: none;
    }

    #scenePlane .hotspot {
      pointer-events: auto;
    }

    #panoramaStrip {
      position: absolute;
      left: 0;
      top: var(--pano-strip-top, 0px);
      height: var(--pano-frame-height, 100vh);
      display: flex;
      filter: brightness(var(--pano-brightness, 1));
      will-change: transform, filter;
    }

    .panoFrame {
      position: relative;
      height: var(--pano-frame-height, 100vh);
      flex: 0 0 var(--pano-frame-width, calc(100vh * 16 / 9));
      background-position: center center;
      background-size: 100% 100%;
      background-repeat: no-repeat;
    }

    .hotspot {
      position: absolute;
      width: 37.8px;
      height: 37.8px;
      border-radius: 50%;
      background: rgba(128,128,128,0.3);
      border: none;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transform: translate(-50%, -50%) scale(var(--hotspot-scale, 0.42));
      transform-origin: center center;
      cursor: pointer;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0;
      line-height: 1;
      user-select: none;
      transition: opacity 0.22s ease, background 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease;
      will-change: transform, opacity;
      overflow: visible;
    }


    .hotspot::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 37.8px;
      height: 37.8px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,0.18);
      transform: translate(-50%, -50%) scale(0.82);
      opacity: 0.7;
      pointer-events: none;
      z-index: 1;
      animation: hotspotPulse 2.85s ease-out infinite;
    }

    @keyframes hotspotPulse {
      0% {
        transform: translate(-50%, -50%) scale(0.82);
        opacity: 0.7;
      }
      45% {
        transform: translate(-50%, -50%) scale(2.0);
        opacity: 0;
      }
      100% {
        transform: translate(-50%, -50%) scale(2.0);
        opacity: 0;
      }
    }

    .hotspot::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 17px;
      height: 17px;
      border-radius: 50%;
      background: rgba(255,255,255,0.5);
      box-shadow: 0 2px 9px rgba(0,0,0,0.28);
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 2;
    }

    .hotspotLabel {
      position: absolute;
      left: 50%;
      top: 50%;
      transform:
        translate(-50%, calc(-50% - var(--label-distance, 52px)))
        scale(var(--label-counter-scale, 1));
      transform-origin: center center;
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      line-height: 1;
      white-space: nowrap;
      opacity: var(--hotspot-label-opacity, 0);
      pointer-events: none;
      text-shadow: 0 2px 8px rgba(0,0,0,0.65);
      transition: opacity 0.16s ease;
      will-change: transform, opacity;
      z-index: 3;
    }

    .hotspot:hover,
    .hotspot.is-over {
      background: rgba(255,255,255,0.42);
      border-color: rgba(255,255,255,0.94);
      box-shadow: 0 0 18px rgba(255,255,255,0.28), 0 10px 28px rgba(0,0,0,0.24);
    }

    .hotspot:hover::after,
    .hotspot.is-over::after {
      background: #fff;
      box-shadow: 0 0 0 4px rgba(255,255,255,0.28), 0 0 18px rgba(255,255,255,0.38), 0 5px 16px rgba(0,0,0,0.34);
    }

    #frameButtons {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);
      z-index: 15;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 4px 22px;
      width: max-content;
      max-width: min(1180px, calc(100vw - 40px));
      padding: 12px 22px;
      border-radius: 18px;
      background: rgba(0, 0, 0, 0.20);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      opacity: 1;
      pointer-events: auto;
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    #frameButtons.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%) translateY(12px);
    }

    .frameButton {
      min-width: 0;
      height: 34px;
      padding: 0;
      border: none;
      outline: none;
      border-radius: 0;
      background: transparent;
      color: rgba(255,255,255,0.78);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.055em;
      cursor: pointer;
      white-space: nowrap;
      transition: color 0.2s ease, opacity 0.2s ease, transform 0.2s ease;
    }

    .frameButton:hover,
    .frameButton:focus-visible {
      color: #fff;
      transform: translateY(-1px);
    }

    .frameButton.active {
      color: #fff;
      opacity: 1;
    }

    #sequenceBackButton {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);
      z-index: 16;
      display: none;
      padding: 13px 26px;
      border: none;
      border-radius: 999px;
      background: rgba(255,255,255,0.5);
      color: #111;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.04em;
      cursor: pointer;
      box-shadow: 0 12px 30px rgba(0,0,0,0.28);
      transition: transform 0.22s ease, opacity 0.22s ease;
    }

    #sequenceBackButton:hover {
      transform: translateX(-50%) scale(1.06);
    }

    #infoBox {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(420px, 86vw);
      padding: 28px;
      background: rgba(255,255,255,0.95);
      color: #111;
      border-radius: 18px;
      z-index: 20;
      display: none;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
      text-align: center;
    }

    #closeInfo {
      margin-top: 20px;
      padding: 10px 18px;
      border: none;
      border-radius: 999px;
      background: #111;
      color: white;
      cursor: pointer;
    }


    #brightnessControl {
      position: fixed;
      right: 24px;
      bottom: 28px;
      z-index: 18;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 13px;
      border-radius: 999px;
      background: transparent;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.045em;
      user-select: none;
      pointer-events: auto;
    }

    #brightnessSlider {
      width: 145px;
      accent-color: #fff;
      cursor: pointer;
    }


    #panToggleButton {
      position: fixed;
      left: 24px;
      bottom: 28px;
      z-index: 18;
      width: 44px;
      height: 44px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.20);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    #panToggleButton:hover {
      background: rgba(0, 0, 0, 0.32);
      transform: scale(1.05);
    }

    #panToggleButton svg {
      width: 19px;
      height: 19px;
      fill: currentColor;
      pointer-events: none;
    }

    #hotspotConnectorOverlay {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 14;
      pointer-events: none;
      overflow: visible;
    }

    .hotspotConnectorLine {
      stroke: rgba(255,255,255,0.95);
      stroke-width: 1.5;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
      opacity: 0;
    }

    .hotspotConnectorDot {
      fill: #fff;
      opacity: 0;
    }

    #hotspotFocusCircle {
      position: fixed;
      left: 50%;
      bottom: 104px;
      transform: translateX(-50%);
      width: 156px;
      height: 156px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.95);
      background: rgba(0,0,0,0.20);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 15;
      pointer-events: none;
      box-sizing: border-box;
      overflow: visible;
      transition:
        background 0.25s ease,
        border-color 0.25s ease,
        backdrop-filter 0.25s ease;
    }

    #hotspotThumbnailStage {
      position: absolute;
      left: 7px;
      right: 7px;
      bottom: 6px;
      height: 190%;
      pointer-events: auto;
      cursor: pointer;
      overflow: hidden;
      /*
        This creates the blue-mask shape from your sketch:
        straight vertical sides, open above the circle, and a rounded bottom
        that sits just inside the circle.
      */
      border-radius: 0 0 999px 999px;
      perspective: 900px;
      transform-style: preserve-3d;
    }

    .hotspotFocusThumbnail {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center bottom;
      transform: translateX(-50%) rotateY(0deg);
      transform-origin: center center;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      backface-visibility: hidden;
      will-change: transform;
      transition-property: transform;
      transition-duration: 0.95s;
    }

    .hotspotFocusThumbnail.is-visible {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) rotateY(0deg);
    }

    /*
      Front-view flip:
      the left edge turns away while the right edge turns toward the viewer.
    */
    .hotspotFocusThumbnail.is-exiting {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) rotateY(-90deg);
      transition-timing-function: cubic-bezier(0.42, 0, 1, 1);
    }

    /*
      The incoming image completes the same flip motion from the opposite side.
    */
    .hotspotFocusThumbnail.is-entering {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) rotateY(90deg);
      transition: none;
    }

    .hotspotFocusThumbnail.is-entering.is-flipping-in {
      transform: translateX(-50%) rotateY(0deg);
      transition-property: transform;
      transition-timing-function: cubic-bezier(0, 0, 0.58, 1);
    }

    #hotspotFocusClose {
      position: absolute;
      top: -30px;
      right: -30px;
      width: 30px;
      height: 30px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: rgba(255,255,255,0.50);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #000;
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      pointer-events: auto;
      box-shadow: 0 4px 14px rgba(0,0,0,0.28);
      white-space: nowrap;
      transition:
        transform 0.2s ease,
        width 0.25s ease,
        height 0.25s ease,
        border-radius 0.25s ease,
        top 0.25s ease,
        right 0.25s ease,
        left 0.25s ease,
        background 0.25s ease,
        color 0.25s ease,
        font-size 0.25s ease;
    }

    #hotspotFocusClose:hover {
      transform: scale(1.06);
    }

    #hotspotFocusCircle.is-disabled {
      background: transparent;
      border-color: transparent;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }

    #hotspotFocusCircle.is-disabled .hotspotFocusThumbnail {
      opacity: 0 !important;
    }

    #hotspotFocusCircle.is-disabled #hotspotThumbnailStage {
      pointer-events: none;
      cursor: default;
    }

    #hotspotFocusCircle.is-disabled #hotspotFocusClose {
      left: 50%;
      right: auto;
      top: auto;
      bottom: 0;
      width: 154px;
      height: 36px;
      border-radius: 999px;
      transform: translate(-50%, 0);
      background: rgba(0,0,0,0.20);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #fff;
      font-size: 11px;
      letter-spacing: 0.055em;
    }

    #hotspotFocusCircle.is-disabled #hotspotFocusClose:hover {
      transform: translate(-50%, 0) scale(1.04);
    }

    @media (max-width: 600px) {
      #frameButtons {
        bottom: 18px;
        gap: 2px 14px;
        max-width: calc(100vw - 24px);
        padding: 10px 14px;
        border-radius: 14px;
      }

      .frameButton {
        min-width: auto;
        height: 28px;
        padding: 0;
        font-size: 9px;
      }

      #sequenceBackButton {
        bottom: 18px;
        padding: 11px 22px;
        font-size: 13px;
      }

      #panToggleButton {
        left: 14px;
        bottom: 18px;
        width: 40px;
        height: 40px;
      }

      #hotspotFocusCircle {
        bottom: 92px;
        width: 124px;
        height: 124px;
      }

      #brightnessControl {
        right: 14px;
        bottom: 70px;
        padding: 8px 10px;
        font-size: 9px;
      }

      #brightnessSlider {
        width: 105px;
      }

    }
  </style>
</head>

<body>
  <div id="viewer">
    <div id="scenePlane">
      <div id="panoramaStrip"></div>

  <!-- Hotspots -->
  <button class="hotspot" id="hotspot1" aria-label="CUSTOM CUT">
    <span class="hotspotLabel">CUSTOM CUT</span>
  </button>
  <button class="hotspot" id="hotspot2" aria-label="RANDOM PLANK">
    <span class="hotspotLabel">RANDOM PLANK</span>
  </button>
  <button class="hotspot" id="hotspot3" aria-label="METAL CRAFT">
    <span class="hotspotLabel">METAL CRAFT</span>
  </button>
  <button class="hotspot" id="hotspot4" aria-label="BOARD + BATTEN">
    <span class="hotspotLabel">BOARD + BATTEN</span>
  </button>
  <button class="hotspot" id="hotspot5" aria-label="SOFFIT">
    <span class="hotspotLabel">SOFFIT</span>
  </button>
  <button class="hotspot" id="hotspot6" aria-label="BOARD + BATTEN">
    <span class="hotspotLabel">BOARD + BATTEN</span>
  </button>
  <button class="hotspot" id="hotspot7" aria-label="LUX LAP">
    <span class="hotspotLabel">LUX LAP</span>
  </button>
  <button class="hotspot" id="hotspot8" aria-label="CHANNEL SIDING">
    <span class="hotspotLabel">CHANNEL SIDING</span>
  </button>
  <button class="hotspot" id="hotspot9" aria-label="NEO LUMBER">
    <span class="hotspotLabel">NEO LUMBER</span>
  </button>
    </div>
  </div>

  <svg id="hotspotConnectorOverlay" aria-hidden="true">
    <line id="hotspotConnectorLineA" class="hotspotConnectorLine" x1="0" y1="0" x2="0" y2="0"></line>
    <circle id="hotspotConnectorDotA" class="hotspotConnectorDot" cx="0" cy="0" r="3.5"></circle>

    <line id="hotspotConnectorLineB" class="hotspotConnectorLine" x1="0" y1="0" x2="0" y2="0"></line>
    <circle id="hotspotConnectorDotB" class="hotspotConnectorDot" cx="0" cy="0" r="3.5"></circle>
  </svg>

  <div id="hotspotFocusCircle" class="is-disabled">
    <div id="hotspotThumbnailStage" aria-hidden="true">
      <img id="hotspotFocusThumbnailA" class="hotspotFocusThumbnail" alt="" draggable="false" />
      <img id="hotspotFocusThumbnailB" class="hotspotFocusThumbnail" alt="" draggable="false" />
    </div>
    <button id="hotspotFocusClose" type="button" aria-label="Show thumbnails">SHOW THUMBNAILS</button>
  </div>

  <button id="panToggleButton" type="button" aria-label="Pause automatic panning" title="Pause automatic panning">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <rect x="6" y="4" width="4" height="16"></rect>
      <rect x="14" y="4" width="4" height="16"></rect>
    </svg>
  </button>

  <button id="sequenceBackButton">BACK</button>

  <div id="brightnessControl" aria-label="Brightness control">
    <span>BRIGHTNESS</span>
    <input id="brightnessSlider" type="range" min="0.5" max="1.5" step="0.01" value="1.0" aria-label="Adjust brightness" />
  </div>

  <div id="frameButtons" aria-label="Hotspot navigation"></div>

  <div id="infoBox">
    <h2 id="infoTitle">Hotspot</h2>
    <p id="infoText">This is where your hotspot content will go.</p>
    <button id="closeInfo">Close</button>
  </div>

  <script>
    const container = document.getElementById("viewer");
    const scenePlane = document.getElementById("scenePlane");
    const panoramaStrip = document.getElementById("panoramaStrip");
    const frameButtonsWrapper = document.getElementById("frameButtons");
    let frameButtons = [];
    const sequenceBackButton = document.getElementById("sequenceBackButton");
    const infoBox = document.getElementById("infoBox");
    const brightnessControl = document.getElementById("brightnessControl");
    const brightnessSlider = document.getElementById("brightnessSlider");
    const panToggleButton = document.getElementById("panToggleButton");
    const hotspotConnectorLineA = document.getElementById("hotspotConnectorLineA");
    const hotspotConnectorDotA = document.getElementById("hotspotConnectorDotA");
    const hotspotConnectorLineB = document.getElementById("hotspotConnectorLineB");
    const hotspotConnectorDotB = document.getElementById("hotspotConnectorDotB");
    const hotspotFocusCircle = document.getElementById("hotspotFocusCircle");
    const hotspotFocusThumbnailA = document.getElementById("hotspotFocusThumbnailA");
    const hotspotFocusThumbnailB = document.getElementById("hotspotFocusThumbnailB");
    const hotspotFocusClose = document.getElementById("hotspotFocusClose");

    let hotspotConnectorEnabled = false;
    let thumbnailsWereOpenBeforeSequence = false;
    let currentThumbnailKey = "";
    let activeThumbnailElement = hotspotFocusThumbnailA;
    let inactiveThumbnailElement = hotspotFocusThumbnailB;
    let thumbnailSwapToken = 0;
    let recentThumbnailPanSpeed = 0;
    let connectorActiveHotspot = null;
    let connectorOutgoingHotspot = null;
    let connectorTransitionStart = 0;
    let connectorTransitioning = false;
    const connectorTransitionDuration = 850;

    const frameFolder = "180";
    const frameCount = 3;
    const panoFrameAspectRatio = 16 / 9;

    const frames = Array.from({ length: frameCount }, (_, i) => {
      return `${frameFolder}/frame${String(i).padStart(4, "0")}.jpg`;
    });

    /*
      Sequence setup.
      Button numbers are one higher than frame indexes:
      - Button 1 = frame index 0 = RANDOM PLANK sequence
      - Button 2 = frame index 1 = BOARD + BATTEN sequence
      - Button 3 = frame index 2 = NEO LUMBER sequence

      To add more later, add another object here with:
      frame, hotspotText, folder, prefix, count
    */
    /*
      Each unique hotspot has a 30-frame JPG sequence.

      Folder: hotspot title
      Files:  hotspot title + 00 through 29

      Examples:
      CUSTOM CUT/CUSTOM CUT00.jpg
      CUSTOM CUT/CUSTOM CUT29.jpg
    */
    const sequenceConfigs = [
      { key: "customCut",     frame: 0, hotspotText: "CUSTOM CUT",      folder: "CUSTOM CUT",      prefix: "CUSTOM CUT",      count: 30, pad: 2, extension: "jpg", fps: 24 },
      { key: "randomPlank",   frame: 0, hotspotText: "RANDOM PLANK",    folder: "RANDOM PLANK",    prefix: "RANDOM PLANK",    count: 30, pad: 2, extension: "jpg", fps: 24 },
      { key: "metalCraft",    frame: 0, hotspotText: "METAL CRAFT",     folder: "METAL CRAFT",     prefix: "METAL CRAFT",     count: 30, pad: 2, extension: "jpg", fps: 24 },
      { key: "boardBatten",   frame: 1, hotspotText: "BOARD + BATTEN",  folder: "BOARD + BATTEN",  prefix: "BOARD + BATTEN",  count: 30, pad: 2, extension: "jpg", fps: 24 },
      { key: "soffit",        frame: 1, hotspotText: "SOFFIT",          folder: "SOFFIT",          prefix: "SOFFIT",          count: 30, pad: 2, extension: "jpg", fps: 24 },
      { key: "luxLap",        frame: 1, hotspotText: "LUX LAP",         folder: "LUX LAP",         prefix: "LUX LAP",         count: 30, pad: 2, extension: "jpg", fps: 24 },
      { key: "channelSiding", frame: 2, hotspotText: "CHANNEL SIDING",  folder: "CHANNEL SIDING",  prefix: "CHANNEL SIDING",  count: 30, pad: 2, extension: "jpg", fps: 24 },
      { key: "neoLumber",     frame: 2, hotspotText: "NEO LUMBER",      folder: "NEO LUMBER",      prefix: "NEO LUMBER",      count: 30, pad: 2, extension: "jpg", fps: 24 }
    ];

    const sequenceByFrame = new Map();
    const sequenceByHotspotText = new Map();

    function normalizeHotspotKey(value) {
      return String(value || "")
        .trim()
        .toUpperCase()
        .replace(/[^A-Z0-9]/g, "");
    }

    sequenceConfigs.forEach((config) => {
      config.frames = Array.from({ length: config.count }, (_, i) => {
        return `${config.folder}/${config.prefix}${String(i).padStart(config.pad, "0")}.${config.extension}`;
      });

      config.imagesReady = false;
      config.imagesLoading = false;
      config.imageElements = [];

      sequenceByFrame.set(config.frame, config);
      sequenceByHotspotText.set(normalizeHotspotKey(config.hotspotText), config);
    });

    let autoRotate = true;
    let userPausedAutoRotate = false;
    let autoRotateDirection = 1;
    let isDragging = false;
    let hotspotsVisible = true;

    let currentOffset = 0;
    let targetOffset = 0;
    let panVelocity = 0;

    let previousMouseX = 0;
    let dragStartX = 0;
    let dragStartY = 0;
    let hasDraggedThisGesture = false;

    let pointerX = -9999;
    let pointerY = -9999;
    let pointerInsideViewer = false;

    const parallaxMaxAngle = 4.5;
    const parallaxPerspective = 1400;
    const parallaxEase = 0.075;
    let parallaxCurrentAngle = 0;
    let parallaxTargetAngle = 0;
    let parallaxLockedToNeutral = false;
    let parallaxReturnActive = false;
    let parallaxReturnStartAngle = 0;
    let parallaxReturnStartTime = 0;
    let parallaxReturnDuration = 0;

    // Large click radius keeps small hotspots easy to activate.
    // The overstate radius only brightens the hotspot and no longer changes scale.
    const hotspotHitRadius = 290;
    const hotspotOverstateRadius = 70;

    let hoverPauseTarget = 0;
    let hoverPauseStrength = 0;
    let pendingHotspotHit = null;

    const cameraEase = 0.075;
    const dragFriction = 0.94;
    const dragSensitivity = 1.0;

    function getPanoFrameSize() {
      /*
        Never stretch the renders.
        This calculates a true 16:9 frame that is zoomed enough to cover the viewer.
        If the browser becomes wider than 16:9, the frame gets wider and taller,
        then crops vertically instead of distorting the image.
      */
      const widthByHeight = window.innerHeight * panoFrameAspectRatio;
      const width = Math.max(window.innerWidth, widthByHeight);
      const height = width / panoFrameAspectRatio;
      const top = (window.innerHeight - height) / 2;

      return { width, height, top };
    }

    function syncPanoFrameWidthCSS() {
      const size = getPanoFrameSize();

      frameWidth = size.width;
      frameHeight = size.height;
      panoStripTop = size.top;
      totalWidth = frameWidth * frameCount;

      document.documentElement.style.setProperty("--pano-frame-width", `${frameWidth}px`);
      document.documentElement.style.setProperty("--pano-frame-height", `${frameHeight}px`);
      document.documentElement.style.setProperty("--pano-strip-top", `${panoStripTop}px`);
    }

    function easeInOutQuint(t) {
      return t < 0.5
        ? 16 * t * t * t * t * t
        : 1 - Math.pow(-2 * t + 2, 5) / 2;
    }

    function blueHotspotCurve(normalizedDistanceFromCenter) {
      /*
        Blue-curve hotspot scaling.
        normalizedDistanceFromCenter is 0 at the screen center and 1 at the screen edge.
        A Gaussian-style curve avoids the flat-topped / sudden red-curve feeling.
        Lower curveWidth = smaller/narrower center peak.
        Higher curveWidth = larger hotspots across more of the screen.
      */
      const d = Math.max(0, Math.min(normalizedDistanceFromCenter, 1));
      const curveWidth = 0.62;
      const edgeValue = Math.exp(-1 / (curveWidth * curveWidth));
      const value = Math.exp(-(d * d) / (curveWidth * curveWidth));

      return Math.max(0, Math.min((value - edgeValue) / (1 - edgeValue), 1));
    }

    function easeInOutSine(t) {
      const clamped = Math.max(0, Math.min(t, 1));
      return 0.5 - 0.5 * Math.cos(Math.PI * clamped);
    }

              resolve();
            };

            img.onerror = resolve;

    function getClosestOffsetForFrame(frameIndex) {
      const desiredOffsetInMiddleCopy = totalWidth + frameIndex * frameWidth;

      let closestOffset = desiredOffsetInMiddleCopy;
      let closestDistance = Infinity;

      for (let repeatOffset = -totalWidth; repeatOffset <= totalWidth; repeatOffset += totalWidth) {
        const candidateOffset = desiredOffsetInMiddleCopy + repeatOffset;
        const distance = Math.abs(candidateOffset - currentOffset);

        if (distance < closestDistance) {
          closestDistance = distance;
          closestOffset = candidateOffset;
        }
      }

      return closestOffset;
    }

    function moveToFrame(frameIndex, onArrive = null, returnPlaneToNeutral = false) {

      isDragging = false;

      buttonTweenActive = true;
      buttonTweenStartOffset = currentOffset;
      buttonTweenEndOffset = getClosestOffsetForFrame(frameIndex);
      buttonTweenStartTime = performance.now();

    function updateButtonTween() {
      if (!buttonTweenActive) return;

      const elapsed = performance.now() - buttonTweenStartTime;
      const progress = Math.min(elapsed / buttonTweenDuration, 1);
      const easedProgress = easeInOutQuint(progress);

      currentOffset =
        buttonTweenStartOffset +
        (buttonTweenEndOffset - buttonTweenStartOffset) * easedProgress;

      targetOffset = currentOffset;

      if (progress >= 1) {
        buttonTweenActive = false;
        targetOffset = buttonTweenEndOffset;
        currentOffset = buttonTweenEndOffset;

        if (buttonArrivalCallback) {
          const callback = buttonArrivalCallback;
          buttonArrivalCallback = null;

          buttonArrivalTimeout = setTimeout(() => {
            buttonArrivalTimeout = null;
            callback();
          }, buttonSettleDelay);
        }
      }
    }

    function updatePanorama() {

        updateButtonTween();

        currentOffset += (targetOffset - currentOffset) * cameraEase;
      }

      panoramaStrip.style.transform = `translate3d(${-currentOffset}px, 0, 0)`;
    }

    function updateHotspots() {
      let strongestHoverPause = 0;

      hotspots.forEach((hotspot) => {
        const hotspotBaseX =
          hotspot.frame * frameWidth +
          (hotspot.x / 100) * frameWidth +
          (hotspot.offsetX || 0);

        let bestScreenX = 0;
        let bestDistance = Infinity;

        for (let repeat = 0; repeat < 3; repeat++) {
          const worldX = hotspotBaseX + repeat * totalWidth;
          const screenX = worldX - currentOffset;
          const distance = Math.abs(screenX - window.innerWidth / 2);

          if (distance < bestDistance) {
            bestDistance = distance;
            bestScreenX = screenX;
          }
        }

        const screenY = panoStripTop + (hotspot.y / 100) * frameHeight + (hotspot.offsetY || 0);

        const visible =
          hotspotsVisible &&
          bestScreenX > -80 &&
          bestScreenX < window.innerWidth + 80 &&
          screenY > -80 &&
          screenY < window.innerHeight + 80;

        const maxDistance = window.innerWidth / 2;
        const normalizedDistance = Math.min(bestDistance / maxDistance, 1);
        const centerStrength = 1 - normalizedDistance;

        /*
          This follows the smoother blue curve from your sketch:
          small at the edges, gradually growing toward the center,
          with only a rounded peak instead of a flat plateau.
        */
        const scaleCurve = blueHotspotCurve(normalizedDistance);
        let scale = 0.36 + scaleCurve * 1.42;

        const distanceToPointer = Math.hypot(bestScreenX - pointerX, screenY - pointerY);
        const pointerOverStrength =
          visible &&
          pointerInsideViewer &&
          !isDragging &&
          !sequencePlaying &&
          !activeSequence
            ? easeInOutSine(1 - Math.min(distanceToPointer / hotspotOverstateRadius, 1))
            : 0;

        strongestHoverPause = Math.max(strongestHoverPause, pointerOverStrength);

        /*
          Hover/overstate no longer changes the hotspot scale.
          Scale is now controlled only by the center-of-screen blue curve,
          which prevents the rapid massive/small flickering near the cursor.
        */
        hotspot.element.classList.toggle("is-over", pointerOverStrength > 0.12);

        /*
          The label is attached to the hotspot's centre pivot.
          The parent hotspot still scales only from the center-of-screen curve.
          Counter-scale keeps the text size visually consistent.
        */
        const labelOpacity = Math.max(Math.pow(scaleCurve, 1.35), pointerOverStrength * 0.92);

        /*
          Let the title grow as the hotspot approaches the center, but only
          partially counter-scale it so the text growth stays controlled.
          Also pull the title closer to the hotspot near the peak so it does
          not drift too far away when the parent hotspot is largest.
        */
        const labelCounterScale = 1 / Math.pow(scale, 0.45);
        const labelDistance = 52 - scaleCurve * 22;

        hotspot._screenX = bestScreenX;
        hotspot._screenY = screenY;
        hotspot._visible = visible;

        if (!visible) {
          hotspot.element.classList.remove("is-over");
        }

        hotspot.element.style.left = `${bestScreenX}px`;
        hotspot.element.style.top = `${screenY}px`;
        hotspot.element.style.opacity = visible ? "1" : "0";
        hotspot.element.style.pointerEvents = visible ? "auto" : "none";
        hotspot.element.style.setProperty("--hotspot-scale", scale.toFixed(3));
        hotspot.element.style.setProperty("--hotspot-label-opacity", labelOpacity.toFixed(3));
        hotspot.element.style.setProperty("--label-counter-scale", labelCounterScale.toFixed(4));
        hotspot.element.style.setProperty("--label-distance", `${labelDistance}px`);
      });

      hoverPauseTarget = strongestHoverPause > 0.1 ? 1 : 0;
    }

    function getHotspotThumbnailName(hotspot) {
      return (hotspot?.text || hotspot?.label || hotspot?.title || "").trim();
    }

    function resetThumbnailElement(element) {
      element.classList.remove(
        "is-visible",
        "is-entering",
        "is-exiting",
        "is-flipping-in"
      );
      element.style.removeProperty("opacity");
      element.style.removeProperty("visibility");
      element.style.removeProperty("transition-duration");
      element.onload = null;
      element.onerror = null;
    }

    function hideAllThumbnails() {
      thumbnailSwapToken += 1;

      [hotspotFocusThumbnailA, hotspotFocusThumbnailB].forEach((element) => {
        resetThumbnailElement(element);
        element.style.opacity = "0";
      });
    }

    function getThumbnailHalfFlipDuration() {
      /*
        Faster manual panning shortens the flip. At normal automatic-pan speed,
        the animation remains slow enough to clearly read.
      */
      const effectiveSpeed = Math.max(
        recentThumbnailPanSpeed,
        Math.abs(panVelocity) * 5,
        autoRotate ? autoRotateSpeed : 0
      );

      return Math.round(
        Math.max(260, Math.min(950, 950 / (1 + effectiveSpeed * 0.06)))
      );
    }

    function updateHotspotThumbnail(hotspot, force = false) {
      if (!hotspot || !hotspotConnectorEnabled) return;

      const thumbnailName = getHotspotThumbnailName(hotspot);
      if (!thumbnailName) return;
      if (!force && thumbnailName === currentThumbnailKey) return;

      currentThumbnailKey = thumbnailName;
      const swapToken = ++thumbnailSwapToken;
      const nextElement = inactiveThumbnailElement;
      const previousElement = activeThumbnailElement;
      const encodedFilename = encodeURIComponent(thumbnailName) + ".png";

      resetThumbnailElement(nextElement);
      nextElement.alt = thumbnailName;
      nextElement.classList.add("is-entering");
      nextElement.src = `Thumbnails/${encodedFilename}`;

      const revealNext = () => {
        if (swapToken !== thumbnailSwapToken || !hotspotConnectorEnabled) return;

        const halfFlipDuration = getThumbnailHalfFlipDuration();

        /*
          OUTGOING HALF:
          The current PNG begins gently, then continues at speed with no
          ease-out until it is exactly edge-on. The right side rotates toward
          the viewer and the left side rotates away.
        */
        resetThumbnailElement(nextElement);
        nextElement.alt = thumbnailName;
        nextElement.src = `Thumbnails/${encodedFilename}`;

        previousElement.style.transitionDuration = `${halfFlipDuration}ms`;
        previousElement.classList.remove(
          "is-visible",
          "is-entering",
          "is-flipping-in"
        );
        previousElement.classList.add("is-exiting");

        setTimeout(() => {
          if (swapToken !== thumbnailSwapToken || !hotspotConnectorEnabled) return;

          /*
            At the exact edge-on point, completely remove the outgoing PNG.
            This guarantees that multiple thumbnails can never remain layered.
          */
          resetThumbnailElement(previousElement);

          /*
            INCOMING HALF:
            The new PNG appears only as an edge-on line, then continues rotating
            in the same direction into full view. It starts immediately with no
            ease-in and gently eases out as it faces the viewer.
          */
          resetThumbnailElement(nextElement);
          nextElement.style.transitionDuration = `${halfFlipDuration}ms`;
          nextElement.classList.add("is-entering");

          // Force the browser to commit the edge-on starting state.
          void nextElement.offsetWidth;

          requestAnimationFrame(() => {
            if (swapToken !== thumbnailSwapToken || !hotspotConnectorEnabled) return;
            nextElement.classList.add("is-flipping-in");
          });

          setTimeout(() => {
            if (swapToken !== thumbnailSwapToken || !hotspotConnectorEnabled) return;

            nextElement.classList.remove("is-entering", "is-flipping-in");
            nextElement.classList.add("is-visible");

            activeThumbnailElement = nextElement;
            inactiveThumbnailElement = previousElement;
          }, halfFlipDuration);
        }, halfFlipDuration);
      };

      nextElement.onload = revealNext;
      nextElement.onerror = () => {
        if (swapToken !== thumbnailSwapToken) return;
        resetThumbnailElement(nextElement);
      };

      if (nextElement.complete && nextElement.naturalWidth > 0) {
        revealNext();
      }
    }

    function easeInOutCubic(t) {
      return t < 0.5
        ? 4 * t * t * t
        : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    function hideConnectorPair(line, dot) {
      line.style.opacity = "0";
      dot.style.opacity = "0";
    }

    function drawConnectorPair(line, dot, hotspot, progress, circleCenterX, circleCenterY) {
      if (!hotspot || !hotspot._visible) {
        hideConnectorPair(line, dot);
        return;
      }

      const hotspotX = hotspot._screenX;
      const hotspotY = hotspot._screenY;
      const endX = circleCenterX + (hotspotX - circleCenterX) * progress;
      const endY = circleCenterY + (hotspotY - circleCenterY) * progress;

      line.setAttribute("x1", circleCenterX.toFixed(2));
      line.setAttribute("y1", circleCenterY.toFixed(2));
      line.setAttribute("x2", endX.toFixed(2));
      line.setAttribute("y2", endY.toFixed(2));

      /*
        Keep the small dot anchored to the hotspot itself while the line grows
        outward from the large circle toward it.
      */
      dot.setAttribute("cx", hotspotX.toFixed(2));
      dot.setAttribute("cy", hotspotY.toFixed(2));

      line.style.opacity = progress > 0.001 ? "1" : "0";
      dot.style.opacity = "1";
    }

    function updateHotspotConnector(now = performance.now()) {
      if (
        !hotspotConnectorEnabled ||
        !hotspotsVisible ||
        sequencePlaying ||
        activeSequence
      ) {
        hideConnectorPair(hotspotConnectorLineA, hotspotConnectorDotA);
        hideConnectorPair(hotspotConnectorLineB, hotspotConnectorDotB);
        return;
      }

      let focusHotspot = null;
      let closestToCenter = Infinity;
      const centerX = window.innerWidth / 2;

      hotspots.forEach((hotspot) => {
        if (!hotspot._visible) return;

        const distance = Math.abs(hotspot._screenX - centerX);
        if (distance < closestToCenter) {
          closestToCenter = distance;
          focusHotspot = hotspot;
        }
      });

      if (!focusHotspot) {
        hideConnectorPair(hotspotConnectorLineA, hotspotConnectorDotA);
        hideConnectorPair(hotspotConnectorLineB, hotspotConnectorDotB);
        return;
      }

      if (!connectorActiveHotspot) {
        connectorActiveHotspot = focusHotspot;
        connectorOutgoingHotspot = null;
        connectorTransitionStart = now;
        connectorTransitioning = true;
        updateHotspotThumbnail(connectorActiveHotspot);
      } else if (focusHotspot !== connectorActiveHotspot) {
        connectorOutgoingHotspot = connectorActiveHotspot;
        connectorActiveHotspot = focusHotspot;
        connectorTransitionStart = now;
        connectorTransitioning = true;
        updateHotspotThumbnail(connectorActiveHotspot);
      }

      const circleRect = hotspotFocusCircle.getBoundingClientRect();
      const circleCenterX = circleRect.left + circleRect.width / 2;
      const circleCenterY = circleRect.top + circleRect.height / 2;

      if (connectorTransitioning) {
        const rawProgress = Math.max(
          0,
          Math.min((now - connectorTransitionStart) / connectorTransitionDuration, 1)
        );
        const easedProgress = easeInOutCubic(rawProgress);

        /*
          Two independent lines animate at the same time:
          - The outgoing line retracts from its hotspot back into the large circle.
          - The incoming line extends from the large circle toward its hotspot.
          Their hotspot dots never jump or travel between hotspots.
        */
        if (connectorOutgoingHotspot) {
          drawConnectorPair(
            hotspotConnectorLineA,
            hotspotConnectorDotA,
            connectorOutgoingHotspot,
            1 - easedProgress,
            circleCenterX,
            circleCenterY
          );
        } else {
          hideConnectorPair(hotspotConnectorLineA, hotspotConnectorDotA);
        }

        drawConnectorPair(
          hotspotConnectorLineB,
          hotspotConnectorDotB,
          connectorActiveHotspot,
          easedProgress,
          circleCenterX,
          circleCenterY
        );

        if (rawProgress >= 1) {
          connectorTransitioning = false;
          connectorOutgoingHotspot = null;

          hideConnectorPair(hotspotConnectorLineA, hotspotConnectorDotA);
          drawConnectorPair(
            hotspotConnectorLineB,
            hotspotConnectorDotB,
            connectorActiveHotspot,
            1,
            circleCenterX,
            circleCenterY
          );
        }

        return;
      }

      hideConnectorPair(hotspotConnectorLineA, hotspotConnectorDotA);
      drawConnectorPair(
        hotspotConnectorLineB,
        hotspotConnectorDotB,
        connectorActiveHotspot,
        1,
        circleCenterX,
        circleCenterY
      );
    }

    function getCurrentFrameIndex() {
      const normalizedOffset =
        ((currentOffset % totalWidth) + totalWidth) % totalWidth;

      return Math.round(normalizedOffset / frameWidth) % frameCount;
    }

    function setActiveFrameButton(frameIndex) {
      /*
        Several hotspot titles can belong to the same panorama frame, so do not
        automatically mark every button on that frame as active.
      */
      const activeButton = frameButtons.find((button) => button.classList.contains("active"));

      if (activeButton && Number(activeButton.dataset.frame) !== frameIndex) {
        activeButton.classList.remove("active");
      }
    }

    function updateActiveFrameButton() {
      if (buttonTweenActive || isDragging || autoRotate || sequencePlaying) return;
      setActiveFrameButton(getCurrentFrameIndex());
    }

    function wrapOffsetsIfNeeded() {
      if (currentOffset > totalWidth * 2) {
        currentOffset -= totalWidth;
        targetOffset -= totalWidth;

        if (buttonTweenActive) {
          buttonTweenStartOffset -= totalWidth;
          buttonTweenEndOffset -= totalWidth;
        }
      }

      if (currentOffset < totalWidth * 0.5) {
        currentOffset += totalWidth;
        targetOffset += totalWidth;

        if (buttonTweenActive) {
          buttonTweenStartOffset += totalWidth;
          buttonTweenEndOffset += totalWidth;
        }
      }
    }

    function applySequenceFrame(config, index) {
      const img = config.imageElements[index];
      const src = img ? img.src : config.frames[index];

      panoFrameCopies[config.frame].forEach((frameEl) => {
        frameEl.style.backgroundImage = `url("${src}")`;
      });
    }

    function resetSequenceFrameToDefault(config) {
      const src = frames[config.frame];

      panoFrameCopies[config.frame].forEach((frameEl) => {
        frameEl.style.backgroundImage = `url("${src}")`;
      });
    }

    function stopSequencePlayback() {
      sequencePlaying = false;

      if (sequenceRAF) {
        cancelAnimationFrame(sequenceRAF);
        sequenceRAF = null;
      }
    }

    function finishSequencePlayback() {
      stopSequencePlayback();

      if (!activeSequence) return;

      if (sequenceDirection === 1) {
        /*
          Forward animation finished:
          pause on the last frame, keep hotspots/buttons hidden, show only BACK.
        */
        showBackButton(true);
        setFrameButtonsVisible(false);
        setHotspotsVisible(false);
      } else {
        /*
          Reverse animation finished:
          restore the normal panorama frame, bring controls/hotspots back,
          wait 3 seconds, then continue the default pan.
        */
        const finishedSequence = activeSequence;
        activeSequence = null;

        showBackButton(false);
        setFrameButtonsVisible(true);
        resetSequenceFrameToDefault(finishedSequence);
        setHotspotsVisible(true);
        releaseParallax();
        restoreThumbnailFeatureAfterSequence();

        scheduleAutoRotateResume(1500);
      }
    }

    function sequenceStep(now) {
      if (!sequencePlaying || !activeSequence) return;

      if (!sequenceLastTime) {
        sequenceLastTime = now;
      }

      const frameDuration = 1000 / (activeSequence.fps || 24);
      let shouldFinish = false;

      while (now - sequenceLastTime >= frameDuration) {
        sequenceLastTime += frameDuration;

        const nextIndex = sequenceCurrentIndex + sequenceDirection;

        if (nextIndex < 0) {
          sequenceCurrentIndex = 0;
          applySequenceFrame(activeSequence, sequenceCurrentIndex);
          shouldFinish = true;
          break;
        }

        if (nextIndex >= activeSequence.frames.length) {
          sequenceCurrentIndex = activeSequence.frames.length - 1;
          applySequenceFrame(activeSequence, sequenceCurrentIndex);
          shouldFinish = true;
          break;
        }

        sequenceCurrentIndex = nextIndex;
        applySequenceFrame(activeSequence, sequenceCurrentIndex);
      }

      if (shouldFinish) {
        finishSequencePlayback();
        return;
      }

      sequenceRAF = requestAnimationFrame(sequenceStep);
    }

    async function playSequence(config, direction = 1) {
      if (!config || sequencePlaying) return;

      if (!config.imagesReady) {
        await preloadSequence(config);
      }

      activeSequence = config;
      autoRotate = false;
      panVelocity = 0;
      forceParallaxNeutral();
      clearAutoRotateRestart();
      clearPendingArrivalCallback();

      sequenceDirection = direction;
      sequencePlaying = true;
      sequenceLastTime = 0;

      setFrameButtonsVisible(false);
      showBackButton(false);
      setHotspotsVisible(false);

      if (direction === 1) {
        sequenceCurrentIndex = 0;
      } else {
        sequenceCurrentIndex = config.frames.length - 1;
      }

      applySequenceFrame(config, sequenceCurrentIndex);
      sequenceRAF = requestAnimationFrame(sequenceStep);
    }

    function startConfiguredSequence(config) {
      if (!config || sequencePlaying) return;

      infoBox.style.display = "none";
      showBackButton(false);
      clearAutoRotateRestart();
      clearPendingArrivalCallback();

      moveToFrame(config.frame, () => {
        forceParallaxNeutral();
        playSequence(config, 1);
      }, true);
    }

    function animate() {
      requestAnimationFrame(animate);

      hoverPauseStrength += (hoverPauseTarget - hoverPauseStrength) * 0.08;
      recentThumbnailPanSpeed *= 0.90;

      if (autoRotate && !isDragging && !buttonTweenActive && !sequencePlaying) {
        targetOffset += autoRotateSpeed * autoRotateDirection * (1 - hoverPauseStrength);
      }

      if (!isDragging && !buttonTweenActive && !sequencePlaying) {
        targetOffset += panVelocity;
        panVelocity *= dragFriction;

        if (Math.abs(panVelocity) < 0.001) {
          panVelocity = 0;
        }
      }

      updatePanorama();
      updateHotspots();
      updateHotspotConnector(performance.now());
      updateScenePlaneTransform();
      wrapOffsetsIfNeeded();
      updateActiveFrameButton();
    }

    container.addEventListener("pointerenter", (event) => {
      updatePointerPosition(event);
    });

    container.addEventListener("pointerleave", () => {
      clearPointerPosition();
      clearHotspotOverstates();
    });

    container.addEventListener("pointerdown", (event) => {
      updatePointerPosition(event);

      if (sequencePlaying || activeSequence) return;

      /*
        Important fix:
        Previously, if the pointer started inside the large invisible hotspot
        hit radius, this handler returned before starting a drag. That made
        panning feel frozen near hotspots. Now we still remember the possible
        hotspot click, but we always start the pan gesture. If the user moves
        more than a few pixels, it becomes a drag and the hotspot click is
        cancelled.
      */
      pendingHotspotHit = getNearestHotspotToPointer(event);

      isDragging = true;
      autoRotate = false;
      buttonTweenActive = false;

      clearAutoRotateRestart();
      clearPendingArrivalCallback();

      panVelocity = 0;
      hasDraggedThisGesture = false;
      dragStartX = event.clientX;
      dragStartY = event.clientY;
      previousMouseX = event.clientX;

      container.classList.add("dragging");

      if (container.setPointerCapture) {
        container.setPointerCapture(event.pointerId);
      }

      event.preventDefault();
    });

    container.addEventListener("pointermove", (event) => {
      updatePointerPosition(event);

      if (!isDragging || sequencePlaying || activeSequence) return;

      const deltaX = event.clientX - previousMouseX;
      recentThumbnailPanSpeed = Math.max(recentThumbnailPanSpeed, Math.abs(deltaX));

      const totalGestureDistance = Math.hypot(
        event.clientX - dragStartX,
        event.clientY - dragStartY
      );

      if (totalGestureDistance > 5) {
        hasDraggedThisGesture = true;
        pendingHotspotHit = null;
      }

      targetOffset -= deltaX * dragSensitivity;
      panVelocity = -deltaX * dragSensitivity * 0.18;

      if (Math.abs(deltaX) > 0.01) {
        autoRotateDirection = deltaX < 0 ? 1 : -1;
      }

      previousMouseX = event.clientX;
      event.preventDefault();
    });

    container.addEventListener("pointerup", (event) => {
      const hotspotToActivate = pendingHotspotHit;
      pendingHotspotHit = null;

      isDragging = false;
      container.classList.remove("dragging");

      if (container.hasPointerCapture && container.hasPointerCapture(event.pointerId)) {
        container.releasePointerCapture(event.pointerId);
      }

      if (hotspotToActivate && !hasDraggedThisGesture && !sequencePlaying && !activeSequence) {
        activateHotspot(hotspotToActivate);
        event.preventDefault();
        return;
      }

      if (hasDraggedThisGesture) {
        scheduleAutoRotateResume(1000);
      }

      event.preventDefault();
    });

    container.addEventListener("pointercancel", (event) => {
      pendingHotspotHit = null;
      isDragging = false;
      container.classList.remove("dragging");

      if (container.hasPointerCapture && container.hasPointerCapture(event.pointerId)) {
        container.releasePointerCapture(event.pointerId);
      }

      if (hasDraggedThisGesture) {
        scheduleAutoRotateResume(1000);
      }
    });

    window.addEventListener("resize", () => {
      const normalizedPosition = currentOffset / totalWidth;

      syncPanoFrameWidthCSS();

      currentOffset = normalizedPosition * totalWidth;
      targetOffset = currentOffset;

      buttonTweenActive = false;
      clearPendingArrivalCallback();

      updateHotspots();
      updateHotspotConnector();
      updateActiveFrameButton();
    });


    sequenceBackButton.addEventListener("click", () => {
      if (sequencePlaying || !activeSequence) return;
      playSequence(activeSequence, -1);
    });

    function activateHotspot(hotspot) {
      if (sequencePlaying || activeSequence) return;

      const hotspotKey = normalizeHotspotKey(hotspot.text || hotspot.label || hotspot.title);
      const config = sequenceByHotspotText.get(hotspotKey);

      autoRotate = false;
      panVelocity = 0;

      clearAutoRotateRestart();
      clearPendingArrivalCallback();
      showBackButton(false);
      infoBox.style.display = "none";
      hideThumbnailFeatureForSequence();

      /*
        Every hotspot and every bottom button first uses the same smooth camera
        tween to return to its panorama frame. This guarantees that the first
        frame of the future image sequence will line up with the panorama.
      */
      moveToFrame(hotspot.frame, () => {
        if (config) {
          playSequence(config, 1);
          return;
        }

        document.getElementById("infoTitle").textContent =
          hotspot.text || hotspot.title;
        document.getElementById("infoText").textContent =
          "Image sequence coming soon.";
        infoBox.style.display = "block";
      });
    }

    hotspots.forEach((hotspot) => {
      hotspot.element.addEventListener("click", (event) => {
        event.stopPropagation();
        activateHotspot(hotspot);
      });
    });

    document.getElementById("closeInfo").addEventListener("click", () => {
      infoBox.style.display = "none";
    });



    function updatePanToggleButton() {
      if (userPausedAutoRotate) {
        panToggleButton.setAttribute("aria-label", "Resume automatic panning");
        panToggleButton.setAttribute("title", "Resume automatic panning");
        panToggleButton.innerHTML =
          '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>';
      } else {
        panToggleButton.setAttribute("aria-label", "Pause automatic panning");
        panToggleButton.setAttribute("title", "Pause automatic panning");
        panToggleButton.innerHTML =
          '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>';
      }
    }

    panToggleButton.addEventListener("click", (event) => {
      event.stopPropagation();
      userPausedAutoRotate = !userPausedAutoRotate;

      if (userPausedAutoRotate) {
        autoRotate = false;
        clearAutoRotateRestart();
        panVelocity = 0;
      } else if (!isDragging && !buttonTweenActive && !sequencePlaying) {
        autoRotate = true;
      }

      updatePanToggleButton();
    });

    ["pointerdown", "pointermove", "pointerup"].forEach((eventName) => {
      panToggleButton.addEventListener(eventName, (event) => {
        event.stopPropagation();
      });
    });


    hotspotThumbnailStage.addEventListener("click", (event) => {
      event.stopPropagation();

      if (
        !hotspotConnectorEnabled ||
        !connectorActiveHotspot ||
        sequencePlaying ||
        activeSequence
      ) {
        return;
      }

      activateHotspot(connectorActiveHotspot);
    });

    ["pointerdown", "pointermove", "pointerup"].forEach((eventName) => {
      hotspotThumbnailStage.addEventListener(eventName, (event) => {
        event.stopPropagation();
      });
    });

    function hideThumbnailFeatureForSequence() {
      thumbnailsWereOpenBeforeSequence = hotspotConnectorEnabled;

      hotspotConnectorEnabled = false;
      hotspotFocusCircle.style.display = "none";
      hideConnectorPair(hotspotConnectorLineA, hotspotConnectorDotA);
      hideConnectorPair(hotspotConnectorLineB, hotspotConnectorDotB);
      hideAllThumbnails();
    }

    function restoreThumbnailFeatureAfterSequence() {
      hotspotFocusCircle.style.display = "";

      if (thumbnailsWereOpenBeforeSequence) {
        hotspotConnectorEnabled = true;
        hotspotFocusCircle.classList.remove("is-disabled");
        hotspotFocusClose.textContent = "×";
        hotspotFocusClose.setAttribute("aria-label", "Hide thumbnails");

        connectorTransitionStart = performance.now();
        connectorOutgoingHotspot = null;
        connectorTransitioning = true;

        if (connectorActiveHotspot) {
          [hotspotFocusThumbnailA, hotspotFocusThumbnailB].forEach((element) => {
            element.style.removeProperty("opacity");
          });

          currentThumbnailKey = "";
          updateHotspotThumbnail(connectorActiveHotspot, true);
        }
      } else {
        hotspotConnectorEnabled = false;
        hotspotFocusCircle.classList.add("is-disabled");
        hotspotFocusClose.textContent = "SHOW THUMBNAILS";
        hotspotFocusClose.setAttribute("aria-label", "Show thumbnails");
        hideConnectorPair(hotspotConnectorLineA, hotspotConnectorDotA);
        hideConnectorPair(hotspotConnectorLineB, hotspotConnectorDotB);
        hideAllThumbnails();
      }
    }

    hotspotFocusClose.addEventListener("click", (event) => {
      event.stopPropagation();
      hotspotConnectorEnabled = !hotspotConnectorEnabled;

      if (!hotspotConnectorEnabled) {
        hotspotFocusCircle.classList.add("is-disabled");
        hotspotFocusClose.textContent = "SHOW THUMBNAILS";
        hotspotFocusClose.setAttribute("aria-label", "Show thumbnails");
        hideConnectorPair(hotspotConnectorLineA, hotspotConnectorDotA);
        hideConnectorPair(hotspotConnectorLineB, hotspotConnectorDotB);
        hideAllThumbnails();
      } else {
        hotspotFocusCircle.classList.remove("is-disabled");
        hotspotFocusClose.textContent = "×";
        hotspotFocusClose.setAttribute("aria-label", "Hide thumbnails");
        connectorTransitionStart = performance.now();
        connectorOutgoingHotspot = null;
        connectorTransitioning = true;

        if (connectorActiveHotspot) {
          [hotspotFocusThumbnailA, hotspotFocusThumbnailB].forEach((element) => {
            element.style.removeProperty("opacity");
          });

          currentThumbnailKey = "";
          updateHotspotThumbnail(connectorActiveHotspot, true);
        }
      }
    });

    brightnessSlider.addEventListener("input", () => {
      panoramaStrip.style.setProperty("--pano-brightness", brightnessSlider.value);
    });

    // Default brightness is normal / unadjusted.
    panoramaStrip.style.setProperty("--pano-brightness", brightnessSlider.value);

    ["pointerdown", "pointermove", "pointerup", "click"].forEach((eventName) => {
      brightnessControl.addEventListener(eventName, (event) => {
        event.stopPropagation();
      });
    });

    hotspotFocusCircle.classList.add("is-disabled");
    hotspotFocusClose.textContent = "SHOW THUMBNAILS";
    hotspotFocusClose.setAttribute("aria-label", "Show thumbnails");
    hideAllThumbnails();
    hideConnectorPair(hotspotConnectorLineA, hotspotConnectorDotA);
    hideConnectorPair(hotspotConnectorLineB, hotspotConnectorDotB);

    buildPanoramaStrip();

    /*
      Starts loading/decoding all configured sequences immediately.
      This helps avoid flashing when a sequence starts.
    */
    preloadAllSequences();

    animate();
  </script>
</body>
</html>
