        buttonTweenZoomActive = true;
        buttonTweenStartFrameWidth = frameWidth;
        buttonTweenStartFrameHeight = frameHeight;
        buttonTweenStartFrameTop = panoStripTop;
        buttonTweenEndFrameWidth = Number(targetFrameSize.width);
        buttonTweenEndFrameHeight = Number(targetFrameSize.height);
        buttonTweenEndFrameTop = Number(targetFrameSize.top);
        buttonTweenStartCameraUnit = currentOffset / frameWidth;

        const closestFrameUnit = getClosestCameraUnitForFrame(
          frameIndex,
          buttonTweenStartCameraUnit
        );
        buttonTweenEndCameraUnit =
          closestFrameUnit +
          Number(destinationOffsetX || 0) / buttonTweenEndFrameWidth;
        buttonTweenEndOffset =
          buttonTweenEndCameraUnit * buttonTweenEndFrameWidth;

        sequenceCameraZoomed = true;
      } else {
        buttonTweenZoomActive = false;
        /*
          Most sequences line up exactly with the start of their panorama frame.
          METAL CRAFT uses a custom first sequence frame, so its panorama landing
          position can be shifted independently before the sequence begins.
          A positive value moves the panorama camera farther to the right.
        */
        buttonTweenEndOffset =
          getClosestOffsetForFrame(frameIndex) + Number(destinationOffsetX || 0);
      }

      if (returnPlaneToNeutral) {
        beginParallaxReturn(buttonTweenDuration);
      }

      setActiveFrameButton(frameIndex);
    }

    function updateButtonTween() {
      if (!buttonTweenActive) return;

      const elapsed = performance.now() - buttonTweenStartTime;
      const progress = Math.min(elapsed / buttonTweenDuration, 1);
      const easedProgress = easeInOutQuint(progress);

      if (buttonTweenZoomActive) {
        const nextFrameWidth =
          buttonTweenStartFrameWidth +
          (buttonTweenEndFrameWidth - buttonTweenStartFrameWidth) * easedProgress;
        const nextFrameHeight =
          buttonTweenStartFrameHeight +
          (buttonTweenEndFrameHeight - buttonTweenStartFrameHeight) * easedProgress;
        const nextFrameTop =
          buttonTweenStartFrameTop +
          (buttonTweenEndFrameTop - buttonTweenStartFrameTop) * easedProgress;
        const nextCameraUnit =
          buttonTweenStartCameraUnit +
          (buttonTweenEndCameraUnit - buttonTweenStartCameraUnit) * easedProgress;

        applyPanoFrameSize({
          width: nextFrameWidth,
          height: nextFrameHeight,
          top: nextFrameTop
        });

        currentOffset = nextCameraUnit * frameWidth;
      } else {
        currentOffset =
          buttonTweenStartOffset +
          (buttonTweenEndOffset - buttonTweenStartOffset) * easedProgress;
      }

      targetOffset = currentOffset;

      if (progress >= 1) {
        if (buttonTweenZoomActive) {
          applyPanoFrameSize({
            width: buttonTweenEndFrameWidth,
            height: buttonTweenEndFrameHeight,
            top: buttonTweenEndFrameTop
          });
          currentOffset = buttonTweenEndCameraUnit * frameWidth;
          buttonTweenEndOffset = currentOffset;
        } else {
          currentOffset = buttonTweenEndOffset;
        }

        buttonTweenActive = false;
        buttonTweenZoomActive = false;
        targetOffset = currentOffset;

        if (buttonArrivalCallback) {
          const callback = buttonArrivalCallback;
          buttonArrivalCallback = null;

          buttonArrivalTimeout = setTimeout(() => {
            buttonArrivalTimeout = null;
            callback();
          }, buttonSettleDelay);
        }
      }
    }

    function updatePanorama() {
      if (buttonTweenActive) {
        updateButtonTween();
      } else {
        currentOffset += (targetOffset - currentOffset) * cameraEase;
      }

      panoramaStrip.style.transform = `translate3d(${-currentOffset}px, 0, 0)`;
    }

    function getResponsiveHotspotScaleFactor() {
      const mobileLayout =
        window.matchMedia("(hover: none) and (pointer: coarse)").matches ||
        window.innerWidth <= 700;

      if (!mobileLayout) return 1;

      /* Scale progressively from phone to tablet instead of switching at one
         hard breakpoint. This keeps the hotspot circles comfortable on small
         screens while preserving their prominence on larger touch devices. */
      const viewport = getVisibleViewportSize();
      const shortViewportSide = Math.min(viewport.width, viewport.height);
      return Math.max(0.58, Math.min(0.82, shortViewportSide / 600));
    }

    function updateHotspots() {
      let strongestHoverPause = 0;
      const viewport = getVisibleViewportSize();
      const responsiveHotspotScaleFactor = getResponsiveHotspotScaleFactor();

      hotspots.forEach((hotspot) => {
        /*
          offsetX/offsetY are source-image pixel adjustments, not viewport
          pixels. Scaling them with the rendered 1920 × 1080 frame prevents
          the old drift that appeared when the browser aspect ratio changed.
        */
        const responsiveOffsetX =
          Number(hotspot.offsetX || 0) * (frameWidth / panoSourceWidth);
        const responsiveOffsetY =
          Number(hotspot.offsetY || 0) * (frameHeight / panoSourceHeight);

        const hotspotBaseX =
          hotspot.frame * frameWidth +
          (hotspot.x / 100) * frameWidth +
          responsiveOffsetX;

        let bestScreenX = 0;
        let bestDistance = Infinity;

        for (let repeat = 0; repeat < 3; repeat++) {
          const worldX = hotspotBaseX + repeat * totalWidth;
          const screenX = worldX - currentOffset;
          const distance = Math.abs(screenX - viewport.width / 2);

          if (distance < bestDistance) {
            bestDistance = distance;
            bestScreenX = screenX;
          }
        }

        const screenY =
          panoStripTop +
          (hotspot.y / 100) * frameHeight +
          responsiveOffsetY;

        const visible =
          hotspotsVisible &&
          bestScreenX > -80 &&
          bestScreenX < viewport.width + 80 &&
          screenY > -80 &&
          screenY < viewport.height + 80;

        const maxDistance = viewport.width / 2;
        const normalizedDistance = Math.min(bestDistance / maxDistance, 1);
        const centerStrength = 1 - normalizedDistance;

        /*
          This follows the smoother blue curve from your sketch:
          small at the edges, gradually growing toward the center,
          with only a rounded peak instead of a flat plateau.
        */
        const scaleCurve = blueHotspotCurve(normalizedDistance);
        let scale = (0.36 + scaleCurve * 1.42) * responsiveHotspotScaleFactor;

        const distanceToPointer = Math.hypot(bestScreenX - pointerX, screenY - pointerY);
        const pointerOverStrength =
          visible &&
            pointerInsideViewer &&
            !isDragging &&
            !sequencePlaying &&
            !activeSequence
            ? easeInOutSine(1 - Math.min(distanceToPointer / hotspotOverstateRadius, 1))
            : 0;

        strongestHoverPause = Math.max(strongestHoverPause, pointerOverStrength);

        /*
          Hover/overstate no longer changes the hotspot scale.
          Scale is now controlled only by the center-of-screen blue curve,
          which prevents the rapid massive/small flickering near the cursor.
        */
        hotspot.element.classList.toggle("is-over", pointerOverStrength > 0.12);

        /*
          The label is attached to the hotspot's centre pivot.
          The parent hotspot still scales only from the center-of-screen curve.
          Counter-scale keeps the text size visually consistent.
        */
        const labelOpacity = Math.max(Math.pow(scaleCurve, 1.35), pointerOverStrength * 0.92);

        /*
          Let the title grow as the hotspot approaches the center, but only
          partially counter-scale it so the text growth stays controlled.
          Also pull the title closer to the hotspot near the peak so it does
          not drift too far away when the parent hotspot is largest.
        */
        const labelCounterScale = 1 / Math.pow(scale, 0.45);
        const labelDistance = 52 - scaleCurve * 22;

        hotspot._screenX = bestScreenX;
        hotspot._screenY = screenY;
        hotspot._visible = visible;

        if (!visible) {
          hotspot.element.classList.remove("is-over");
        }

        hotspot.element.style.left = `${bestScreenX}px`;
        hotspot.element.style.top = `${screenY}px`;
        hotspot.element.style.opacity = visible ? "1" : "0";
        hotspot.element.style.pointerEvents = visible ? "auto" : "none";
        hotspot.element.style.setProperty("--hotspot-scale", scale.toFixed(3));
        hotspot.element.style.setProperty("--hotspot-label-opacity", labelOpacity.toFixed(3));
        hotspot.element.style.setProperty("--label-counter-scale", labelCounterScale.toFixed(4));
        hotspot.element.style.setProperty("--label-distance", `${labelDistance}px`);
      });

      hoverPauseTarget = strongestHoverPause > 0.1 ? 1 : 0;
    }

    function preloadAllHotspotThumbnails() {
      const uniqueNames = Array.from(
        new Set(
          hotspots
            .map((hotspot) =>
              (hotspot.text || hotspot.label || hotspot.title || "").trim()
            )
            .filter(Boolean)
        )
      );

      return Promise.all(
        uniqueNames.map((name) => {
          const image = new Image();
          image.src = `Thumbnails/${encodeURIComponent(name)}.png`;

          if (image.complete) {
            return image.decode
              ? image.decode().catch(() => { })
              : Promise.resolve();
          }

          return new Promise((resolve) => {
            image.onload = async () => {
              if (image.decode) {
                try {
                  await image.decode();
                } catch (error) { }
              }
              resolve();
            };
            image.onerror = resolve;
          });
        })
      );
    }

    function waitForDelay(milliseconds) {
      return new Promise((resolve) => setTimeout(resolve, milliseconds));
    }

    function getClosestVisibleHotspotToCenter() {
      const centerX = window.innerWidth / 2;
      let closestHotspot = null;
      let closestDistance = Infinity;

      hotspots.forEach((hotspot) => {
        if (!hotspot._visible) return;

        const distance = Math.abs(hotspot._screenX - centerX);
        if (distance < closestDistance) {
          closestDistance = distance;
          closestHotspot = hotspot;
        }
      });

      return closestHotspot;
    }

    async function prepareStartupThumbnail(hotspot) {
      const thumbnailName = getHotspotThumbnailName(hotspot);
      if (!thumbnailName) return false;

      const element = hotspotFocusThumbnailA;

      resetThumbnailElement(hotspotFocusThumbnailA);
      resetThumbnailElement(hotspotFocusThumbnailB);

      activeThumbnailElement = hotspotFocusThumbnailA;
      inactiveThumbnailElement = hotspotFocusThumbnailB;
      currentThumbnailKey = thumbnailName;
      animateHotspotFocusArc();

      element.alt = thumbnailName;
      element.classList.add("startup-thumbnail");
      element.src = `Thumbnails/${encodeURIComponent(thumbnailName)}.png`;

      await new Promise((resolve) => {
        const finish = async () => {
          if (element.decode) {
            try {
              await element.decode();
            } catch (error) { }
          }
          resolve();
        };

        if (element.complete && element.naturalWidth > 0) {
          finish();
        } else {
          element.onload = finish;
          element.onerror = resolve;
        }
      });

      element.onload = null;
      element.onerror = null;
      return element.naturalWidth > 0;
    }

    async function revealInitialThumbnailFeature() {
      /*
        All PNGs are cached first. The actual first thumbnail element is then
        decoded before the circle is allowed to appear.
      */
      await preloadAllHotspotThumbnails();

      autoRotate = false;
      panVelocity = 0;
      targetOffset = currentOffset;
      setPanToggleVisible(false);

      updatePanorama();
      updateHotspots();

      const focusHotspot = getClosestVisibleHotspotToCenter();
      if (!focusHotspot) {
        hotspotFocusCircle.classList.remove("startup-hidden");
        setPanToggleVisible(true);
        return;
      }

      const thumbnailReady = await prepareStartupThumbnail(focusHotspot);

      /*
        A short paint buffer avoids exposing the circle during the same frame
        in which the browser finishes decoding the PNG.
      */
      await waitForDelay(280);

      connectorActiveHotspot = focusHotspot;
      connectorOutgoingHotspot = null;
      connectorTransitioning = false;
      setActiveHotspotButton(focusHotspot);

      // Stage 1: circle scales and fades in, then remains visible.
      hotspotFocusCircle.classList.remove("startup-hidden");
      await waitForDelay(540);

      // Stage 2: line extends from the circle to the correct hotspot.
      hotspotConnectorEnabled = true;
      connectorTransitionStart = performance.now();
      connectorTransitioning = true;
      await waitForDelay(connectorTransitionDuration + 90);

      // Stage 3: the fully decoded thumbnail scales and fades in.
      if (thumbnailReady) {
        void activeThumbnailElement.offsetWidth;
        activeThumbnailElement.classList.add("startup-thumbnail-show");
        await waitForDelay(520);

        /*
          Transfer to the normal persistent visible state without changing
          opacity or scale, so it cannot blink or disappear afterward.
        */
        activeThumbnailElement.classList.add("is-visible");
        activeThumbnailElement.classList.remove(
          "startup-thumbnail",
          "startup-thumbnail-show"
        );
      }

      setPanToggleVisible(true);

      if (!userPausedAutoRotate && isMainPanoramaPage()) {
        autoRotate = true;
      }
    }

    function getHotspotThumbnailName(hotspot) {
      return (hotspot?.text || hotspot?.label || hotspot?.title || "").trim();
    }

    function resetThumbnailElement(element) {
      element.classList.remove(
        "is-visible",
        "is-entering",
        "is-exiting",
        "is-flipping-in",
        "startup-thumbnail",
        "startup-thumbnail-show"
      );
      element.style.removeProperty("opacity");
      element.style.removeProperty("visibility");
      element.style.removeProperty("transition-duration");
      element.onload = null;
      element.onerror = null;
    }

    const hotspotFocusArcRadius = 48.4;
    const hotspotFocusArcCircumference = 2 * Math.PI * hotspotFocusArcRadius;
    const hotspotFocusArcLength = hotspotFocusArcCircumference * 0.205;
    const hotspotFocusArcBlurLength = hotspotFocusArcCircumference * 0.42;
    let hotspotFocusArcAnimationToken = 0;

    function setHotspotFocusCloseToCollapse() {
      hotspotFocusClose.innerHTML = `
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M7 10l5 5 5-5"></path>
        </svg>
      `;
      hotspotFocusClose.setAttribute("aria-label", "Hide thumbnails");
      hotspotFocusClose.setAttribute("title", "Hide thumbnails");
    }

    function setHotspotFocusCloseToShow() {
      hotspotFocusClose.textContent = "SHOW THUMBNAILS";
      hotspotFocusClose.setAttribute("aria-label", "Show thumbnails");
      hotspotFocusClose.setAttribute("title", "Show thumbnails");
    }

    function stopHotspotFocusArcAnimation() {
      hotspotFocusArcAnimationToken += 1;
      if (hotspotFocusArcBlur) hotspotFocusArcBlur.style.opacity = "0";
      hotspotFocusArcSegment.style.opacity = "0";
    }

    function animateHotspotFocusArc(duration = 1160) {
      if (!hotspotFocusArcSegment) return;

      const animationToken = ++hotspotFocusArcAnimationToken;
      const animationDuration = Math.max(1, duration);
      const fadeInEnd = 0.1;
      const fadeOutStart = 0.86;
      const mainGapLength = Math.max(0, hotspotFocusArcCircumference - hotspotFocusArcLength);
      const blurGapLength = Math.max(0, hotspotFocusArcCircumference - hotspotFocusArcBlurLength);

      if (hotspotFocusArcBlur) {
        hotspotFocusArcBlur.style.strokeDasharray = `${hotspotFocusArcBlurLength.toFixed(2)} ${blurGapLength.toFixed(2)}`;
        hotspotFocusArcBlur.style.strokeDashoffset = "0";
        hotspotFocusArcBlur.style.opacity = "0";
      }

      hotspotFocusArcSegment.style.strokeDasharray = `${hotspotFocusArcLength.toFixed(2)} ${mainGapLength.toFixed(2)}`;
      hotspotFocusArcSegment.style.strokeDashoffset = "0";
      hotspotFocusArcSegment.style.opacity = "0";

      const startTime = performance.now();

      function step(now) {
        if (animationToken !== hotspotFocusArcAnimationToken) return;

        const rawProgress = Math.max(0, Math.min((now - startTime) / animationDuration, 1));
        /*
          Bell-curve-like speed profile:
          - slow near the top at the start and end
          - fastest at the bottom halfway through the orbit
        */
        const orbitProgress = 0.5 - 0.5 * Math.cos(Math.PI * rawProgress);
        const fadeProgress =
          rawProgress < fadeInEnd
            ? rawProgress / fadeInEnd
            : rawProgress > fadeOutStart
              ? Math.max(0, 1 - (rawProgress - fadeOutStart) / (1 - fadeOutStart))
              : 1;
        const dashOffset = `${(-hotspotFocusArcCircumference * orbitProgress).toFixed(2)}`;

        if (hotspotFocusArcBlur) {
          hotspotFocusArcBlur.style.strokeDashoffset = dashOffset;
          hotspotFocusArcBlur.style.opacity = `${(fadeProgress * 0.68).toFixed(3)}`;
        }

        hotspotFocusArcSegment.style.strokeDashoffset = dashOffset;
        hotspotFocusArcSegment.style.opacity = `${Math.min(1, fadeProgress * 0.98).toFixed(3)}`;

        if (rawProgress < 1) {
          requestAnimationFrame(step);
        } else if (animationToken === hotspotFocusArcAnimationToken) {
          if (hotspotFocusArcBlur) hotspotFocusArcBlur.style.opacity = "0";
          hotspotFocusArcSegment.style.opacity = "0";
        }
      }

      requestAnimationFrame(step);
    }

    function hideAllThumbnails() {
      thumbnailSwapToken += 1;

      [hotspotFocusThumbnailA, hotspotFocusThumbnailB].forEach((element) => {
        resetThumbnailElement(element);
        element.style.opacity = "0";
      });
    }

    function getThumbnailHalfFlipDuration() {
      /*
        Faster manual panning shortens the flip. At normal automatic-pan speed,
        the animation remains slow enough to clearly read.
      */
      const effectiveSpeed = Math.max(
        recentThumbnailPanSpeed,
        Math.abs(panVelocity) * 5,
        autoRotate ? autoRotateSpeed : 0
      );

      return Math.round(
        Math.max(260, Math.min(950, 950 / (1 + effectiveSpeed * 0.06)))
      );
    }

    function updateHotspotThumbnail(hotspot, force = false) {
      if (!hotspot || !hotspotConnectorEnabled) return;

      const thumbnailName = getHotspotThumbnailName(hotspot);
      if (!thumbnailName) return;
      if (!force && thumbnailName === currentThumbnailKey) return;

      currentThumbnailKey = thumbnailName;
      const swapToken = ++thumbnailSwapToken;
      const nextElement = inactiveThumbnailElement;
      const previousElement = activeThumbnailElement;
      const encodedFilename = encodeURIComponent(thumbnailName) + ".png";

      resetThumbnailElement(nextElement);
      nextElement.alt = thumbnailName;
      nextElement.classList.add("is-entering");
      nextElement.src = `Thumbnails/${encodedFilename}`;

      let revealStarted = false;

      const revealNext = () => {
        if (revealStarted) return;
        if (swapToken !== thumbnailSwapToken || !hotspotConnectorEnabled) return;

        revealStarted = true;
        const halfFlipDuration = getThumbnailHalfFlipDuration();

        /*
          Restart the orbiting outline for every real thumbnail swap. Its
          duration follows both halves of the flip so the line animation and
          thumbnail rotation read as one coordinated transition.
        */
        animateHotspotFocusArc(halfFlipDuration * 2);

        /*
          OUTGOING HALF:
          The current PNG begins gently, then continues at speed with no
          ease-out until it is exactly edge-on. The right side rotates toward
          the viewer and the left side rotates away.
        */
        resetThumbnailElement(nextElement);
        nextElement.alt = thumbnailName;
        nextElement.src = `Thumbnails/${encodedFilename}`;

        previousElement.style.transitionDuration = `${halfFlipDuration}ms`;
        previousElement.classList.remove(
          "is-visible",
          "is-entering",
          "is-flipping-in"
        );
        previousElement.classList.add("is-exiting");

        setTimeout(() => {
          if (swapToken !== thumbnailSwapToken || !hotspotConnectorEnabled) return;

          /*
            At the exact edge-on point, completely remove the outgoing PNG.
            This guarantees that multiple thumbnails can never remain layered.
          */
          resetThumbnailElement(previousElement);

          /*
            INCOMING HALF:
            The new PNG appears only as an edge-on line, then continues rotating
            in the same direction into full view. It starts immediately with no
            ease-in and gently eases out as it faces the viewer.
          */
          resetThumbnailElement(nextElement);
          nextElement.style.transitionDuration = `${halfFlipDuration}ms`;
          nextElement.classList.add("is-entering");

          // Force the browser to commit the edge-on starting state.
          void nextElement.offsetWidth;

          requestAnimationFrame(() => {
            if (swapToken !== thumbnailSwapToken || !hotspotConnectorEnabled) return;
            nextElement.classList.add("is-flipping-in");
          });

          setTimeout(() => {
            if (swapToken !== thumbnailSwapToken || !hotspotConnectorEnabled) return;

            nextElement.classList.remove("is-entering", "is-flipping-in");
            nextElement.classList.add("is-visible");

            activeThumbnailElement = nextElement;
            inactiveThumbnailElement = previousElement;
          }, halfFlipDuration);
        }, halfFlipDuration);
      };

      nextElement.onload = revealNext;
      nextElement.onerror = () => {
        if (swapToken !== thumbnailSwapToken) return;
        resetThumbnailElement(nextElement);
      };

      if (nextElement.complete && nextElement.naturalWidth > 0) {
        revealNext();
      }
    }

    function easeInOutCubic(t) {
      return t < 0.5
        ? 4 * t * t * t
        : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    function hideConnectorPair(line, dot, pulse) {
      line.style.opacity = "0";
      dot.style.opacity = "0";

      if (pulse) {
        pulse.style.opacity = "0";
        pulse.classList.remove("is-arrived-pulse");
      }
    }

    function pulseConnectorDot(pulse) {
      if (!pulse) return;

      /*
        Restart the one-time halo pulse while leaving the solid center dot at
        its normal 3.5px radius throughout the animation.
      */
      pulse.classList.remove("is-arrived-pulse");
      void pulse.getBoundingClientRect();
      pulse.classList.add("is-arrived-pulse");
    }

    function drawConnectorPair(line, dot, pulse, hotspot, progress, circleCenterX, circleCenterY) {
      if (!hotspot || !hotspot._visible) {
        hideConnectorPair(line, dot, pulse);
        return;
      }

      const hotspotX = hotspot._screenX;
      const hotspotY = hotspot._screenY;
      const endX = circleCenterX + (hotspotX - circleCenterX) * progress;
      const endY = circleCenterY + (hotspotY - circleCenterY) * progress;

      line.setAttribute("x1", circleCenterX.toFixed(2));
      line.setAttribute("y1", circleCenterY.toFixed(2));
      line.setAttribute("x2", endX.toFixed(2));
      line.setAttribute("y2", endY.toFixed(2));

      /*
        Keep the dot attached to the moving tip of the connector line. It now
        travels from the thumbnail circle to the hotspot instead of appearing
        at the hotspot before the line arrives.
      */
      dot.setAttribute("cx", endX.toFixed(2));
      dot.setAttribute("cy", endY.toFixed(2));
      pulse.setAttribute("cx", endX.toFixed(2));
      pulse.setAttribute("cy", endY.toFixed(2));

      line.style.opacity = progress > 0.001 ? "1" : "0";
      dot.style.opacity = progress > 0.001 ? "1" : "0";

      /* The halo is revealed only by the one-time arrival animation. */
      if (progress < 1) {
        pulse.style.opacity = "0";
        pulse.classList.remove("is-arrived-pulse");
      }
    }

    function updateHotspotConnector(now = performance.now()) {
      if (
        !hotspotConnectorEnabled ||
        !hotspotsVisible ||
        sequencePlaying ||
        activeSequence ||
        sequencePreparing
      ) {
        hideConnectorPair(hotspotConnectorLineA, hotspotConnectorDotA, hotspotConnectorPulseA);
        hideConnectorPair(hotspotConnectorLineB, hotspotConnectorDotB, hotspotConnectorPulseB);
        return;
      }

      const focusHotspot = getClosestVisibleHotspotToCenter();

      if (!focusHotspot) {
        hideConnectorPair(hotspotConnectorLineA, hotspotConnectorDotA, hotspotConnectorPulseA);
        hideConnectorPair(hotspotConnectorLineB, hotspotConnectorDotB, hotspotConnectorPulseB);
        return;
      }

      if (!connectorActiveHotspot) {
        connectorActiveHotspot = focusHotspot;
        connectorOutgoingHotspot = null;
        connectorTransitionStart = now;
        connectorTransitioning = true;
        setActiveHotspotButton(connectorActiveHotspot);
        updateHotspotThumbnail(connectorActiveHotspot);
      } else if (focusHotspot !== connectorActiveHotspot) {
        connectorOutgoingHotspot = connectorActiveHotspot;
        connectorActiveHotspot = focusHotspot;
        connectorTransitionStart = now;
        connectorTransitioning = true;
        setActiveHotspotButton(connectorActiveHotspot);
        updateHotspotThumbnail(connectorActiveHotspot);
      }

      const circleRect = hotspotFocusCircle.getBoundingClientRect();
      const circleCenterX = circleRect.left + circleRect.width / 2;
      const circleCenterY = circleRect.top + circleRect.height / 2;

      if (connectorTransitioning) {
        const rawProgress = Math.max(
          0,
          Math.min((now - connectorTransitionStart) / connectorTransitionDuration, 1)
        );
        const easedProgress = easeInOutCubic(rawProgress);

        /*
          Two independent lines animate at the same time:
          - The outgoing line and its tip dot retract into the large circle.
          - The incoming line and its tip dot extend toward the new hotspot.
        */
        if (connectorOutgoingHotspot) {
          drawConnectorPair(
            hotspotConnectorLineA,
            hotspotConnectorDotA,
            hotspotConnectorPulseA,
            connectorOutgoingHotspot,
            1 - easedProgress,
            circleCenterX,
            circleCenterY
          );
        } else {
          hideConnectorPair(hotspotConnectorLineA, hotspotConnectorDotA, hotspotConnectorPulseA);
        }

        drawConnectorPair(
          hotspotConnectorLineB,
          hotspotConnectorDotB,
          hotspotConnectorPulseB,
          connectorActiveHotspot,
          easedProgress,
          circleCenterX,
          circleCenterY
        );

        if (rawProgress >= 1) {
          connectorTransitioning = false;
          connectorOutgoingHotspot = null;

          hideConnectorPair(hotspotConnectorLineA, hotspotConnectorDotA, hotspotConnectorPulseA);
          drawConnectorPair(
            hotspotConnectorLineB,
            hotspotConnectorDotB,
            hotspotConnectorPulseB,
            connectorActiveHotspot,
            1,
            circleCenterX,
            circleCenterY
          );
          pulseConnectorDot(hotspotConnectorPulseB);
        }

        return;
      }

      hideConnectorPair(hotspotConnectorLineA, hotspotConnectorDotA, hotspotConnectorPulseA);
      drawConnectorPair(
        hotspotConnectorLineB,
        hotspotConnectorDotB,
        hotspotConnectorPulseB,
        connectorActiveHotspot,
        1,
        circleCenterX,
        circleCenterY
      );
    }

    function getCurrentFrameIndex() {
      const normalizedOffset =
        ((currentOffset % totalWidth) + totalWidth) % totalWidth;

      return Math.round(normalizedOffset / frameWidth) % frameCount;
    }

    function setActiveFrameButton(frameIndex) {
      /*
        Several hotspot titles can belong to the same panorama frame, so do not
        automatically mark every button on that frame as active.
      */
      const activeButton = frameButtons.find((button) => button.classList.contains("active"));

      if (activeButton && Number(activeButton.dataset.frame) !== frameIndex) {
        activeButton.classList.remove("active");
      }
    }

    function updateActiveFrameButton() {
      if (buttonTweenActive || isDragging || autoRotate || sequencePlaying) return;
      setActiveFrameButton(getCurrentFrameIndex());
    }

    function wrapOffsetsIfNeeded() {
      if (currentOffset > totalWidth * 2) {
        currentOffset -= totalWidth;
        targetOffset -= totalWidth;

        if (buttonTweenActive) {
          if (buttonTweenZoomActive) {
            buttonTweenStartCameraUnit -= frameCount;
            buttonTweenEndCameraUnit -= frameCount;
          } else {
            buttonTweenStartOffset -= totalWidth;
            buttonTweenEndOffset -= totalWidth;
          }
        }
      }

      if (currentOffset < totalWidth * 0.5) {
        currentOffset += totalWidth;
        targetOffset += totalWidth;

        if (buttonTweenActive) {
          if (buttonTweenZoomActive) {
            buttonTweenStartCameraUnit += frameCount;
            buttonTweenEndCameraUnit += frameCount;
          } else {
            buttonTweenStartOffset += totalWidth;
            buttonTweenEndOffset += totalWidth;
          }
        }
      }
    }

    function destroySequenceLottieInstance(instance) {
      if (!instance) return;

      try {
        instance.animation?.destroy();
      } catch (error) { }

      if (instance.layer?.parentNode) {
        instance.layer.remove();
      }
    }

    function loadSequenceLottieLayer({ key, path, label, hidden = true }) {
      return new Promise((resolve) => {
        if (!window.lottie) {
          console.error("Lottie library is unavailable.");
          resolve(null);
          return;
        }

        const layer = document.createElement("div");
        layer.className = "sequenceLottieLayer";
        layer.dataset.lottieKey = key;
        if (hidden) layer.classList.add("is-incoming");
        sequenceLottieContainer.appendChild(layer);

        const animation = lottie.loadAnimation({
          container: layer,
          renderer: "svg",
          loop: false,
          autoplay: false,
          path,
          rendererSettings: {
            preserveAspectRatio: "xMidYMid meet",
            progressiveLoad: true
          }
        });

        let settled = false;
        const finish = (result) => {
          if (settled) return;
          settled = true;
          resolve(result);
        };

        animation.addEventListener("DOMLoaded", () => {
          animation.goToAndStop(0, true);
          finish({ key, path, label, layer, animation });
        });

        animation.addEventListener("data_failed", () => {
          console.error(`The Lottie for ${label || key} could not be loaded from ${path}.`);
          destroySequenceLottieInstance({ layer, animation });
          finish(null);
        });
      });
    }

    function attachActiveLottieBoundaryHandler(instance) {
      if (!instance?.animation || instance.animation.__luxBoundaryHandlerAttached) return;
      instance.animation.__luxBoundaryHandlerAttached = true;

      instance.animation.addEventListener("complete", () => {
        if (instance.animation !== sequenceLottieAnimation) return;

        const finalFrame = Math.max(
          0,
          Math.floor(instance.animation.totalFrames || 1) - 1
        );
        const holdFrame = sequenceLottiePlaybackDirection < 0 ? 0 : finalFrame;

        sequenceLottieLastFrame = holdFrame;
        instance.animation.goToAndStop(holdFrame, true);
      });
    }

    function setActiveSequenceLottieInstance(instance) {
      sequenceLottieAnimation = instance?.animation || null;
      sequenceLottieLayer = instance?.layer || null;
      sequenceLottieReady = Boolean(instance?.animation);
      sequenceLottieActiveKey = instance?.key || "";
      sequenceLottieLastFrame = sequenceLottieReady ? 0 : -1;
      sequenceLottiePlaybackDirection = 1;

      if (instance) {
        attachActiveLottieBoundaryHandler(instance);
      }
    }

    function initializeSequenceLottie(config) {
      if (!config) return Promise.resolve(false);

      const requestedKey = config.key || normalizeHotspotKey(config.hotspotText);
      const requestedPath = config.lottiePath;

      if (
        sequenceLottieReady &&
        sequenceLottieAnimation &&
        sequenceLottieActiveKey === requestedKey
      ) {
        return Promise.resolve(true);
      }

      if (
        sequenceLottieLoadPromise &&
        sequenceLottieLoadKey === requestedKey
      ) {
        return sequenceLottieLoadPromise;
      }

      sequenceLottieLoadToken += 1;
      const loadToken = sequenceLottieLoadToken;
      sequenceLottieLoadKey = requestedKey;

      sequenceLottieLoadPromise = (async () => {
        const oldInstance = sequenceLottieAnimation || sequenceLottieLayer
          ? {
            key: sequenceLottieActiveKey,
            animation: sequenceLottieAnimation,
            layer: sequenceLottieLayer
          }
          : null;

        const instance = await loadSequenceLottieLayer({
          key: requestedKey,
          path: requestedPath,
          label: config.hotspotText,
          hidden: true
        });

        if (loadToken !== sequenceLottieLoadToken) {
          destroySequenceLottieInstance(instance);
          return false;
        }

        if (!instance) {
          return false;
        }

        instance.layer.classList.remove("is-incoming");
        setActiveSequenceLottieInstance(instance);
        destroySequenceLottieInstance(oldInstance);

        Array.from(sequenceLottieContainer.children).forEach((child) => {
          if (child !== instance.layer) child.remove();
        });

        return true;
      })().finally(() => {
        if (loadToken === sequenceLottieLoadToken) {
          sequenceLottieLoadPromise = null;
          sequenceLottieLoadKey = "";
        }
      });

      return sequenceLottieLoadPromise;
    }

    function getMultiLottiePageSet(config = activeSequence) {
      if (!config) return null;
      return multiLottiePageSets.get(config.key) || null;
    }

    function isMultiLottieSequence(config = activeSequence) {
      return Boolean(getMultiLottiePageSet(config));
    }

    function setMultiLottieMode(enabled) {
      sequenceLottieCard.classList.toggle("is-multi-lottie", enabled);
      metalCraftPagination.setAttribute("aria-hidden", enabled ? "false" : "true");

      if (!enabled) {
        metalCraftTransitioning = false;
        metalCraftNavigationToken += 1;
      }
    }

    function updateMultiLottieNavigationUI() {
      const pageSet = getMultiLottiePageSet();
      const pages = pageSet?.pages || [];
      const lastIndex = pages.length - 1;
      const busy = metalCraftTransitioning;

      if (pages.length > 0) {
        metalCraftPageIndex = Math.max(0, Math.min(metalCraftPageIndex, lastIndex));
      } else {
        metalCraftPageIndex = 0;
      }

      metalCraftDots.forEach((dot, index) => {
        dot.hidden = index >= pages.length;
        dot.classList.toggle(
          "is-active",
          index === metalCraftPageIndex && index < pages.length
        );
      });

      const noPages = pages.length === 0;
      metalCraftPrevButton.classList.toggle("is-hidden", noPages || metalCraftPageIndex <= 0);
      metalCraftNextButton.classList.toggle("is-hidden", noPages || metalCraftPageIndex >= lastIndex);
      metalCraftPrevButton.classList.toggle("is-busy", busy);
      metalCraftNextButton.classList.toggle("is-busy", busy);
      metalCraftPrevButton.disabled = busy || noPages || metalCraftPageIndex <= 0;
      metalCraftNextButton.disabled = busy || noPages || metalCraftPageIndex >= lastIndex;

      const productLabel = pageSet?.label || "Profile";
      const pageNumber = pages.length > 0 ? metalCraftPageIndex + 1 : 0;
      metalCraftPrevButton.setAttribute("aria-label", `Previous ${productLabel} option`);
      metalCraftNextButton.setAttribute("aria-label", `Next ${productLabel} option`);
      metalCraftPagination.setAttribute(
        "aria-label",
        `${productLabel} option ${pageNumber} of ${pages.length}`
      );
    }

    function resetMultiLottieNavigation() {
      metalCraftPageIndex = 0;
      metalCraftTransitioning = false;
      updateMultiLottieNavigationUI();
    }

    function waitForLottieBoundary(animation, direction, restartFromBoundary = false) {
      return new Promise((resolve) => {
        if (!animation) {
          resolve();
          return;
        }

        const finalFrame = Math.max(
          0,
          Math.floor(animation.totalFrames || 1) - 1
        );
        const targetFrame = direction < 0 ? 0 : finalFrame;
        let settled = false;

        const finish = () => {
          if (settled) return;
          settled = true;
          animation.removeEventListener("complete", finish);
          animation.goToAndStop(targetFrame, true);
          if (animation === sequenceLottieAnimation) {
            sequenceLottieLastFrame = targetFrame;
          }
          resolve();
        };

        animation.addEventListener("complete", finish);
        animation.pause();
        animation.setDirection(direction < 0 ? -1 : 1);

        if (animation === sequenceLottieAnimation) {
          sequenceLottiePlaybackDirection = direction < 0 ? -1 : 1;
        }

        if (direction > 0) {
          if (restartFromBoundary) {
            animation.goToAndPlay(0, true);
          } else {
            animation.play();
          }
        } else {
          const currentFrame = Number(animation.currentFrame || 0);
          if (currentFrame <= 0.5) {
            finish();
            return;
          }
          animation.play();
        }

        const frameRate = Math.max(1, Number(animation.frameRate || 30));
        const fallbackDuration = Math.max(
          900,
          ((finalFrame + 2) / frameRate) * 1000 + 700
        );
        setTimeout(finish, fallbackDuration);
      });
    }

    async function crossfadeSequenceLottie(oldInstance, newInstance) {
      if (!newInstance?.layer) return;

      await waitForPaintFrames(1);
      newInstance.layer.classList.remove("is-incoming");
      oldInstance?.layer?.classList.add("is-fading-out");
      await waitForDelay(320);
      destroySequenceLottieInstance(oldInstance);
    }

    async function navigateMultiLottieOptions(direction) {
      freezePanoramaBackground();

      const pageSet = getMultiLottiePageSet();
      const pages = pageSet?.pages || [];

      if (
        !pageSet ||
        sequencePlaying ||
        metalCraftTransitioning ||
        !sequenceLottieAnimation ||
        !sequenceLottieLayer
      ) return;

      const targetIndex = metalCraftPageIndex + direction;
      if (targetIndex < 0 || targetIndex >= pages.length) return;

      metalCraftTransitioning = true;
      updateMultiLottieNavigationUI();
      const navigationToken = ++metalCraftNavigationToken;
      const activeSequenceKey = activeSequence?.key;
      const targetPage = pages[targetIndex];
      const oldInstance = {
        key: sequenceLottieActiveKey,
        animation: sequenceLottieAnimation,
        layer: sequenceLottieLayer
      };

      /*
        Load the destination into a hidden layer while the current visual stays
        untouched. The current Lottie is never removed until this promise has
        completed successfully.
      */
      const newInstance = await loadSequenceLottieLayer({
        key: targetPage.key,
        path: targetPage.path,
        label: targetPage.label,
        hidden: true
      });

      if (
        navigationToken !== metalCraftNavigationToken ||
        activeSequence?.key !== activeSequenceKey ||
        !getMultiLottiePageSet() ||
        !newInstance
      ) {
        destroySequenceLottieInstance(newInstance);
        metalCraftTransitioning = false;
        updateMultiLottieNavigationUI();
        return;
      }

      if (direction > 0) {
        oldInstance.animation.pause();
        newInstance.animation.goToAndStop(0, true);
        setActiveSequenceLottieInstance(newInstance);
        metalCraftPageIndex = targetIndex;
        updateMultiLottieNavigationUI();

        const playPromise = waitForLottieBoundary(newInstance.animation, 1, true);
        await crossfadeSequenceLottie(oldInstance, newInstance);
        await playPromise;
      } else {
        const previousFinalFrame = Math.max(
          0,
          Math.floor(newInstance.animation.totalFrames || 1) - 1
        );
        newInstance.animation.goToAndStop(previousFinalFrame, true);

        /* Reverse the current option all the way to frame zero before leaving it. */
        await waitForLottieBoundary(oldInstance.animation, -1, false);
        if (navigationToken !== metalCraftNavigationToken) {
          destroySequenceLottieInstance(newInstance);
          return;
        }

        await waitForDelay(120);
        setActiveSequenceLottieInstance(newInstance);
        sequenceLottieLastFrame = previousFinalFrame;
        sequenceLottieAnimation.goToAndStop(previousFinalFrame, true);
        metalCraftPageIndex = targetIndex;
        updateMultiLottieNavigationUI();
        await crossfadeSequenceLottie(oldInstance, newInstance);
      }

      if (navigationToken !== metalCraftNavigationToken) return;

      sequenceLottiePlaybackDirection = 1;
      metalCraftTransitioning = false;
      updateMultiLottieNavigationUI();
    }

    async function preparePrimaryMultiLottieForPanoramaReturn() {
      /*
        Secondary profile Lotties only switch between product pages. When
        leaving either METAL CRAFT or SOFFIT, restore that hotspot's original
        Lottie at its completed frame before beginning the normal reverse.
      */
      const pageSet = getMultiLottiePageSet();
      const pages = pageSet?.pages || [];
      const primaryPage = pages[0];

      if (!primaryPage || sequenceLottieActiveKey === primaryPage.key) {
        return Boolean(sequenceLottieAnimation);
      }

      const activeSequenceKey = activeSequence?.key;
      const returnToken = ++metalCraftNavigationToken;
      metalCraftTransitioning = true;
      updateMultiLottieNavigationUI();

      const oldInstance = sequenceLottieAnimation || sequenceLottieLayer
        ? {
          key: sequenceLottieActiveKey,
          animation: sequenceLottieAnimation,
          layer: sequenceLottieLayer
        }
        : null;

      const primaryInstance = await loadSequenceLottieLayer({
        key: primaryPage.key,
        path: primaryPage.path,
        label: primaryPage.label,
        hidden: true
      });

      if (
        returnToken !== metalCraftNavigationToken ||
        activeSequence?.key !== activeSequenceKey ||
        !getMultiLottiePageSet() ||
        !primaryInstance
      ) {
        destroySequenceLottieInstance(primaryInstance);
        metalCraftTransitioning = false;
        updateMultiLottieNavigationUI();
        return false;
      }

      const primaryFinalFrame = Math.max(
        0,
        Math.floor(primaryInstance.animation.totalFrames || 1) - 1
      );

      primaryInstance.animation.pause();
      primaryInstance.animation.goToAndStop(primaryFinalFrame, true);

      setActiveSequenceLottieInstance(primaryInstance);
      sequenceLottieLastFrame = primaryFinalFrame;
      sequenceLottiePlaybackDirection = -1;
      metalCraftPageIndex = 0;
      updateMultiLottieNavigationUI();

      /* Replace the secondary page directly with the completed primary page. */
      await crossfadeSequenceLottie(oldInstance, primaryInstance);

      if (returnToken !== metalCraftNavigationToken) {
        return false;
      }

      metalCraftTransitioning = false;
      updateMultiLottieNavigationUI();
      return true;
    }

    function setSequenceChromeVisible(visible) {
      sequenceLottieCard.classList.toggle("is-chrome-visible", visible);
    }

    function setSequenceContentVisible(visible) {
      sequenceLottieCard.classList.toggle("is-content-visible", visible);
    }

    function showSequenceLottie(show, showChrome = true, showContent = true) {
      if (show) {
        sequenceLottieCard.classList.remove("is-returning");
        sequenceLottiePanel.style.display = "flex";
        sequenceLottiePanel.setAttribute("aria-hidden", "false");
        setSequenceChromeVisible(false);
        setSequenceContentVisible(false);

        if (showChrome || showContent) {
          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              setSequenceChromeVisible(showChrome);
              setSequenceContentVisible(showContent);

              if (sequenceLottieAnimation?.resize) {
                sequenceLottieAnimation.resize();
              }
            });
          });
        }
      } else {
        setSequenceChromeVisible(false);
        setSequenceContentVisible(false);
        sequenceLottiePanel.style.display = "none";
        sequenceLottieCard.classList.remove("is-returning");
        sequenceLottiePanel.setAttribute("aria-hidden", "true");
      }
    }

    function beginForwardSequenceChromeReveal() {
      if (sequenceChromeRevealStarted || sequenceDirection !== 1) return;

      sequenceChromeRevealStarted = true;
      sequenceLottiePanel.style.display = "flex";
      sequenceLottiePanel.setAttribute("aria-hidden", "false");

      /*
        Mount the complete card at its small grouped scale first, then animate
        the entire window from one fixed center. No child element moves
        independently.
      */
      setSequenceChromeVisible(false);

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          if (
            sequenceDirection === 1 &&
            sequenceChromeRevealStarted
          ) {
            setSequenceChromeVisible(true);
          }
        });
      });
    }

    function revealForwardSequenceMenu() {
      if (sequenceMenuRevealed || sequenceDirection !== 1) return;

      if (!sequenceChromeRevealStarted) {
        beginForwardSequenceChromeReveal();
      }

      sequenceMenuRevealed = true;

      /*
        Bring the Lottie in on the same earlier trigger as the grouped window. Only the
        surrounding blur and controls begin earlier.
      */
      sequenceLottiePanel.style.display = "flex";
      sequenceLottiePanel.setAttribute("aria-hidden", "false");

      if (sequenceLottieReady && sequenceLottieAnimation) {
        sequenceLottieAnimation.pause();
        sequenceLottieLastFrame = 0;
        sequenceLottieAnimation.goToAndStop(0, true);
      }

      setSequenceContentVisible(true);

      if (sequenceLottieAnimation?.resize) {
        sequenceLottieAnimation.resize();
      }

      requestAnimationFrame(() => {
        if (
          sequenceDirection === 1 &&
          sequenceMenuRevealed &&
          sequenceLottieReady &&
          sequenceLottieAnimation
        ) {
          sequenceLottiePlaybackDirection = 1;
          sequenceLottieAnimation.setSpeed(1.3);
          sequenceLottieAnimation.setDirection(1);
          sequenceLottieAnimation.goToAndPlay(0, true);
        }
      });
    }

    function maybeRevealForwardSequenceMenu() {
      if (sequenceDirection !== 1 || !activeSequence) return;

      const finalIndex = Math.max(1, activeSequence.frames.length - 1);
      const progress = sequenceCurrentIndex / finalIndex;

      if (
        !sequenceChromeRevealStarted &&
        progress >= sequenceChromeRevealProgress
      ) {
        beginForwardSequenceChromeReveal();
      }

      if (
        !sequenceMenuRevealed &&
        progress >= sequenceMenuRevealProgress
      ) {
        revealForwardSequenceMenu();
      }
    }

    function showSequenceLoading(show) {
      sequenceLoadingOverlay.classList.toggle("is-visible", show);
      sequenceLoadingOverlay.setAttribute("aria-hidden", show ? "false" : "true");
    }

    function prepareSequenceAssets(config) {
      /*
        Asset work begins immediately so the camera movement hides as much of
        the loading time as possible. The overlay itself is scheduled by the
        hotspot activation only after the pan has finished.
      */
      if (sequenceLoadingTimer) {
        clearTimeout(sequenceLoadingTimer);
        sequenceLoadingTimer = null;
      }
      showSequenceLoading(false);

      return Promise.all([
        preloadSequence(config),
        initializeSequenceLottie(config)
      ]);
    }

    function animatePanoramaToBrowseLayout(duration = sequenceReturnZoomDuration) {
      const targetSize = getBrowsePanoFrameSize();
      const sizeAlreadyCorrect =
        Math.abs(targetSize.width - frameWidth) < 0.5 &&
        Math.abs(targetSize.height - frameHeight) < 0.5 &&
        Math.abs(targetSize.top - panoStripTop) < 0.5;

      sequenceCameraZoomed = false;

      if (sizeAlreadyCorrect) {
        applyPanoFrameSize(targetSize);
        return Promise.resolve();
      }

      const viewport = getVisibleViewportSize();
      const startWidth = frameWidth;
      const startHeight = frameHeight;
      const startTop = panoStripTop;
      /*
        Lock the exact panorama source point already beneath the middle of the
        screen. Only the rendered frame size changes; there is no destination
        frame change and no left/right camera travel after the reverse sequence.
      */
      const lockedSourcePointAtViewportCenter =
        (currentOffset + viewport.width / 2) / startWidth;
      const startTime = performance.now();

      buttonTweenActive = false;
      buttonTweenZoomActive = false;
      autoRotate = false;
      panVelocity = 0;
      targetOffset = currentOffset;

      return new Promise((resolve) => {
        const step = (now) => {
          const progress = Math.min((now - startTime) / duration, 1);
          const easedProgress = easeInOutQuint(progress);

          applyPanoFrameSize({
            width: startWidth + (targetSize.width - startWidth) * easedProgress,
            height: startHeight + (targetSize.height - startHeight) * easedProgress,
            top: startTop + (targetSize.top - startTop) * easedProgress
          });

          /* Pure zoom: keep the same source point fixed at screen centre. */
          currentOffset =
            lockedSourcePointAtViewportCenter * frameWidth - viewport.width / 2;
          targetOffset = currentOffset;

          if (progress < 1) {
            requestAnimationFrame(step);
          } else {
            applyPanoFrameSize(targetSize);
            currentOffset =
              lockedSourcePointAtViewportCenter * frameWidth - viewport.width / 2;
            targetOffset = currentOffset;
            resolve();
          }
        };

        requestAnimationFrame(step);
      });
    }

    function syncSequencePlaybackCanvasSize() {
      if (!sequencePlaybackCanvas || !sequencePlaybackContext) return;

      const pixelRatio = Math.max(1, Math.min(window.devicePixelRatio || 1, 2));
      const cssWidth = Math.max(1, frameWidth);
      const cssHeight = Math.max(1, frameHeight);
      const bitmapWidth = Math.max(1, Math.round(cssWidth * pixelRatio));
      const bitmapHeight = Math.max(1, Math.round(cssHeight * pixelRatio));

      sequencePlaybackCanvas.style.left = `${-sequenceViewportCropX}px`;
      sequencePlaybackCanvas.style.top = `${panoStripTop}px`;
      sequencePlaybackCanvas.style.width = `${cssWidth}px`;
      sequencePlaybackCanvas.style.height = `${cssHeight}px`;

      if (
        sequencePlaybackCanvas.width !== bitmapWidth ||
        sequencePlaybackCanvas.height !== bitmapHeight
      ) {
        sequencePlaybackCanvas.width = bitmapWidth;
        sequencePlaybackCanvas.height = bitmapHeight;
      }

      sequencePlaybackContext.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
      sequencePlaybackContext.imageSmoothingEnabled = true;
      sequencePlaybackContext.imageSmoothingQuality = "high";
    }

    function showSequencePlaybackCanvas(show) {
      sequencePlaybackCanvas.style.display = show ? "block" : "none";
    }

    function drawSequenceFrame(config, index) {
      const image = config?.imageElements?.[index];
      if (!image || !image.naturalWidth || !image.naturalHeight) return false;

      syncSequencePlaybackCanvasSize();
      sequencePlaybackContext.clearRect(0, 0, frameWidth, frameHeight);
      sequencePlaybackContext.drawImage(image, 0, 0, frameWidth, frameHeight);
      showSequencePlaybackCanvas(true);
      return true;
    }

    function syncSequenceLottie(config, index) {
      if (!sequenceLottieReady || !sequenceLottieAnimation || !config) return;
      if (sequenceLottieIndependentReverse) return;

      /*
        Forward playback is intentionally independent from the JPG sequence.
        The Lottie remains paused on frame zero until the delayed menu appears,
        then plays normally from beginning to end. Reverse playback retains
        the original frame synchronization while returning to the panorama.
      */
      if (sequenceDirection === 1) return;

      const imageFrameCount = Math.max(1, config.frames.length - 1);
      const progress = Math.max(0, Math.min(index / imageFrameCount, 1));
      const totalLottieFrames = Math.max(
        1,
        Math.floor(sequenceLottieAnimation.totalFrames || 1)
      );
      const targetFrame = Math.round(progress * (totalLottieFrames - 1));

      if (targetFrame !== sequenceLottieLastFrame) {
        sequenceLottieLastFrame = targetFrame;
        sequenceLottieAnimation.goToAndStop(targetFrame, true);
      }
    }

    function applySequenceFrame(config, index) {
      /*
        Drawing the already decoded frame directly avoids CSS background-image
        swaps. The same retained frame buffer is used forward and backward.
      */
      drawSequenceFrame(config, index);
      syncSequenceLottie(config, index);
    }

    function resetSequenceFrameToDefault(config) {
      const src = frames[config.frame];

      panoFrameCopies[config.frame].forEach((frameEl) => {
        frameEl.style.backgroundImage = `url("${src}")`;
        frameEl.style.removeProperty("transform");
        frameEl.style.removeProperty("z-index");
      });
    }

    function ensurePanoramaFrameReady(frameIndex) {
      const src = frames[frameIndex];
      if (!src) return Promise.resolve();
      if (panoramaFrameReadyPromises.has(src)) {
        return panoramaFrameReadyPromises.get(src);
      }

      const promise = new Promise((resolve) => {
        const image = new Image();
        const finish = async () => {
          if (image.decode) {
            try {
              await image.decode();
            } catch (error) { }
          }
          resolve();
        };

        image.onload = finish;
        image.onerror = resolve;
        image.src = src;

        if (image.complete) {
          finish();
        }
      });

      panoramaFrameReadyPromises.set(src, promise);
      return promise;
    }

    function waitForPaintFrames(count = 2) {
      return new Promise((resolve) => {
        const step = () => {
          count -= 1;
          if (count <= 0) {
            resolve();
          } else {
            requestAnimationFrame(step);
          }
        };
        requestAnimationFrame(step);
      });
    }

    function showSequenceReturnOverlay(config, index = 0) {
      const image = config?.imageElements?.[index];
      const src = image?.src || config?.frames?.[index];
      if (!src) return;

      sequenceReturnOverlay.style.left = `${-sequenceViewportCropX}px`;
      sequenceReturnOverlay.style.top = `${panoStripTop}px`;
      sequenceReturnOverlay.style.width = `${frameWidth}px`;
      sequenceReturnOverlay.style.height = `${frameHeight}px`;
      sequenceReturnOverlay.style.backgroundImage = `url("${src}")`;
      sequenceReturnOverlay.classList.remove("is-fading");
      sequenceReturnOverlay.classList.add("is-visible");
      sequenceReturnOverlay.setAttribute("aria-hidden", "false");
    }

    function hideSequenceReturnOverlayImmediately() {
      sequenceReturnTransitionToken += 1;
      sequenceReturnOverlay.classList.remove("is-visible", "is-fading");
      sequenceReturnOverlay.style.removeProperty("background-image");
      sequenceReturnOverlay.setAttribute("aria-hidden", "true");
    }

    async function completeReverseSequenceTransition(finishedSequence) {
      const transitionToken = ++sequenceReturnTransitionToken;

      /* Keep sequence frame 00 visible before changing the panorama below it. */
      showSequenceReturnOverlay(finishedSequence, 0);
      await waitForPaintFrames(1);
      showSequencePlaybackCanvas(false);

      /* Decode the panorama source first, then restore it beneath the cover. */
      await ensurePanoramaFrameReady(finishedSequence.frame);
      if (transitionToken !== sequenceReturnTransitionToken) return;

      resetSequenceFrameToDefault(finishedSequence);
      await waitForPaintFrames(3);
      await waitForDelay(70);
      if (transitionToken !== sequenceReturnTransitionToken) return;

      /* Crossfade sequence frame 00 into the matching panorama frame. */
      sequenceReturnOverlay.classList.remove("is-visible");
      sequenceReturnOverlay.classList.add("is-fading");

      await new Promise((resolve) => {
        let settled = false;
        const finish = () => {
          if (settled) return;
          settled = true;
          sequenceReturnOverlay.removeEventListener("transitionend", finish);
          resolve();
        };

        sequenceReturnOverlay.addEventListener("transitionend", finish, { once: true });
        setTimeout(finish, 800);
      });

      if (transitionToken !== sequenceReturnTransitionToken) return;

      sequenceReturnOverlay.classList.remove("is-fading");
      sequenceReturnOverlay.style.removeProperty("background-image");
      sequenceReturnOverlay.setAttribute("aria-hidden", "true");

      /* Release the completed sequence after both directions finish so later
         hotspots do not accumulate hundreds of decoded full-resolution frames. */
      releaseSequenceFrameBuffer(finishedSequence);

      activeSequence = null;
      sequenceFocusHotspot = null;
      sequenceViewportCropX = 0;
      showSequencePlaybackCanvas(false);

      /*
        Return mobile landscape to its full-height browsing composition after
        the sequence frame has blended back into the panorama. Hotspots remain
        hidden until the zoom-out is complete, preventing any visible jump.
      */
      await animatePanoramaToBrowseLayout(sequenceReturnZoomDuration);

      sequenceLottieCard.classList.remove("is-neo-lumber");
      sequenceMenuRevealed = false;
      sequenceChromeRevealStarted = false;
      sequenceBackTransitioning = false;
      sequenceLottieIndependentReverse = false;
      sequenceBackButton.disabled = false;
      showBackButton(false);
      setFrameButtonsVisible(true);
      setHotspotsVisible(true);
      releaseParallax();
      restoreThumbnailFeatureAfterSequence();
      showSequenceLottie(false);
      setMultiLottieMode(false);
      resetMultiLottieNavigation();

      if (sequenceLottieReady && sequenceLottieAnimation) {
        sequenceLottieLastFrame = 0;
        sequenceLottieAnimation.goToAndStop(0, true);
      }

      scheduleAutoRotateResume(1500);
    }

    function stopSequencePlayback() {
      sequencePlaying = false;

      if (sequenceRAF) {
        cancelAnimationFrame(sequenceRAF);
        sequenceRAF = null;
      }
    }

    function finishSequencePlayback() {
      stopSequencePlayback();

      if (!activeSequence) return;

      if (sequenceDirection === 1) {
        /*
          Forward animation finished:
          pause on the last frame, keep hotspots/buttons hidden, show only BACK.
        */
        freezePanoramaBackground();
        revealForwardSequenceMenu();
        showBackButton(true);
        setFrameButtonsVisible(false);
        setHotspotsVisible(false);
      } else {
        /*
          Reverse animation finished:
          keep sequence frame 00 visible while the panorama is decoded and
          painted underneath, then crossfade into the panorama.
        */
        const finishedSequence = activeSequence;
        showBackButton(false);
        setFrameButtonsVisible(false);
        setHotspotsVisible(false);
        completeReverseSequenceTransition(finishedSequence);
      }
    }

    function sequenceStep(now) {
      if (!sequencePlaying || !activeSequence) return;

      if (!sequenceLastTime) {
        sequenceLastTime = now;
      }

      const frameDuration = 1000 / (activeSequence.fps || 24);
      let shouldFinish = false;

      while (now - sequenceLastTime >= frameDuration) {
        sequenceLastTime += frameDuration;

        const nextIndex = sequenceCurrentIndex + sequenceDirection;

        if (nextIndex < 0) {
          sequenceCurrentIndex = 0;
          applySequenceFrame(activeSequence, sequenceCurrentIndex);
          shouldFinish = true;
          break;
        }

        if (nextIndex >= activeSequence.frames.length) {
          sequenceCurrentIndex = activeSequence.frames.length - 1;
          applySequenceFrame(activeSequence, sequenceCurrentIndex);
          shouldFinish = true;
          break;
        }

        sequenceCurrentIndex = nextIndex;
        applySequenceFrame(activeSequence, sequenceCurrentIndex);
        maybeRevealForwardSequenceMenu();
      }

      maybeRevealForwardSequenceMenu();

      if (shouldFinish) {
        finishSequencePlayback();
        return;
      }

      sequenceRAF = requestAnimationFrame(sequenceStep);
    }

    async function playSequence(config, direction = 1) {
      if (!config || sequencePlaying) return;

      if (direction === 1) {
        hideSequenceReturnOverlayImmediately();
      }

      if (direction === 1) {
        await Promise.all([
          preloadSequence(config),
          initializeSequenceLottie(config)
        ]);
      } else {
        await preloadSequence(config);
      }

      if (!config.imagesReady || config.imageElements.length !== config.frames.length) {
        throw new Error(`Sequence frame buffer is incomplete for ${config.hotspotText}.`);
      }

      activeSequence = config;
      sequenceLottieCard.classList.toggle("is-neo-lumber", config.key === "neoLumber");
      freezePanoramaBackground();
      forceParallaxNeutral();
      clearPendingArrivalCallback();

      sequenceDirection = direction;
      sequencePlaying = true;
      sequenceLastTime = 0;
      sequenceMenuRevealed = direction !== 1;
      sequenceChromeRevealStarted = direction !== 1;
      sequenceLottiePlaybackDirection = direction;

      if (direction === 1) {
        sequenceBackTransitioning = false;
        sequenceLottieIndependentReverse = false;
        sequenceBackButton.disabled = false;
        sequenceLottieCard.classList.remove("is-returning");
      }

      if (direction === 1 && isMultiLottieSequence(config)) {
        setMultiLottieMode(true);
        resetMultiLottieNavigation();
      } else if (!isMultiLottieSequence(config)) {
        setMultiLottieMode(false);
      }

      setFrameButtonsVisible(false);
      showBackButton(false);
      setHotspotsVisible(false);

      if (direction === 1) {
        /*
          Mount the card invisibly and hold the custom Lottie on frame zero.
          It begins normal playback only when the delayed menu is revealed.
        */
        if (sequenceLottieReady && sequenceLottieAnimation) {
          sequenceLottieAnimation.pause();
          sequenceLottieLastFrame = 0;
          sequenceLottieAnimation.goToAndStop(0, true);
        }
        showSequenceLottie(true, false, false);
      } else {
        /*
          The blur and controls are already fading from the delayed back-button transition.
          Keep it mounted, but do not reveal its contents again.
        */
        sequenceLottiePanel.style.display = "flex";
        sequenceLottiePanel.setAttribute("aria-hidden", "false");
      }

      if (direction === 1) {
        sequenceCurrentIndex = 0;
      } else {
        sequenceCurrentIndex = config.frames.length - 1;
      }

      applySequenceFrame(config, sequenceCurrentIndex);
      sequenceRAF = requestAnimationFrame(sequenceStep);
    }

    function startConfiguredSequence(config) {
      if (!config || sequencePlaying) return;

      sequenceFocusHotspot = null;
      sequenceViewportCropX = 0;
      infoBox.style.display = "none";
      showBackButton(false);
      clearAutoRotateRestart();
      clearPendingArrivalCallback();

      const targetFrameSize = isMobileLandscapeSequenceLayout()
        ? getCoverPanoFrameSize()
        : null;
      const responsiveOffsetX = getResponsiveSequenceOffsetX(
        config,
        targetFrameSize?.width || frameWidth
      );

      moveToFrame(config.frame, () => {
        forceParallaxNeutral();
        playSequence(config, 1);
      }, true, responsiveOffsetX, targetFrameSize);
    }

    function animate() {
      requestAnimationFrame(animate);

      hoverPauseStrength += (hoverPauseTarget - hoverPauseStrength) * 0.08;
      recentThumbnailPanSpeed *= 0.90;

      const mainPanoramaPage = isMainPanoramaPage();

      if (!mainPanoramaPage && !buttonTweenActive) {
        /* Hard lock: no delayed auto-pan and no leftover drag inertia behind a hotspot window. */
        autoRotate = false;
        panVelocity = 0;
        targetOffset = currentOffset;
      } else {
        if (autoRotate && !isDragging && !buttonTweenActive) {
          targetOffset += autoRotateSpeed * autoRotateDirection * (1 - hoverPauseStrength);
        }

        if (!isDragging && !buttonTweenActive) {
          targetOffset += panVelocity;
          panVelocity *= dragFriction;

          if (Math.abs(panVelocity) < 0.001) {
            panVelocity = 0;
          }
        }
      }

      updatePanorama();
      updateHotspots();
      updateHotspotConnector(performance.now());
      updateScenePlaneTransform();
      wrapOffsetsIfNeeded();
      updateActiveFrameButton();
    }

    container.addEventListener("pointerenter", (event) => {
      updatePointerPosition(event);
    });

    container.addEventListener("pointerleave", () => {
      clearPointerPosition();
      clearHotspotOverstates();
    });

    container.addEventListener("pointerdown", (event) => {
      updatePointerPosition(event);

      if (sequencePlaying || activeSequence || sequencePreparing) return;

      /*
        Important fix:
        Previously, if the pointer started inside the large invisible hotspot
        hit radius, this handler returned before starting a drag. That made
        panning feel frozen near hotspots. Now we still remember the possible
        hotspot click, but we always start the pan gesture. If the user moves
        more than a few pixels, it becomes a drag and the hotspot click is
        cancelled.
      */
      pendingHotspotHit = getNearestHotspotToPointer(event);

      isDragging = true;
      autoRotate = false;
      buttonTweenActive = false;

      clearAutoRotateRestart();
      clearPendingArrivalCallback();

      panVelocity = 0;
      hasDraggedThisGesture = false;
      dragStartX = event.clientX;
      dragStartY = event.clientY;
      previousMouseX = event.clientX;

      container.classList.add("dragging");

      if (container.setPointerCapture) {
        container.setPointerCapture(event.pointerId);
      }

      event.preventDefault();
    });

    container.addEventListener("pointermove", (event) => {
      updatePointerPosition(event);

      if (!isDragging || sequencePlaying || activeSequence || sequencePreparing) return;

      const deltaX = event.clientX - previousMouseX;
      recentThumbnailPanSpeed = Math.max(recentThumbnailPanSpeed, Math.abs(deltaX));

      const totalGestureDistance = Math.hypot(
        event.clientX - dragStartX,
        event.clientY - dragStartY
      );

      if (totalGestureDistance > 5) {
        hasDraggedThisGesture = true;
        pendingHotspotHit = null;
      }

      targetOffset -= deltaX * dragSensitivity;
      panVelocity = -deltaX * dragSensitivity * 0.18;

      if (Math.abs(deltaX) > 0.01) {
        autoRotateDirection = deltaX < 0 ? 1 : -1;
      }

      previousMouseX = event.clientX;
      event.preventDefault();
    });

    container.addEventListener("pointerup", (event) => {
      const hotspotToActivate = pendingHotspotHit;
      pendingHotspotHit = null;

      isDragging = false;
      container.classList.remove("dragging");

      if (container.hasPointerCapture && container.hasPointerCapture(event.pointerId)) {
        container.releasePointerCapture(event.pointerId);
      }

      if (hotspotToActivate && !hasDraggedThisGesture && !sequencePlaying && !activeSequence) {
        activateHotspot(hotspotToActivate);
        event.preventDefault();
        return;
      }

      if (hasDraggedThisGesture) {
        scheduleAutoRotateResume(1000);
      }

      event.preventDefault();
    });

    container.addEventListener("pointercancel", (event) => {
      pendingHotspotHit = null;
      isDragging = false;
      container.classList.remove("dragging");

      if (container.hasPointerCapture && container.hasPointerCapture(event.pointerId)) {
        container.releasePointerCapture(event.pointerId);
      }

      if (hasDraggedThisGesture) {
        scheduleAutoRotateResume(1000);
      }
    });

    let viewportResizeRAF = null;

    function handleViewportResize() {
      if (viewportResizeRAF) {
        cancelAnimationFrame(viewportResizeRAF);
      }

      viewportResizeRAF = requestAnimationFrame(() => {
        viewportResizeRAF = null;

        /*
          Crossing into or out of the compact dropdown layout must never retain
          an old open state. This prevents a menu opened at one viewport size
          from reappearing automatically after the browser is resized again.
        */
        const compactHotspotMenuLayoutNow = compactHotspotMenuMediaQuery.matches;
        if (compactHotspotMenuLayoutNow !== compactHotspotMenuLayoutActive) {
          closeMobileHotspotMenu();
          compactHotspotMenuLayoutActive = compactHotspotMenuLayoutNow;
        }

        const normalizedPosition = currentOffset / totalWidth;

        syncPanoFrameWidthCSS();

        currentOffset = normalizedPosition * totalWidth;
        targetOffset = currentOffset;

        buttonTweenActive = false;
        buttonTweenZoomActive = false;
        clearPendingArrivalCallback();

        /*
          If Safari's visible viewport changes while a sequence is open, retain
          cover mode and recalculate the exact sequence/panorama alignment.
        */
        if (activeSequence) {
          sequenceCameraZoomed = true;
          applyPanoFrameSize(getCoverPanoFrameSize());
          updateSequenceViewportCrop(sequenceFocusHotspot, activeSequence);
          const destinationOffsetX =
            getResponsiveSequenceOffsetX(activeSequence, frameWidth) +
            sequenceViewportCropX;
          currentOffset =
            getClosestOffsetForFrame(activeSequence.frame) + destinationOffsetX;
          targetOffset = currentOffset;
          applySequenceFrame(activeSequence, sequenceCurrentIndex);
        }

        updateHotspots();
        updateHotspotConnector();
        updateActiveFrameButton();
      });
    }

    sequenceLearnMore.addEventListener("click", (event) => {

      sequenceLearnMore.addEventListener(eventName, (event) => {
        event.stopPropagation();
      });

    sequenceBackButton.addEventListener("click", async (event) => {
      event.preventDefault();
      event.stopPropagation();

      if (
        sequencePlaying ||
        !activeSequence ||
        metalCraftTransitioning ||
        sequenceBackTransitioning
      ) return;

      const sequenceToReverse = activeSequence;
      sequenceBackTransitioning = true;
      sequenceBackButton.disabled = true;
      metalCraftNavigationToken += 1;

      /*
        A secondary METAL CRAFT or SOFFIT page must never be used for the
        panorama-return animation. Restore the hotspot's original Lottie at
        its completed frame, then reverse only that primary animation.
      */
      const returnPageSet = getMultiLottiePageSet(sequenceToReverse);
      const primaryReturnPage = returnPageSet?.pages?.[0];

      if (
        primaryReturnPage &&
        sequenceLottieActiveKey !== primaryReturnPage.key
      ) {
        const primaryReady = await preparePrimaryMultiLottieForPanoramaReturn();

        if (
          !primaryReady ||
          activeSequence !== sequenceToReverse
        ) {
          sequenceBackTransitioning = false;
          sequenceBackButton.disabled = false;
          sequenceLottieIndependentReverse = false;
          return;
        }
      }

      /*
        Reverse only the primary hotspot Lottie. It remains fully visible for
        1 second before the grouped window starts shrinking/fading and the JPG
        image sequence begins its reverse playback behind it.
      */
      if (sequenceLottieReady && sequenceLottieAnimation) {
        const finalFrame = Math.max(
          0,
          Math.floor(sequenceLottieAnimation.totalFrames || 1) - 1
        );
        const currentFrame = Number(sequenceLottieAnimation.currentFrame || 0);

        sequenceLottieIndependentReverse = true;
        sequenceLottiePlaybackDirection = -1;
        sequenceLottieAnimation.pause();
        sequenceLottieAnimation.setSpeed(2);
        sequenceLottieAnimation.setDirection(-1);

        if (currentFrame <= 0.5) {
          sequenceLottieAnimation.goToAndPlay(finalFrame, true);
        } else {
          sequenceLottieAnimation.play();
        }
      }

      await waitForDelay(1000);

      if (activeSequence !== sequenceToReverse) {
        sequenceBackTransitioning = false;
        sequenceBackButton.disabled = false;
        sequenceLottieIndependentReverse = false;
        return;
      }

      /*
        At 1 second, begin fading only the blurred background and controls.
        The reversing primary Lottie remains visible while the hotspot JPG
        sequence begins reversing behind it.
      */
      setSequenceChromeVisible(false);
      sequenceLottieCard.classList.add("is-returning");
      playSequence(sequenceToReverse, -1);
    });

    [sequenceBackButton].forEach((button) => {
      ["pointerdown", "pointermove", "pointerup"].forEach((eventName) => {

    metalCraftPrevButton.addEventListener("click", (event) => {
