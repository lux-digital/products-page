    metalCraftNextButton.addEventListener("click", (event) => {
      event.stopPropagation();
      navigateMultiLottieOptions(1);
    });

    [metalCraftPrevButton, metalCraftNextButton].forEach((button) => {
      ["pointerdown", "pointermove", "pointerup"].forEach((eventName) => {
        button.addEventListener(eventName, (event) => {
          event.stopPropagation();
        });
      });
    });

    function activateHotspot(hotspot) {
      if (sequencePlaying || activeSequence || sequencePreparing) return;

      const hotspotKey = normalizeHotspotKey(hotspot.text || hotspot.label || hotspot.title);
      const config = hotspot.sequenceKey
        ? sequenceByKey.get(hotspot.sequenceKey)
        : sequenceByHotspotText.get(hotspotKey);

      freezePanoramaBackground();

      clearPendingArrivalCallback();
      showBackButton(false);
      infoBox.style.display = "none";
      hideThumbnailFeatureForSequence();

      if (!config) {
        sequenceFocusHotspot = null;
        sequenceViewportCropX = 0;
        moveToFrame(hotspot.frame, () => {
          document.getElementById("infoTitle").textContent =
            hotspot.text || hotspot.title;
          document.getElementById("infoText").textContent =
            "Image sequence coming soon.";
          infoBox.style.display = "block";
        });
        return;
      }

      /*
        Start decoding the JPG sequence and preparing the Lottie immediately,
        while the panorama is still panning to the correct matching frame.
      */
      sequencePreparing = true;
      const preparationToken = ++sequencePreparationToken;
      let assetsSettled = false;
      const assetsPromise = prepareSequenceAssets(config).finally(() => {
        assetsSettled = true;

        if (preparationToken === sequencePreparationToken) {
          if (sequenceLoadingTimer) {
            clearTimeout(sequenceLoadingTimer);
            sequenceLoadingTimer = null;
          }
          /* Hide the overlay the instant the sequence is ready. */
          showSequenceLoading(false);
        }
      });

      /*
        Match the camera landing to the sequence's source alignment, then add
        the portrait-only crop that centres the selected hotspot as closely as
        full-screen coverage allows. The decoded canvas and return overlay use
        the same crop, so frame 00 cannot jump when playback begins or ends.
      */
      sequenceFocusHotspot = hotspot;
      updateSequenceViewportCrop(hotspot, config);
      const targetFrameSize = isMobileLandscapeSequenceLayout()
        ? getCoverPanoFrameSize()
        : null;
      const destinationOffsetX =
        getResponsiveSequenceOffsetX(
          config,
          targetFrameSize?.width || frameWidth
        ) + sequenceViewportCropX;

      /*
        Do not reveal LOADING during the camera move. Only show it if the pan has
        finished, another 0.5 seconds has elapsed, and the assets are still not
        ready. Since moveToFrame already includes a small settle pause before its
        callback, schedule from the tween start for exact pan-end timing.
      */
      sequenceLoadingTimer = setTimeout(() => {
        if (
          preparationToken === sequencePreparationToken &&
          sequencePreparing &&
          !assetsSettled
        ) {
          showSequenceLoading(true);
        }
      }, buttonTweenDuration + sequenceLoadingDelayAfterPan);

      moveToFrame(hotspot.frame, async () => {
        try {
          await assetsPromise;
        } catch (error) {
          if (preparationToken !== sequencePreparationToken) return;

          sequencePreparing = false;
          sequenceFocusHotspot = null;
          sequenceViewportCropX = 0;
          showSequenceLoading(false);
          await animatePanoramaToBrowseLayout(700);
          setFrameButtonsVisible(true);
          setHotspotsVisible(true);
          restoreThumbnailFeatureAfterSequence();
          document.getElementById("infoTitle").textContent = hotspot.text || hotspot.title;
          document.getElementById("infoText").textContent =
            "The image sequence could not finish loading. Please check the frame filenames and try again.";
          infoBox.style.display = "block";
          scheduleAutoRotateResume(1500);
          return;
        }

        if (preparationToken !== sequencePreparationToken) return;

        sequencePreparing = false;
        showSequenceLoading(false);
        forceParallaxNeutral();
        playSequence(config, 1);
      }, false, destinationOffsetX, targetFrameSize);
    }

    hotspots.forEach((hotspot) => {

    function setPanToggleVisible(visible) {

    function hideThumbnailFeatureForSequence() {
      thumbnailsWereOpenBeforeSequence = hotspotConnectorEnabled;

      setPanToggleVisible(false);

      hotspotFocusCircle.style.display = "none";
      hideConnectorPair(hotspotConnectorLineA, hotspotConnectorDotA, hotspotConnectorPulseA);
      hideConnectorPair(hotspotConnectorLineB, hotspotConnectorDotB, hotspotConnectorPulseB);
      hideAllThumbnails();
    }

    function restoreThumbnailFeatureAfterSequence() {
      setPanToggleVisible(true);
      hotspotFocusCircle.style.display = "";

      if (thumbnailsWereOpenBeforeSequence) {
        hotspotConnectorEnabled = true;
        hotspotFocusCircle.classList.remove("is-disabled");
        setHotspotFocusCloseToCollapse();

        connectorTransitionStart = performance.now();
        connectorOutgoingHotspot = null;
        connectorTransitioning = true;

        if (connectorActiveHotspot) {
          [hotspotFocusThumbnailA, hotspotFocusThumbnailB].forEach((element) => {
            element.style.removeProperty("opacity");
          });

          currentThumbnailKey = "";
          setActiveHotspotButton(connectorActiveHotspot);
          updateHotspotThumbnail(connectorActiveHotspot, true);
        }
      } else {
        hotspotConnectorEnabled = false;
        hotspotFocusCircle.classList.add("is-disabled");
        setHotspotFocusCloseToShow();
        hideConnectorPair(hotspotConnectorLineA, hotspotConnectorDotA, hotspotConnectorPulseA);
        hideConnectorPair(hotspotConnectorLineB, hotspotConnectorDotB, hotspotConnectorPulseB);
        hideAllThumbnails();
      }
    }

    hotspotFocusClose.addEventListener("click", (event) => {
      event.stopPropagation();
      hotspotConnectorEnabled = !hotspotConnectorEnabled;

      if (!hotspotConnectorEnabled) {
        hotspotFocusCircle.classList.add("is-disabled");
        setHotspotFocusCloseToShow();
        hideConnectorPair(hotspotConnectorLineA, hotspotConnectorDotA, hotspotConnectorPulseA);
        hideConnectorPair(hotspotConnectorLineB, hotspotConnectorDotB, hotspotConnectorPulseB);
        hideAllThumbnails();
        setActiveHotspotButton(null);
      } else {
        hotspotFocusCircle.classList.remove("is-disabled");
        setHotspotFocusCloseToCollapse();
        connectorTransitionStart = performance.now();
        connectorOutgoingHotspot = null;
        connectorTransitioning = true;

        if (connectorActiveHotspot) {
          [hotspotFocusThumbnailA, hotspotFocusThumbnailB].forEach((element) => {
            element.style.removeProperty("opacity");
          });

          currentThumbnailKey = "";
          setActiveHotspotButton(connectorActiveHotspot);
          updateHotspotThumbnail(connectorActiveHotspot, true);
        }
      }
    });

    hotspotConnectorEnabled = false;
    hotspotFocusCircle.classList.remove("is-disabled");
    setHotspotFocusCloseToCollapse();
    setMultiLottieMode(false);
    resetMultiLottieNavigation();

    buildPanoramaStrip();
    updatePanorama();
    updateHotspots();
    animate();

    revealInitialThumbnailFeature();
  </script>
</body>

</html>
