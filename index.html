<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panorama Viewer</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #viewer {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: grab;
      overflow: hidden;
      background: #000;
      touch-action: none;
      user-select: none;
    }

    #viewer.dragging {
      cursor: grabbing;
    }

    #scenePlane {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform: none;
      pointer-events: none;
    }

    #scenePlane .hotspot {
      pointer-events: auto;
    }

    #panoramaStrip {
      position: absolute;
      left: 0;
      top: var(--pano-strip-top, 0px);
      height: var(--pano-frame-height, 100vh);
      display: flex;
      filter: brightness(var(--pano-brightness, 1));
      will-change: transform, filter;
    }

    .panoFrame {
      position: relative;
      height: var(--pano-frame-height, 100vh);
      flex: 0 0 var(--pano-frame-width, calc(100vh * 16 / 9));
      background-position: center center;
      background-size: 100% 100%;
      background-repeat: no-repeat;
    }

    .hotspot {
      position: absolute;
      width: 37.8px;
      height: 37.8px;
      border-radius: 50%;
      background: rgba(128,128,128,0.3);
      border: none;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transform: translate(-50%, -50%) scale(var(--hotspot-scale, 0.42));
      transform-origin: center center;
      cursor: pointer;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0;
      line-height: 1;
      user-select: none;
      transition: opacity 0.22s ease, background 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease;
      will-change: transform, opacity;
      overflow: visible;
    }


    .hotspot::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 37.8px;
      height: 37.8px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,0.18);
      transform: translate(-50%, -50%) scale(0.82);
      opacity: 0.7;
      pointer-events: none;
      z-index: 1;
      animation: hotspotPulse 2.85s ease-out infinite;
    }

    @keyframes hotspotPulse {
      0% {
        transform: translate(-50%, -50%) scale(0.82);
        opacity: 0.7;
      }
      45% {
        transform: translate(-50%, -50%) scale(2.0);
        opacity: 0;
      }
      100% {
        transform: translate(-50%, -50%) scale(2.0);
        opacity: 0;
      }
    }

    .hotspot::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 17px;
      height: 17px;
      border-radius: 50%;
      background: rgba(255,255,255,0.5);
      box-shadow: 0 2px 9px rgba(0,0,0,0.28);
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 2;
    }

    .hotspotLabel {
      position: absolute;
      left: 50%;
      top: 50%;
      transform:
        translate(-50%, calc(-50% - var(--label-distance, 52px)))
        scale(var(--label-counter-scale, 1));
      transform-origin: center center;
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      line-height: 1;
      white-space: nowrap;
      opacity: var(--hotspot-label-opacity, 0);
      pointer-events: none;
      text-shadow: 0 2px 8px rgba(0,0,0,0.65);
      transition: opacity 0.16s ease;
      will-change: transform, opacity;
      z-index: 3;
    }

    .hotspot:hover,
    .hotspot.is-over {
      background: rgba(255,255,255,0.42);
      border-color: rgba(255,255,255,0.94);
      box-shadow: 0 0 18px rgba(255,255,255,0.28), 0 10px 28px rgba(0,0,0,0.24);
    }

    .hotspot:hover::after,
    .hotspot.is-over::after {
      background: #fff;
      box-shadow: 0 0 0 4px rgba(255,255,255,0.28), 0 0 18px rgba(255,255,255,0.38), 0 5px 16px rgba(0,0,0,0.34);
    }

    #frameButtons {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);
      z-index: 15;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 4px 22px;
      width: max-content;
      max-width: min(1180px, calc(100vw - 40px));
      padding: 12px 22px;
      border-radius: 18px;
      background: rgba(0, 0, 0, 0.20);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      opacity: 1;
      pointer-events: auto;
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    #frameButtons.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%) translateY(12px);
    }

    .frameButton {
      position: relative;
      min-width: 0;
      height: 34px;
      padding: 0 0 7px;
      border: none;
      outline: none;
      border-radius: 0;
      background: transparent;
      color: rgba(255,255,255,0.66);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.055em;
      cursor: pointer;
      white-space: nowrap;
      opacity: 0.72;
      transition:
        color 0.32s ease-in-out,
        opacity 0.32s ease-in-out,
        transform 0.32s ease-in-out,
        text-shadow 0.32s ease-in-out;
    }

    .frameButton::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 100%;
      height: 2px;
      border-radius: 999px;
      background: rgba(255,255,255,0.98);
      opacity: 0;
      transform: translateX(-50%) scaleX(0);
      transform-origin: center center;
      transition:
        transform 0.42s cubic-bezier(0.65, 0, 0.35, 1),
        opacity 0.22s ease-in-out;
    }

    .frameButton:hover,
    .frameButton:focus-visible {
      color: #fff;
      opacity: 0.92;
      transform: translateY(-1px);
    }

    .frameButton.active {
      color: #fff;
      opacity: 1;
      transform: translateY(-2px);
      text-shadow: 0 0 12px rgba(255,255,255,0.45);
    }

    .frameButton.active::after {
      opacity: 1;
      transform: translateX(-50%) scaleX(1);
    }

    #sequenceBackButton {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);
      z-index: 20;
      display: none;
      padding: 12px 24px;
      border: 1px solid rgba(255,255,255,0.9);
      border-radius: 999px;
      background: rgba(0,0,0,0.24);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      cursor: pointer;
      box-shadow: none;
      transition:
        transform 0.22s ease,
        background 0.22s ease;
    }

    #sequenceBackButton:hover {
      transform: translateX(-50%) scale(1.05);
      background: rgba(0,0,0,0.38);
    }

    #infoBox {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(420px, 86vw);
      padding: 28px;
      background: rgba(255,255,255,0.95);
      color: #111;
      border-radius: 18px;
      z-index: 20;
      display: none;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
      text-align: center;
    }

    #closeInfo {
      margin-top: 20px;
      padding: 10px 18px;
      border: none;
      border-radius: 999px;
      background: #111;
      color: white;
      cursor: pointer;
    }


    #sequenceLottiePanel {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 19;
      display: none;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    #sequenceLottieCard {
      position: relative;
      isolation: isolate;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 22px 28px 26px;
      border-radius: 28px;
      background: transparent;
      pointer-events: none;
    }

    #sequenceLottieCard::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      border-radius: inherit;
      background: rgba(0,0,0,0.42);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 18px 55px rgba(0,0,0,0.28);
      opacity: 0;
      transition: opacity 0.58s ease-in-out;
    }

    #sequenceLottieCard.is-chrome-visible::before {
      opacity: 1;
    }

    #sequenceLottie {
      width: min(1040px, 88vw);
      height: min(600px, 68vh);
      pointer-events: none;
    }

    #sequenceLearnMore {
      margin-top: 12px;
      padding: 12px 24px;
      border: 1px solid rgba(255,255,255,0.9);
      border-radius: 999px;
      background: rgba(0,0,0,0.24);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      cursor: pointer;
      pointer-events: none;
      opacity: 0;
      transform: translateY(9px);
      transition:
        opacity 0.52s ease-in-out,
        transform 0.52s ease-in-out,
        background 0.22s ease;
    }

    #sequenceLottieCard.is-chrome-visible #sequenceLearnMore {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    #sequenceLottieCard.is-chrome-visible #sequenceLearnMore:hover {
      transform: translateY(0) scale(1.05);
      background: rgba(0,0,0,0.38);
    }


    #sequenceLoadingOverlay {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 18px 22px;
      border-radius: 18px;
      background: rgba(0,0,0,0.30);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.09em;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition:
        opacity 0.24s ease,
        visibility 0.24s ease;
    }

    #sequenceLoadingOverlay.is-visible {
      opacity: 1;
      visibility: visible;
    }

    #sequenceLoadingSpinner {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.25);
      border-top-color: #fff;
      animation: sequenceLoadingSpin 0.9s linear infinite;
    }

    @keyframes sequenceLoadingSpin {
      to { transform: rotate(360deg); }
    }

    #panToggleButton {
      position: fixed;
      left: 50%;
      top: 18px;
      bottom: auto;
      transform: translateX(-50%);
      z-index: 18;
      width: 44px;
      height: 44px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.20);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    #panToggleButton:hover {
      background: rgba(0, 0, 0, 0.32);
      transform: translateX(-50%) scale(1.05);
    }

    #panToggleButton svg {
      width: 19px;
      height: 19px;
      fill: currentColor;
      pointer-events: none;
    }

    #hotspotConnectorOverlay {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 14;
      pointer-events: none;
      overflow: visible;
    }

    .hotspotConnectorLine {
      stroke: rgba(255,255,255,0.95);
      stroke-width: 1.5;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
      opacity: 0;
    }

    .hotspotConnectorDot {
      fill: #fff;
      opacity: 0;
    }

    #hotspotFocusCircle {
      position: fixed;
      left: 50%;
      bottom: 104px;
      transform: translateX(-50%) scale(1);
      transform-origin: center center;
      width: 156px;
      height: 156px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.95);
      background: rgba(0,0,0,0.20);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 15;
      pointer-events: none;
      box-sizing: border-box;
      overflow: visible;
      transition:
        opacity 0.48s ease-out,
        visibility 0.48s ease-out,
        transform 0.48s cubic-bezier(0.22, 1, 0.36, 1),
        background 0.25s ease,
        border-color 0.25s ease,
        backdrop-filter 0.25s ease;
    }


    #hotspotFocusCircle.startup-hidden {
      opacity: 0;
      visibility: hidden;
      transform: translateX(-50%) scale(0.78);
    }

    #hotspotThumbnailStage {
      position: absolute;
      left: 7px;
      right: 7px;
      bottom: 6px;
      height: 190%;
      pointer-events: auto;
      cursor: pointer;
      overflow: hidden;
      /*
        This creates the blue-mask shape from your sketch:
        straight vertical sides, open above the circle, and a rounded bottom
        that sits just inside the circle.
      */
      border-radius: 0 0 999px 999px;
      perspective: 900px;
      transform-style: preserve-3d;
    }

    .hotspotFocusThumbnail {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center bottom;
      transform: translateX(-50%) rotateY(0deg);
      transform-origin: center center;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      backface-visibility: hidden;
      will-change: transform;
      transition-property: transform;
      transition-duration: 0.95s;
    }


    .hotspotFocusThumbnail.startup-thumbnail {
      opacity: 0;
      visibility: visible;
      transform: translateX(-50%) rotateY(0deg) scale(0.78);
      transition: none;
    }

    .hotspotFocusThumbnail.startup-thumbnail.startup-thumbnail-show {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) rotateY(0deg) scale(1);
      transition:
        opacity 0.5s ease-out,
        transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .hotspotFocusThumbnail.is-visible {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) rotateY(0deg);
    }

    /*
      Front-view flip:
      the left edge turns away while the right edge turns toward the viewer.
    */
    .hotspotFocusThumbnail.is-exiting {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) rotateY(-90deg);
      transition-timing-function: cubic-bezier(0.42, 0, 1, 1);
    }

    /*
      The incoming image completes the same flip motion from the opposite side.
    */
    .hotspotFocusThumbnail.is-entering {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) rotateY(90deg);
      transition: none;
    }

    .hotspotFocusThumbnail.is-entering.is-flipping-in {
      transform: translateX(-50%) rotateY(0deg);
      transition-property: transform;
      transition-timing-function: cubic-bezier(0, 0, 0.58, 1);
    }

    #hotspotFocusClose {
      position: absolute;
      top: -30px;
      right: -30px;
      width: 30px;
      height: 30px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: rgba(255,255,255,0.50);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #000;
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      pointer-events: auto;
      box-shadow: 0 4px 14px rgba(0,0,0,0.28);
      white-space: nowrap;
      transition:
        transform 0.2s ease,
        width 0.25s ease,
        height 0.25s ease,
        border-radius 0.25s ease,
        top 0.25s ease,
        right 0.25s ease,
        left 0.25s ease,
        background 0.25s ease,
        color 0.25s ease,
        font-size 0.25s ease;
    }

    #hotspotFocusClose:hover {
      transform: scale(1.06);
    }

    #hotspotFocusCircle.is-disabled {
      background: transparent;
      border-color: transparent;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }

    #hotspotFocusCircle.is-disabled .hotspotFocusThumbnail {
      opacity: 0 !important;
    }

    #hotspotFocusCircle.is-disabled #hotspotThumbnailStage {
      pointer-events: none;
      cursor: default;
    }

    #hotspotFocusCircle.is-disabled #hotspotFocusClose {
      left: 50%;
      right: auto;
      top: auto;
      bottom: 0;
      width: 154px;
      height: 36px;
      border-radius: 999px;
      transform: translate(-50%, 0);
      background: rgba(0,0,0,0.20);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #fff;
      font-size: 11px;
      letter-spacing: 0.055em;
    }

    #hotspotFocusCircle.is-disabled #hotspotFocusClose:hover {
      transform: translate(-50%, 0) scale(1.04);
    }

    @media (max-width: 600px) {
      #frameButtons {
        bottom: 18px;
        gap: 2px 14px;
        max-width: calc(100vw - 24px);
        padding: 10px 14px;
        border-radius: 14px;
      }

      .frameButton {
        min-width: auto;
        height: 28px;
        padding: 0;
        font-size: 9px;
      }

      #sequenceBackButton {
        bottom: 18px;
        padding: 11px 22px;
        font-size: 13px;
      }

      #sequenceLottieCard {
        padding: 16px 16px 20px;
        border-radius: 22px;
      }

      #sequenceLottie {
        width: min(840px, 90vw);
        height: min(480px, 58vh);
      }

      #sequenceLearnMore {
        margin-top: 8px;
        padding: 10px 20px;
        font-size: 10px;
      }

      #panToggleButton {
        left: 50%;
        top: 12px;
        bottom: auto;
        width: 40px;
        height: 40px;
      }

      #hotspotFocusCircle {
        bottom: 92px;
        width: 124px;
        height: 124px;
      }

    }

    /*
      Refined touch-device layout.
      This catches phones and tablets in landscape as well as portrait,
      rather than relying only on viewport width.
    */
    @media (hover: none) and (pointer: coarse), (max-width: 700px) {
      #frameButtons {
        left: max(12px, env(safe-area-inset-left));
        right: max(12px, env(safe-area-inset-right));
        bottom: max(10px, env(safe-area-inset-bottom));
        width: auto;
        max-width: none;
        transform: none;
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        justify-content: stretch;
        gap: 3px 10px;
        padding: 9px 12px;
        box-sizing: border-box;
        border-radius: 14px;
      }

      #frameButtons.hidden {
        transform: translateY(12px);
      }

      .frameButton {
        width: 100%;
        min-width: 0;
        height: 25px;
        padding: 0 1px 5px;
        font-size: clamp(7px, 2.15vw, 10px);
        letter-spacing: 0.035em;
        text-align: center;
        overflow: hidden;
        text-overflow: clip;
      }

      #panToggleButton {
        top: max(10px, env(safe-area-inset-top));
      }

      #hotspotFocusClose {
        width: 26px;
        height: 26px;
        top: -22px;
        right: -22px;
        font-size: 16px;
      }

      #sequenceBackButton {
        left: max(12px, env(safe-area-inset-left));
        top: max(12px, env(safe-area-inset-top));
        bottom: auto;
        transform: none;
        padding: 9px 17px;
        font-size: 10px;
        z-index: 24;
      }

      #sequenceBackButton:hover {
        transform: scale(1.04);
      }

      #sequenceLottiePanel {
        inset: 0;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        transform: none;
        padding:
          max(54px, calc(env(safe-area-inset-top) + 46px))
          max(12px, env(safe-area-inset-right))
          max(12px, env(safe-area-inset-bottom))
          max(12px, env(safe-area-inset-left));
        box-sizing: border-box;
      }

      #sequenceLottieCard {
        max-width: 100%;
        max-height: 100%;
        box-sizing: border-box;
      }
    }

    /* Phone/tablet portrait */
    @media (hover: none) and (pointer: coarse) and (orientation: portrait),
           (max-width: 700px) and (orientation: portrait) {
      #frameButtons {
        bottom: max(12px, env(safe-area-inset-bottom));
        gap: 4px 7px;
        padding: 10px 10px;
      }

      .frameButton {
        font-size: clamp(7px, 2.35vw, 9px);
      }

      /*
        Keep a clear band of negative space between the button tray and
        thumbnail circle.
      */
      #hotspotFocusCircle {
        width: clamp(108px, 30vw, 132px);
        height: clamp(108px, 30vw, 132px);
        bottom: calc(max(12px, env(safe-area-inset-bottom)) + 116px);
      }

      #sequenceLottieCard {
        width: min(94vw, 520px);
        max-height: calc(100vh - 92px);
        max-height: calc(100dvh - 92px);
        padding: 12px 12px 12px 14px;
        border-radius: 20px;
        flex-direction: row;
        align-items: center;
        gap: 10px;
      }

      #sequenceLottie {
        width: min(68vw, 360px);
        height: min(52vh, 440px);
        height: min(52dvh, 440px);
        flex: 0 1 auto;
      }

      #sequenceLearnMore {
        margin: 0;
        flex: 0 0 auto;
        max-width: 104px;
        padding: 10px 12px;
        font-size: 9px;
        line-height: 1.25;
        white-space: normal;
        text-align: center;
      }
    }

    /* Phone/tablet landscape */
    @media (hover: none) and (pointer: coarse) and (orientation: landscape),
           (max-height: 600px) and (orientation: landscape) {
      #frameButtons {
        left: max(14px, env(safe-area-inset-left));
        right: max(14px, env(safe-area-inset-right));
        bottom: max(8px, env(safe-area-inset-bottom));
        gap: 2px 12px;
        padding: 7px 12px;
        border-radius: 13px;
      }

      .frameButton {
        height: 22px;
        padding-bottom: 4px;
        font-size: clamp(7px, 1.25vw, 9px);

    /*
      Mobile sequence-card refinements, applied after the earlier responsive

    /*
      LANDSCAPE: one compact horizontal card. The Lottie and LEARN MORE button

    */
    @media (hover: none) and (pointer: coarse) and (orientation: landscape),
           (max-height: 600px) and (orientation: landscape) {

    @media (hover: none) and (pointer: coarse) and (orientation: landscape) and (max-height: 430px) {

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
  <script>
    const container = document.getElementById("viewer");
    const scenePlane = document.getElementById("scenePlane");
    const panoramaStrip = document.getElementById("panoramaStrip");
    const frameButtonsWrapper = document.getElementById("frameButtons");
    let frameButtons = [];
    const sequenceBackButton = document.getElementById("sequenceBackButton");
    const sequenceLottiePanel = document.getElementById("sequenceLottiePanel");
    const sequenceLottieContainer = document.getElementById("sequenceLottie");
    const sequenceLottieCard = document.getElementById("sequenceLottieCard");
    const sequenceLearnMore = document.getElementById("sequenceLearnMore");
    const sequenceLoadingOverlay = document.getElementById("sequenceLoadingOverlay");
    const infoBox = document.getElementById("infoBox");
    const panToggleButton = document.getElementById("panToggleButton");
    const hotspotConnectorLineA = document.getElementById("hotspotConnectorLineA");
    const hotspotConnectorDotA = document.getElementById("hotspotConnectorDotA");
    const hotspotConnectorLineB = document.getElementById("hotspotConnectorLineB");
    const hotspotConnectorDotB = document.getElementById("hotspotConnectorDotB");
    const hotspotFocusCircle = document.getElementById("hotspotFocusCircle");
    const hotspotFocusThumbnailA = document.getElementById("hotspotFocusThumbnailA");
    const hotspotFocusThumbnailB = document.getElementById("hotspotFocusThumbnailB");
    const hotspotFocusClose = document.getElementById("hotspotFocusClose");

    let hotspotConnectorEnabled = true;
    let thumbnailsWereOpenBeforeSequence = false;
    let currentThumbnailKey = "";
    let activeThumbnailElement = hotspotFocusThumbnailA;
    let inactiveThumbnailElement = hotspotFocusThumbnailB;
    let thumbnailSwapToken = 0;
    let recentThumbnailPanSpeed = 0;
    let connectorActiveHotspot = null;
    let connectorOutgoingHotspot = null;
    let connectorTransitionStart = 0;
    let connectorTransitioning = false;
    const connectorTransitionDuration = 850;

    const frameFolder = "180";
    const frameCount = 3;
    const panoFrameAspectRatio = 16 / 9;

    const frames = Array.from({ length: frameCount }, (_, i) => {
      return `${frameFolder}/frame${String(i).padStart(4, "0")}.jpg`;
    });

    /*
      Sequence setup.
      Button numbers are one higher than frame indexes:
      - Button 1 = frame index 0 = RANDOM PLANK sequence
      - Button 2 = frame index 1 = BOARD + BATTEN sequence
      - Button 3 = frame index 2 = NEO LUMBER sequence

      To add more later, add another object here with:
      frame, hotspotText, folder, prefix, count
    */
    /*
      Each unique hotspot has a 30-frame JPG sequence.

      Folder: hotspot title
      Files:  hotspot title + 00 through 29

      Examples:
      CUSTOM CUT/CUSTOM CUT00.jpg
      CUSTOM CUT/CUSTOM CUT29.jpg
    */
    const sequenceConfigs = [
      { key: "customCut",     frame: 0, hotspotText: "CUSTOM CUT",      folder: "CUSTOM CUT",      prefix: "CUSTOM CUT",      count: 30, pad: 2, extension: "jpg", fps: 24 },
      { key: "randomPlank",   frame: 0, hotspotText: "RANDOM PLANK",    folder: "RANDOM PLANK",    prefix: "RANDOM PLANK",    count: 30, pad: 2, extension: "jpg", fps: 24 },
      { key: "metalCraft",    frame: 0, hotspotText: "METAL CRAFT",     folder: "METAL CRAFT",     prefix: "METAL CRAFT",     count: 30, pad: 2, extension: "jpg", fps: 24 },
      { key: "boardBatten",   frame: 1, hotspotText: "BOARD + BATTEN",  folder: "BOARD + BATTEN",  prefix: "BOARD + BATTEN",  count: 30, pad: 2, extension: "jpg", fps: 24 },
      { key: "soffit",        frame: 1, hotspotText: "SOFFIT",          folder: "SOFFIT",          prefix: "SOFFIT",          count: 30, pad: 2, extension: "jpg", fps: 24 },
      { key: "luxLap",        frame: 1, hotspotText: "LUX LAP",         folder: "LUX LAP",         prefix: "LUX LAP",         count: 30, pad: 2, extension: "jpg", fps: 24 },
      { key: "channelSiding", frame: 2, hotspotText: "CHANNEL SIDING",  folder: "CHANNEL SIDING",  prefix: "CHANNEL SIDING",  count: 30, pad: 2, extension: "jpg", fps: 24 },
      { key: "neoLumber",     frame: 2, hotspotText: "NEO LUMBER",      folder: "NEO LUMBER",      prefix: "NEO LUMBER",      count: 30, pad: 2, extension: "jpg", fps: 24 }
    ];

    const sequenceByFrame = new Map();
    const sequenceByHotspotText = new Map();

    function normalizeHotspotKey(value) {
      return String(value || "")
        .trim()
        .toUpperCase()
        .replace(/[^A-Z0-9]/g, "");
    }

    sequenceConfigs.forEach((config) => {
      config.frames = Array.from({ length: config.count }, (_, i) => {
        return `${config.folder}/${config.prefix}${String(i).padStart(config.pad, "0")}.${config.extension}`;
      });

      config.imagesReady = false;
      config.imagesLoading = false;
      config.imageElements = [];

      sequenceByFrame.set(config.frame, config);
      sequenceByHotspotText.set(normalizeHotspotKey(config.hotspotText), config);
    });

    let autoRotate = true;
    let userPausedAutoRotate = false;
    let autoRotateDirection = 1;
    let isDragging = false;
    let hotspotsVisible = true;

    let currentOffset = 0;
    let targetOffset = 0;
    let panVelocity = 0;

    let previousMouseX = 0;
    let dragStartX = 0;
    let dragStartY = 0;
    let hasDraggedThisGesture = false;

    let pointerX = -9999;
    let pointerY = -9999;
    let pointerInsideViewer = false;

    const parallaxMaxAngle = 4.5;
    const parallaxPerspective = 1400;
    const parallaxEase = 0.075;
    let parallaxCurrentAngle = 0;
    let parallaxTargetAngle = 0;
    let parallaxLockedToNeutral = false;
    let parallaxReturnActive = false;
    let parallaxReturnStartAngle = 0;
    let parallaxReturnStartTime = 0;
    let parallaxReturnDuration = 0;

    // Large click radius keeps small hotspots easy to activate.
    // The overstate radius only brightens the hotspot and no longer changes scale.
    const hotspotHitRadius = 290;
    const hotspotOverstateRadius = 70;

    let hoverPauseTarget = 0;
    let hoverPauseStrength = 0;
    let pendingHotspotHit = null;

    const cameraEase = 0.075;
    const dragFriction = 0.94;
    const dragSensitivity = 1.0;
    const autoRotateSpeed = 0.5;
    const autoRotateResumeDelay = 1500;

    let frameWidth = getPanoFrameSize().width;
    let frameHeight = getPanoFrameSize().height;
    let panoStripTop = getPanoFrameSize().top;
    let totalWidth = frameWidth * frameCount;

    /*
      Smooth ease-in/ease-out for button camera moves.
    */
    let buttonTweenActive = false;
    let buttonTweenStartOffset = 0;
    let buttonTweenEndOffset = 0;
    let buttonTweenStartTime = 0;
    const buttonTweenDuration = 2400;
    const buttonSettleDelay = 250;
    let buttonArrivalCallback = null;
    let buttonArrivalTimeout = null;

    /*
      Reusable sequence animation state.
    */
    let panoFrameCopies = Array.from({ length: frameCount }, () => []);
    let activeSequence = null;
    let sequenceCurrentIndex = 0;
    let sequencePlaying = false;
    let sequenceDirection = 1;
    let sequenceRAF = null;
    let sequenceLastTime = 0;

    let sequenceLottieAnimation = null;
    let sequenceLottieReady = false;
    let sequenceLottieLastFrame = -1;
    let sequenceLottieLoadPromise = null;
    let sequencePreparing = false;
    let sequencePreparationToken = 0;
    let sequenceLoadingTimer = null;
    const sequenceLottiePath = "lottie/RANDOM%20PLANK/RANDOM%20PLANK.json";

    let autoRotateRestartTimeout = null;

    function getPanoFrameSize() {
      /*
        Never stretch the renders.
        This calculates a true 16:9 frame that is zoomed enough to cover the viewer.
        If the browser becomes wider than 16:9, the frame gets wider and taller,
        then crops vertically instead of distorting the image.
      */
      const widthByHeight = window.innerHeight * panoFrameAspectRatio;
      const width = Math.max(window.innerWidth, widthByHeight);
      const height = width / panoFrameAspectRatio;
      const top = (window.innerHeight - height) / 2;

      return { width, height, top };
    }

    function syncPanoFrameWidthCSS() {
      const size = getPanoFrameSize();

      frameWidth = size.width;
      frameHeight = size.height;
      panoStripTop = size.top;
      totalWidth = frameWidth * frameCount;

      document.documentElement.style.setProperty("--pano-frame-width", `${frameWidth}px`);
      document.documentElement.style.setProperty("--pano-frame-height", `${frameHeight}px`);
      document.documentElement.style.setProperty("--pano-strip-top", `${panoStripTop}px`);
    }

    function easeInOutQuint(t) {
      return t < 0.5
        ? 16 * t * t * t * t * t
        : 1 - Math.pow(-2 * t + 2, 5) / 2;
    }

    function blueHotspotCurve(normalizedDistanceFromCenter) {
      /*
        Blue-curve hotspot scaling.
        normalizedDistanceFromCenter is 0 at the screen center and 1 at the screen edge.
        A Gaussian-style curve avoids the flat-topped / sudden red-curve feeling.
        Lower curveWidth = smaller/narrower center peak.
        Higher curveWidth = larger hotspots across more of the screen.
      */
      const d = Math.max(0, Math.min(normalizedDistanceFromCenter, 1));
      const curveWidth = 0.62;
      const edgeValue = Math.exp(-1 / (curveWidth * curveWidth));
      const value = Math.exp(-(d * d) / (curveWidth * curveWidth));

      return Math.max(0, Math.min((value - edgeValue) / (1 - edgeValue), 1));
    }

    function easeInOutSine(t) {
      const clamped = Math.max(0, Math.min(t, 1));
      return 0.5 - 0.5 * Math.cos(Math.PI * clamped);
    }

    function setParallaxTargetFromPointer() {
      // Parallax removed.
    }

    function beginParallaxReturn() {
      // Parallax removed; the panorama remains flat.
    }

    function forceParallaxNeutral() {
      scenePlane.style.transform = "none";
    }

    function releaseParallax() {
      // Parallax removed.
    }

    function updateScenePlaneTransform() {
      scenePlane.style.transform = "none";
    }
    function updatePointerPosition(event) {
      pointerX = event.clientX;
      pointerY = event.clientY;
      pointerInsideViewer = true;
      setParallaxTargetFromPointer();
    }

    function clearPointerPosition() {
      pointerX = -9999;
      pointerY = -9999;
      pointerInsideViewer = false;
    }

    function clearHotspotOverstates() {
      hoverPauseTarget = 0;
      pendingHotspotHit = null;

      hotspots.forEach((hotspot) => {
        hotspot.element.classList.remove("is-over");
      });
    }

    function getNearestHotspotToPointer(event, radius = hotspotHitRadius) {
      const x = event.clientX;
      const y = event.clientY;

      let nearestHotspot = null;
      let nearestDistance = Infinity;

      hotspots.forEach((hotspot) => {
        if (!hotspot._visible) return;

        const distance = Math.hypot(hotspot._screenX - x, hotspot._screenY - y);

        if (distance <= radius && distance < nearestDistance) {
          nearestHotspot = hotspot;
          nearestDistance = distance;
        }
      });

      return nearestHotspot;
    }

    function clearPendingArrivalCallback() {
      if (buttonArrivalTimeout) {
        clearTimeout(buttonArrivalTimeout);
        buttonArrivalTimeout = null;
      }

      buttonArrivalCallback = null;
    }

    function clearAutoRotateRestart() {
      if (autoRotateRestartTimeout) {
        clearTimeout(autoRotateRestartTimeout);
        autoRotateRestartTimeout = null;
      }
    }

    function scheduleAutoRotateResume(delay = 1000) {
      clearAutoRotateRestart();

      autoRotateRestartTimeout = setTimeout(() => {
        autoRotateRestartTimeout = null;

        if (
          !userPausedAutoRotate &&
          !isDragging &&
          !buttonTweenActive &&
          !sequencePlaying
        ) {
          autoRotate = true;
        }
      }, delay);
    }

    function setFrameButtonsVisible(visible) {
      frameButtonsWrapper.classList.toggle("hidden", !visible);
    }

    function showBackButton(show) {
      sequenceBackButton.style.display = show ? "block" : "none";
    }

    function setHotspotsVisible(visible) {
      hotspotsVisible = visible;

      if (!visible) {
        hotspots.forEach((hotspot) => {
          hotspot.element.classList.remove("is-over");
          hotspot.element.style.opacity = "0";
          hotspot.element.style.pointerEvents = "none";
        });
      }
    }

    async function preloadSequence(config) {
      if (!config) return false;
      if (config.imagesReady) return true;
      if (config.imagesPromise) return config.imagesPromise;

      config.imagesLoading = true;
      config.imagesReady = false;

      config.imagesPromise = (async () => {
        config.imageElements = config.frames.map((src) => {
          const img = new Image();
          img.src = src;
          return img;
        });

        await Promise.all(
          config.imageElements.map((img) => {
            if (img.complete) {
              return img.decode
                ? img.decode().catch(() => {})
                : Promise.resolve();
            }

            return new Promise((resolve) => {
              img.onload = async () => {
                if (img.decode) {
                  try {
                    await img.decode();
                  } catch (error) {}
                }
                resolve();
              };

              img.onerror = resolve;
            });
          })
        );

        config.imagesReady = true;
        config.imagesLoading = false;
        return true;
      })();

      return config.imagesPromise;
    }

    function preloadAllSequences() {
      sequenceConfigs.forEach((config) => preloadSequence(config));
    }

    function buildPanoramaStrip() {
      panoramaStrip.innerHTML = "";
      panoFrameCopies = Array.from({ length: frameCount }, () => []);

      for (let repeat = 0; repeat < 3; repeat++) {
        frames.forEach((src, frameIndex) => {
          const frame = document.createElement("div");
          frame.className = "panoFrame";
          frame.dataset.frameIndex = frameIndex;
          frame.style.backgroundImage = `url("${src}")`;
          panoramaStrip.appendChild(frame);
          panoFrameCopies[frameIndex].push(frame);
        });
      }

      syncPanoFrameWidthCSS();

      currentOffset = totalWidth;
      targetOffset = totalWidth;

      updateActiveFrameButton();
    }

    const hotspots = [
      {
        element: document.getElementById("hotspot1"),
        label: "Hotspot 1",
        frame: 0,
        x: 35.64,
        y: 33.36,
        offsetY: 60,
        title: "Hotspot 1",
        text: "CUSTOM CUT"
      },
      {
        element: document.getElementById("hotspot2"),
        label: "Hotspot 2",
        frame: 0,
        x: 58.8,
        y: 60.05,
        offsetY: -30,
        title: "Hotspot 2",
        text: "RANDOM PLANK"
      },
      {
        element: document.getElementById("hotspot3"),
        label: "Hotspot 3",
        frame: 0,
